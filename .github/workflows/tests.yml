name: tests

# The unit suite, on what backend/Dockerfile ships: Python 3.11 + requirements-light.txt.
#
# Tests marked `live` read production data or a third-party site and run locally only.
# CI holds no secrets and never reaches the database a subscriber reads. DATABASE_URL
# parses but refuses (port 1): an unmarked test that needs Postgres fails loudly here
# instead of passing on an empty database.
#
# Railway "Wait for CI" is on, so a red run on main stops production deploys. On main since
# 6 Oct 2026, after three green runs in a row on ci/postgres-service (2,906 passed each).
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-light.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-light.txt -r requirements-test.txt

      - name: Run the unit suite
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:1/ci
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
          # core.config.Settings requires these at import. Obvious non-secrets on purpose.
          SECRET_KEY: ci-not-a-real-secret
          SUPABASE_URL: https://ci.invalid
          SUPABASE_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_KEY: ci-not-a-real-key
          ANTHROPIC_API_KEY: ci-not-a-real-key
          OPENAI_API_KEY: ci-not-a-real-key
          STRIPE_SECRET_KEY: ci-not-a-real-key
          STRIPE_PUBLISHABLE_KEY: ci-not-a-real-key
        run: pytest tests -q -p no:cacheprovider -m "not live" --junit-xml=pytest-report.xml

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
