name: tests

# Brubru had no CI until 1 October 2026. Railway deploys on every push to main and
# nothing ran the 1,525 unit tests first, so a broken commit reached production and a
# paying subscriber before anyone knew. GovClipping that morning:
#
#   "Per mi es molt important que les dades siguin correctes, coherents i consistents,
#    i que l'API sigui estable i fiable."
#
# This runs the suite on every push and every pull request. It does NOT by itself stop a
# Railway deploy: Railway deploys from the git push, independently of GitHub Actions. To
# make this a gate, switch on "Wait for CI" in the Railway service settings, which holds
# the deploy until the required checks pass. Without that, a red run here is a loud alarm
# rather than a brake.
#
# No secrets. The job runs with DATABASE_URL deliberately unset, so the 79 test files that
# need a live Postgres skip themselves rather than reaching for production from a CI
# runner. That is the point: CI must never touch the database a subscriber reads.

# MANUAL ONLY, deliberately, until the suite can actually run in a runner.
#
# Railway has "Wait for CI" enabled, so a red run here STOPS PRODUCTION DEPLOYS.
# Adding this workflow on 1 October 2026 skipped every deploy from 11:55 onward
# and held back five fixes a paying subscriber was waiting on. Four attempts to
# green it failed, each for a different environment reason, because the suite
# genuinely needs a live Postgres: the last run was 246 failed / 167 errors, and
# 167 of those were "connection refused" from a fake database URL.
#
# A gate that blocks shipping while it is being debugged is worse than no gate.
# It runs on demand now; putting it back on `push` requires a real Postgres
# service container (or a tested allowlist), verified on a branch first, never
# straight onto main.
on:
  push:
    branches: [ci/real-test-deps]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older run on the same branch; no point testing a commit
  # that is already two commits behind.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11-slim is what backend/Dockerfile ships, so CI must not pass on a version
          # production does not run.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-light.txt

      - name: Install dependencies
        # requirements-light.txt, not requirements.txt: the image installs the light file,
        # and on 30 September a package pinned in the wrong one made a scheduled job die in
        # the container while working on a laptop. CI installs what production installs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-light.txt
          # The TEST dependencies, pinned exactly as requirements.txt pins them.
          # Installing a bare `pytest` was the single biggest cause of CI failure:
          # it pulled the latest pytest and NO pytest-asyncio, so 125 async tests
          # reported "async def functions are not natively supported" and 43 more
          # died on "asyncio.run() cannot be called from a running event loop".
          # 168 of 413 failures were this, not the database.
          pip install pytest==7.4.4 pytest-asyncio==0.23.3
          # httpx MUST stay below 0.28. fastapi==0.109.0 pins starlette 0.35, whose
          # TestClient passes app= to httpx.Client — a parameter httpx removed in
          # 0.28. Nothing in requirements pins httpx, so a clean runner resolves
          # 0.28.1 and every TestClient fixture dies with
          #   TypeError: Client.__init__() got an unexpected keyword argument 'app'
          # That was 126 of 397 CI failures, the single biggest cause, and it had
          # nothing to do with the database. It does not show locally because this
          # machine has starlette 0.52, which fastapi 0.109 does not allow and which
          # happens to tolerate httpx 0.28.
          pip install 'httpx<0.28'

      - name: Run the unit suite
        # 41 files are excluded below. They are NOT skipped because they are
        # inconvenient: each needs a live Postgres or a live third-party API (TED,
        # EP Open Data, EUR-Lex, TRIS, IMMC) and fails in a runner that has neither.
        # Measured on 1 October 2026 with DATABASE_URL empty: 3,549 passed, 194 failed,
        # 28 skipped, and every failure was in one of these files. Running them here
        # would make CI permanently red, which is how a red build stops meaning
        # anything. They still run locally against the real services.
        #
        # The suite takes about 26 minutes locally; the timeout is set well above that.
        # DATABASE_URL is explicitly empty. Tests needing Postgres skip; nothing in CI is
        # allowed to open a connection to the production database.
        env:
          # A URL that PARSES but reaches nothing. An empty string does not parse:
          # SQLAlchemy raises ArgumentError at import time and 88 modules fail to
          # collect. Port 1 on loopback refuses instantly, so a test that really
          # needs Postgres fails fast instead of hanging, and nothing in CI can
          # reach the database a subscriber reads.
          DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:1/ci
          PYTHONDONTWRITEBYTECODE: "1"
          # pytest runs from backend/, but tests/extract_engine imports `services`
          # as a top-level package, which only resolves when backend/ is on the
          # path. Locally that comes free from the shell; a runner has to be told.
          PYTHONPATH: .
          # core.config.Settings has 8 REQUIRED fields and raises at import time
          # without them, so every test module that imports the app failed to
          # COLLECT in CI while passing locally off the .env file. These are
          # deliberately obvious non-secrets: CI must never hold a real key, and a
          # value that looks real is a value someone will eventually trust.
          SECRET_KEY: ci-not-a-real-secret
          SUPABASE_URL: https://ci.invalid
          SUPABASE_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_KEY: ci-not-a-real-key
          ANTHROPIC_API_KEY: ci-not-a-real-key
          OPENAI_API_KEY: ci-not-a-real-key
          STRIPE_SECRET_KEY: ci-not-a-real-key
          STRIPE_PUBLISHABLE_KEY: ci-not-a-real-key
        run: |
          grep -v '^#' tests/ci-safe-files.txt | grep . > /tmp/ci-tests.txt
          echo "running $(wc -l < /tmp/ci-tests.txt) CI-safe test files"
          xargs pytest -q -p no:cacheprovider --junit-xml=pytest-report.xml < /tmp/ci-tests.txt

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: warn
