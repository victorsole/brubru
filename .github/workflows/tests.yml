name: tests

# Brubru had no CI until 1 October 2026. Railway deploys on every push to main and
# nothing ran the 1,525 unit tests first, so a broken commit reached production and a
# paying subscriber before anyone knew. GovClipping that morning:
#
#   "Per mi es molt important que les dades siguin correctes, coherents i consistents,
#    i que l'API sigui estable i fiable."
#
# This runs the suite on every push and every pull request. It does NOT by itself stop a
# Railway deploy: Railway deploys from the git push, independently of GitHub Actions. To
# make this a gate, switch on "Wait for CI" in the Railway service settings, which holds
# the deploy until the required checks pass. Without that, a red run here is a loud alarm
# rather than a brake.
#
# No secrets. The job runs with DATABASE_URL deliberately unset, so the 79 test files that
# need a live Postgres skip themselves rather than reaching for production from a CI
# runner. That is the point: CI must never touch the database a subscriber reads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older run on the same branch; no point testing a commit
  # that is already two commits behind.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11-slim is what backend/Dockerfile ships, so CI must not pass on a version
          # production does not run.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-light.txt

      - name: Install dependencies
        # requirements-light.txt, not requirements.txt: the image installs the light file,
        # and on 30 September a package pinned in the wrong one made a scheduled job die in
        # the container while working on a laptop. CI installs what production installs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-light.txt
          pip install pytest

      - name: Run the unit suite
        # 41 files are excluded below. They are NOT skipped because they are
        # inconvenient: each needs a live Postgres or a live third-party API (TED,
        # EP Open Data, EUR-Lex, TRIS, IMMC) and fails in a runner that has neither.
        # Measured on 1 October 2026 with DATABASE_URL empty: 3,549 passed, 194 failed,
        # 28 skipped, and every failure was in one of these files. Running them here
        # would make CI permanently red, which is how a red build stops meaning
        # anything. They still run locally against the real services.
        #
        # The suite takes about 26 minutes locally; the timeout is set well above that.
        # DATABASE_URL is explicitly empty. Tests needing Postgres skip; nothing in CI is
        # allowed to open a connection to the production database.
        env:
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest tests/ -q -p no:cacheprovider \
            --ignore=tests/seeds_quarantined \
            --ignore=tests/test_a_bot_challenge_is_never_a_body.py \
            --ignore=tests/test_backfill_api_key_last_used.py \
            --ignore=tests/test_celex_corrections_2026_09_30.py \
            --ignore=tests/test_council_documents_corpus.py \
            --ignore=tests/test_eea_news_full_bodies.py \
            --ignore=tests/test_ep_council_pipeline.py \
            --ignore=tests/test_ep_opendata_api.py \
            --ignore=tests/test_eurio_client.py \
            --ignore=tests/test_eurlex_client.py \
            --ignore=tests/test_immc_client.py \
            --ignore=tests/test_legislative_train_scraper.py \
            --ignore=tests/test_news_feed_item_types.py \
            --ignore=tests/test_oeil_scraper.py \
            --ignore=tests/test_ontology_drift.py \
            --ignore=tests/test_pagination_is_a_total_order.py \
            --ignore=tests/test_procurement_documents.py \
            --ignore=tests/test_rate_limit_is_retried_not_recorded.py \
            --ignore=tests/test_resolution_dates.py \
            --ignore=tests/test_response_validator.py \
            --ignore=tests/test_secondary_acts_have_act_dates.py \
            --ignore=tests/test_secondary_acts_identity.py \
            --ignore=tests/test_semantic_gating.py \
            --ignore=tests/test_social_x_tail_window.py \
            --ignore=tests/test_stance_open_lanes.py \
            --ignore=tests/test_tender_match_scheduler.py \
            --ignore=tests/test_tenders/test_ted_client.py \
            --ignore=tests/test_tenders/test_ted_full_day_ingest.py \
            --ignore=tests/test_tenders/test_ted_sparql_client.py \
            --ignore=tests/test_tenders/test_tender_context_provider.py \
            --ignore=tests/test_tenders/test_tenderator_api.py \
            --ignore=tests/test_texts_adopted_coverage.py \
            --ignore=tests/test_tris_budget.py \
            --ignore=tests/test_tris_feed.py \
            --ignore=tests/test_user_agent_freshness.py \
            --ignore=tests/test_v1_envelope.py \
            --ignore=tests/test_v1_new_endpoints.py \
            --ignore=tests/test_v1_publications.py \
            --ignore=tests/test_v1_rate_limiter.py \
            --ignore=tests/test_v2_commission.py \
            --ignore=tests/test_v2_news_institutional_union.py \
            --ignore=tests/test_validator_outcomes.py \
            --junit-xml=pytest-report.xml

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: warn
