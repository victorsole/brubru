name: oeil-probe

# Weekly full scan of the Parliament's Legislative Observatory (OEIL) by URL.
#
# It asks OEIL for every reference number of the year and keeps the pages that answer 200
# (backend/services/scrapers/oeil_probe.py, backend/scripts/oeil_probe_scan.py --mode full),
# then checks the result against the EP Open Data /procedures list (union of four paging runs)
# and probes every listed label the scan missed. It writes a CSV, a JSON feed and a summary.
#
# Public sources only: NO secrets and NO database. Reconciling against Brubru's own tables is
# the cron-sync audit's job (oeil_probe_audit), not this workflow's.
#
# Deliberately NOT triggered by push or pull_request: it reads a third-party site for about an
# hour, so it must never gate a merge or Railway's "Wait for CI". The offline unit tests of the
# same code run in tests.yml and DO gate main.
#
# Exit codes of the script: 0 clean, 1 the exact-label probe found procedures the scan missed
# (a warning here: the series or type assumptions drifted), 2 a wall, an outage or nothing found
# (the job fails).
on:
  schedule:
    - cron: "23 4 * * 1"       # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Procedure year to scan (default: the current year)"
        required: false
        type: string

concurrency:
  group: oeil-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, resolved 9 Oct 2026

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5, resolved 9 Oct 2026
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-light.txt

      # services/scrapers/__init__.py imports every scraper, so the probe needs the same
      # dependency set the unit suite installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-light.txt

      - name: Probe OEIL
        working-directory: backend
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          PROBE_YEAR: ${{ inputs.year }}
        run: |
          set +e
          YEAR="${PROBE_YEAR:-$(date -u +%Y)}"
          case "$YEAR" in
            20[0-9][0-9]) ;;
            *) echo "::error title=OEIL probe::the year must be four digits"; exit 2 ;;
          esac
          OUT="$RUNNER_TEMP/oeil"
          python scripts/oeil_probe_scan.py --mode full --year "$YEAR" --out "$OUT" --max-seconds 9000
          rc=$?
          if [ -f "$OUT/summary.md" ]; then cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning title=OEIL probe::the exact-label probe found procedures the scan missed; see the summary and the artifact"
            exit 0
          fi
          exit "$rc"

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4, resolved 9 Oct 2026
        with:
          name: oeil-probe
          path: ${{ runner.temp }}/oeil
          retention-days: 30
          if-no-files-found: ignore
