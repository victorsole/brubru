<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full API reference: Brubru EU Data API</title>
  <meta name="description" content="Complete, always-current reference for the Brubru EU Data API: 900+ endpoints across 87 EU institution folders (Parliament, Commission, Council, the EU agencies, funding, open data and Brubru's proprietary EU intelligence). Rendered live from the OpenAPI specification." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { --brand:#1a2b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff; }
    .ref-bar {
      display:flex; align-items:center; gap:1rem; padding:.7rem 1.25rem;
      background:var(--brand); color:#fff; font-size:.9rem; position:sticky; top:0; z-index:50;
    }
    .ref-bar a { color:#fff; text-decoration:none; opacity:.92; }
    .ref-bar a:hover { opacity:1; text-decoration:underline; }
    .ref-bar strong { font-weight:600; }
    .ref-bar .sep { opacity:.45; }
    .ref-loading { padding:3rem 1.5rem; color:#5a6478; font-size:.95rem; }

    /* Export toolbar — download any list endpoint as CSV / Excel / Google Sheets */
    .exp { border-bottom:1px solid #e6e8ef; background:#f7f8fc; padding:.75rem 1.25rem; font-size:.85rem; color:#2a3352; }
    .exp-head { display:flex; align-items:center; gap:.5rem; cursor:pointer; user-select:none; font-weight:600; }
    .exp-head .chev { transition:transform .15s; opacity:.6; }
    .exp.collapsed .exp-body { display:none; }
    .exp.collapsed .chev { transform:rotate(-90deg); }
    .exp-body { margin-top:.7rem; display:grid; grid-template-columns:1fr 2fr 1.4fr; gap:.6rem .9rem; align-items:end; max-width:1100px; }
    .exp label { display:flex; flex-direction:column; gap:.25rem; font-size:.78rem; color:#5a6478; }
    .exp input { padding:.5rem .6rem; border:1px solid #cfd4e4; border-radius:6px; font-size:.85rem; font-family:inherit; }
    .exp .btns { grid-column:1 / -1; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.2rem; }
    .exp button { border:0; border-radius:6px; padding:.5rem .9rem; font-size:.83rem; font-weight:600; cursor:pointer; color:#fff; background:var(--brand); }
    .exp button:hover { opacity:.9; }
    .exp button[disabled] { opacity:.5; cursor:not-allowed; }
    .exp .status { font-size:.8rem; color:#5a6478; }
    @media (max-width:820px){ .exp-body { grid-template-columns:1fr; } }
  </style>
    <script src="https://t.contentsquare.net/uxa/f2e32d332b6a1.js" defer></script>
</head>
<body>
  <div class="ref-bar">
    <a href="/api/docs/">&larr; Brubru EU Data API docs</a>
    <span class="sep">|</span>
    <strong>Full API reference</strong>
    <span class="sep">·</span>
    <span>live from the OpenAPI spec</span>
  </div>

  <!-- Export toolbar: any list endpoint -> CSV / Excel / Google Sheets, one click. -->
  <div class="exp collapsed" id="exp">
    <div class="exp-head" onclick="document.getElementById('exp').classList.toggle('collapsed')">
      <span class="chev">▾</span> Export data as CSV, Excel or Google Sheets
    </div>
    <div class="exp-body">
      <label>Your API key
        <input id="exp-key" type="password" autocomplete="off" placeholder="brubru_live_…" />
      </label>
      <label>Endpoint
        <input id="exp-path" list="exp-paths" placeholder="/api/v2/geographical-indications/geometry" />
        <datalist id="exp-paths"></datalist>
      </label>
      <label>Filters (optional)
        <input id="exp-params" placeholder="country=ES&amp;limit=500" />
      </label>
      <div class="btns">
        <button data-fmt="csv">⬇ CSV</button>
        <button data-fmt="xlsx">⬇ Excel</button>
        <button data-fmt="sheets">⬇ Google Sheets</button>
        <span class="status" id="exp-status">Every list endpoint supports this. Your key is stored only in this browser.</span>
      </div>
    </div>
  </div>

  <div id="ref-fallback" class="ref-loading">Loading the live API reference&hellip; (900+ endpoints across 87 EU institution folders)</div>
  <!-- Scalar renders the live v2 OpenAPI spec served by the API host (CORS-enabled
       for brubru.beresol.eu), so this page always reflects every deployed endpoint
       with zero hand-maintenance. -->
  <script id="api-reference" data-url="https://brubru-production.up.railway.app/api/openapi.json"></script>
  <script>
    window.configuration = { theme: "default", layout: "modern", hideDownloadButton: false };
    setTimeout(function(){ var f=document.getElementById('ref-fallback'); if(f) f.style.display='none'; }, 2500);

    // ---- Export toolbar logic ----
    (function(){
      var HOST = "https://brubru-production.up.railway.app";  // API host (same as Scalar spec)
      var keyEl = document.getElementById('exp-key');
      var pathEl = document.getElementById('exp-path');
      var paramsEl = document.getElementById('exp-params');
      var statusEl = document.getElementById('exp-status');
      // remember the key locally only
      try { keyEl.value = localStorage.getItem('brubru_api_key') || ''; } catch(e){}
      keyEl.addEventListener('change', function(){ try { localStorage.setItem('brubru_api_key', keyEl.value.trim()); } catch(e){} });

      // populate the endpoint list from the live OpenAPI spec (GET list paths, no {params})
      fetch(HOST + "/api/openapi.json").then(function(r){ return r.json(); }).then(function(spec){
        var dl = document.getElementById('exp-paths');
        Object.keys(spec.paths || {}).sort().forEach(function(p){
          if (p.indexOf('{') !== -1) return;                 // skip detail-by-id paths
          if (!(spec.paths[p] || {}).get) return;            // list endpoints are GET
          var o = document.createElement('option'); o.value = p; dl.appendChild(o);
        });
      }).catch(function(){});

      function download(fmt){
        var key = keyEl.value.trim();
        var path = pathEl.value.trim();
        if (!key){ statusEl.textContent = "Paste your API key first."; return; }
        if (!path){ statusEl.textContent = "Choose an endpoint."; return; }
        if (path.indexOf('/') !== 0) path = '/' + path;
        var qp = paramsEl.value.trim().replace(/^[?&]/,'');
        var apiFmt = (fmt === 'sheets') ? 'csv' : fmt;
        var url = HOST + path + (qp ? ('?' + qp + '&') : '?') + 'format=' + apiFmt;
        statusEl.textContent = "Fetching…";
        fetch(url, { headers: { 'X-API-Key': key } }).then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.blob();
        }).then(function(blob){
          var ext = apiFmt;
          var fname = (path.replace(/\/+$/,'').split('/').pop() || 'export') + '.' + ext;
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove();
          if (fmt === 'sheets'){
            statusEl.innerHTML = 'CSV downloaded. Opening Google Sheets — then <strong>File ▸ Import ▸ Upload</strong> the file.';
            window.open('https://sheets.new', '_blank');
          } else {
            statusEl.textContent = ext.toUpperCase() + ' downloaded: ' + fname;
          }
        }).catch(function(e){ statusEl.textContent = 'Failed: ' + e.message + ' (check the key, endpoint and your balance).'; });
      }
      Array.prototype.forEach.call(document.querySelectorAll('.exp button'), function(b){
        b.addEventListener('click', function(){ download(b.getAttribute('data-fmt')); });
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
