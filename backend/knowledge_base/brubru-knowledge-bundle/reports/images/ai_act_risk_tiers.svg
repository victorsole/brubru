<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="70" fill="url(#headerBlue)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">EU AI Act: Risk-Based Classification Framework</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#bfdbfe">Four-tier approach determining regulatory obligations | Regulation (EU) 2024/1689</text>

  <!-- Pyramid visualization -->
  <g transform="translate(80, 100)">
    <!-- Unacceptable Risk - Top -->
    <polygon points="220,0 320,80 120,80" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="220" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="white">UNACCEPTABLE</text>
    <text x="220" y="65" text-anchor="middle" font-size="9" fill="#fecaca">Prohibited</text>

    <!-- High Risk -->
    <polygon points="120,90 320,90 370,170 70,170" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="220" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="white">HIGH RISK</text>
    <text x="220" y="145" text-anchor="middle" font-size="9" fill="#fed7aa">Strict requirements</text>

    <!-- Limited Risk -->
    <polygon points="70,180 370,180 420,260 20,260" fill="url(#yellowGrad)" filter="url(#shadow)"/>
    <text x="220" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">LIMITED RISK</text>
    <text x="220" y="235" text-anchor="middle" font-size="9" fill="#92400e">Transparency obligations</text>

    <!-- Minimal Risk -->
    <polygon points="20,270 420,270 470,350 -30,350" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="220" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="white">MINIMAL RISK</text>
    <text x="220" y="325" text-anchor="middle" font-size="9" fill="#dcfce7">No specific obligations</text>
  </g>

  <!-- Right side: Details -->
  <g transform="translate(500, 95)">
    <!-- Unacceptable -->
    <rect x="0" y="0" width="360" height="75" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="75" rx="4" fill="#dc2626"/>
    <text x="20" y="22" font-size="12" font-weight="600" fill="#dc2626">Prohibited Practices</text>
    <text x="20" y="40" font-size="9" fill="#64748b">Social scoring, real-time biometric ID,</text>
    <text x="20" y="52" font-size="9" fill="#64748b">emotion recognition at work, subliminal</text>
    <text x="20" y="64" font-size="9" fill="#64748b">manipulation, predictive policing</text>

    <!-- High Risk -->
    <rect x="0" y="85" width="360" height="85" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="85" width="8" height="85" rx="4" fill="#f97316"/>
    <text x="20" y="107" font-size="12" font-weight="600" fill="#f97316">High-Risk AI Systems</text>
    <text x="20" y="125" font-size="9" fill="#64748b">Biometrics, critical infrastructure, education,</text>
    <text x="20" y="137" font-size="9" fill="#64748b">employment, essential services, law enforcement,</text>
    <text x="20" y="149" font-size="9" fill="#64748b">migration, justice. Requires conformity assessment.</text>
    <text x="280" y="160" font-size="10" font-weight="600" fill="#f97316">~6,000-7,000 systems</text>

    <!-- Limited Risk -->
    <rect x="0" y="180" width="360" height="75" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="180" width="8" height="75" rx="4" fill="#fbbf24"/>
    <text x="20" y="202" font-size="12" font-weight="600" fill="#d97706">Limited Risk</text>
    <text x="20" y="220" font-size="9" fill="#64748b">Chatbots, deepfakes, emotion recognition</text>
    <text x="20" y="232" font-size="9" fill="#64748b">(non-prohibited). Must disclose AI interaction</text>
    <text x="20" y="244" font-size="9" fill="#64748b">and label synthetic content.</text>

    <!-- Minimal Risk -->
    <rect x="0" y="265" width="360" height="75" rx="8" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="265" width="8" height="75" rx="4" fill="#22c55e"/>
    <text x="20" y="287" font-size="12" font-weight="600" fill="#16a34a">Minimal Risk</text>
    <text x="20" y="305" font-size="9" fill="#64748b">AI-enabled video games, spam filters,</text>
    <text x="20" y="317" font-size="9" fill="#64748b">inventory management. Voluntary codes</text>
    <text x="20" y="329" font-size="9" fill="#64748b">of conduct encouraged but not required.</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(40, 460)">
    <rect width="820" height="30" rx="5" fill="#dbeafe"/>
    <text x="410" y="20" text-anchor="middle" font-size="10" fill="#1e40af">General-Purpose AI Models (GPAI) subject to separate regime: documentation requirements for all; systemic risk obligations if >10²⁵ FLOPs</text>
  </g>
</svg>