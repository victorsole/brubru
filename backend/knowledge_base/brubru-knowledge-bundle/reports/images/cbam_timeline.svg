<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="70" fill="url(#headerGreen)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">CBAM Implementation: Free Allowance Phase-Out</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#d1fae5">CBAM liability increases as ETS free allowances decrease | 2026-2034</text>

  <!-- Chart area -->
  <g transform="translate(80, 100)">
    <!-- Y-axis labels -->
    <text x="-15" y="15" text-anchor="end" font-size="9" fill="#64748b">100%</text>
    <text x="-15" y="65" text-anchor="end" font-size="9" fill="#64748b">75%</text>
    <text x="-15" y="115" text-anchor="end" font-size="9" fill="#64748b">50%</text>
    <text x="-15" y="165" text-anchor="end" font-size="9" fill="#64748b">25%</text>
    <text x="-15" y="215" text-anchor="end" font-size="9" fill="#64748b">0%</text>

    <!-- Grid lines -->
    <line x1="0" y1="10" x2="740" y2="10" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="0" y1="60" x2="740" y2="60" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="0" y1="110" x2="740" y2="110" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="0" y1="160" x2="740" y2="160" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="0" y1="210" x2="740" y2="210" stroke="#94a3b8" stroke-width="2"/>

    <!-- Bars: Free allowances (grey) + CBAM (teal) -->
    <!-- 2026: 97.5% free, 2.5% CBAM -->
    <g transform="translate(20, 0)">
      <rect x="0" y="15" width="60" height="195" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="205" width="60" height="5" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2026</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">2.5%</text>
    </g>

    <!-- 2027: 95% free, 5% CBAM -->
    <g transform="translate(100, 0)">
      <rect x="0" y="20" width="60" height="190" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="200" width="60" height="10" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2027</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">5%</text>
    </g>

    <!-- 2028: 90% free, 10% CBAM -->
    <g transform="translate(180, 0)">
      <rect x="0" y="30" width="60" height="180" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="190" width="60" height="20" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2028</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">10%</text>
    </g>

    <!-- 2029: 77.5% free, 22.5% CBAM -->
    <g transform="translate(260, 0)">
      <rect x="0" y="55" width="60" height="155" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="165" width="60" height="45" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2029</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">22.5%</text>
    </g>

    <!-- 2030: 51.5% free, 48.5% CBAM -->
    <g transform="translate(340, 0)">
      <rect x="0" y="107" width="60" height="103" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="113" width="60" height="97" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2030</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">48.5%</text>
    </g>

    <!-- 2031: 39% free, 61% CBAM -->
    <g transform="translate(420, 0)">
      <rect x="0" y="132" width="60" height="78" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="88" width="60" height="122" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2031</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">61%</text>
    </g>

    <!-- 2032: 26.5% free, 73.5% CBAM -->
    <g transform="translate(500, 0)">
      <rect x="0" y="157" width="60" height="53" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="63" width="60" height="147" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2032</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">73.5%</text>
    </g>

    <!-- 2033: 14% free, 86% CBAM -->
    <g transform="translate(580, 0)">
      <rect x="0" y="182" width="60" height="28" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="38" width="60" height="172" rx="2" fill="url(#barGrad)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="500" fill="#1e293b">2033</text>
      <text x="30" y="245" text-anchor="middle" font-size="8" fill="#0d9488">86%</text>
    </g>

    <!-- 2034: 0% free, 100% CBAM -->
    <g transform="translate(660, 0)">
      <rect x="0" y="10" width="60" height="200" rx="3" fill="url(#barGrad)" filter="url(#shadow)"/>
      <text x="30" y="230" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">2034</text>
      <text x="30" y="245" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">100%</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="740" height="50" rx="8" fill="white" filter="url(#shadow)"/>

    <rect x="20" y="15" width="20" height="20" rx="3" fill="#e2e8f0"/>
    <text x="50" y="30" font-size="10" fill="#1e293b">ETS Free Allowances (phasing out)</text>

    <rect x="250" y="15" width="20" height="20" rx="3" fill="url(#barGrad)"/>
    <text x="280" y="30" font-size="10" fill="#1e293b">CBAM Liability (phasing in)</text>

    <text x="550" y="25" font-size="9" fill="#64748b">Full CBAM by 2034:</text>
    <text x="550" y="38" font-size="9" font-weight="600" fill="#0d9488">Zero free allowances for covered sectors</text>
  </g>
</svg>