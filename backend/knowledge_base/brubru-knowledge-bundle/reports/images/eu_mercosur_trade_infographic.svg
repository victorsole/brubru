<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134D28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B6B9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a8fc4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#greenGrad)"/>
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">EU-MERCOSUR TRADE AGREEMENT: KEY FIGURES</text>
  
  <!-- Subtitle -->
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Open Report #2 | Beresol EU Public Affairs Consultancy | December 2025</text>
  
  <!-- Main Statistics Row -->
  <!-- Stat Box 1: Market Size -->
  <rect x="50" y="140" width="250" height="120" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="50" y="140" width="250" height="8" rx="4" fill="#134D28"/>
  <text x="175" y="185" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#134D28" text-anchor="middle">780M</text>
  <text x="175" y="215" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Combined Population</text>
  <text x="175" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">(EU + Mercosur)</text>
  
  <!-- Stat Box 2: Tariff Savings -->
  <rect x="325" y="140" width="250" height="120" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="325" y="140" width="250" height="8" rx="4" fill="#3B6B9C"/>
  <text x="450" y="185" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#3B6B9C" text-anchor="middle">€4B</text>
  <text x="450" y="215" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Annual Tariff Savings</text>
  <text x="450" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">for EU exporters</text>
  
  <!-- Stat Box 3: Trade Value -->
  <rect x="600" y="140" width="250" height="120" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="600" y="140" width="250" height="8" rx="4" fill="#F5B800"/>
  <text x="725" y="185" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#D97706" text-anchor="middle">€57B</text>
  <text x="725" y="215" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">EU Exports to Mercosur</text>
  <text x="725" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">(2024)</text>
  
  <!-- Stat Box 4: Tariff Elimination -->
  <rect x="875" y="140" width="275" height="120" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="875" y="140" width="275" height="8" rx="4" fill="#134D28"/>
  <text x="1012" y="185" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#134D28" text-anchor="middle">91%</text>
  <text x="1012" y="215" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Tariffs to be Eliminated</text>
  <text x="1012" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">over 15 years</text>
  
  <!-- Agricultural Quotas Section -->
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#134D28">AGRICULTURAL IMPORT QUOTAS (% of EU Consumption)</text>
  
  <!-- Bar Chart -->
  <g transform="translate(50, 330)">
    <!-- Beef -->
    <rect x="0" y="0" width="150" height="35" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="0" width="22.5" height="35" rx="4" fill="#DC2626"/>
    <text x="160" y="24" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Beef: 1.5%</text>
    <text x="280" y="24" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">(99,000 tonnes @ 7.5% duty)</text>
    
    <!-- Poultry -->
    <rect x="0" y="50" width="150" height="35" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="50" width="19.5" height="35" rx="4" fill="#F59E0B"/>
    <text x="160" y="74" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Poultry: 1.3%</text>
    <text x="280" y="74" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">(180,000 tonnes duty-free)</text>
    
    <!-- Sugar -->
    <rect x="0" y="100" width="150" height="35" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="100" width="16.5" height="35" rx="4" fill="#10B981"/>
    <text x="160" y="124" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Sugar: 1.1%</text>
    <text x="280" y="124" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">(180,000 tonnes duty-free)</text>
    
    <!-- Rice -->
    <rect x="0" y="150" width="150" height="35" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="150" width="21" height="35" rx="4" fill="#3B82F6"/>
    <text x="160" y="174" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Rice: 1.4%</text>
    <text x="280" y="174" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">(60,000 tonnes duty-free)</text>
    
    <!-- Honey -->
    <rect x="0" y="200" width="150" height="35" rx="4" fill="#e5e7eb"/>
    <rect x="0" y="200" width="150" height="35" rx="4" fill="#8B5CF6"/>
    <text x="160" y="224" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Honey: ~10%</text>
    <text x="280" y="224" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">(45,000 tonnes duty-free)</text>
  </g>
  
  <!-- EU Benefits Section -->
  <g transform="translate(600, 310)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3B6B9C">EU EXPORT BENEFITS</text>
    
    <rect x="0" y="20" width="550" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    <circle cx="30" cy="45" r="15" fill="#134D28"/>
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1</text>
    <text x="55" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Automobiles</text>
    <text x="55" y="57" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Tariff reduction from 35% to 0% (15-year phase-in)</text>
    
    <rect x="0" y="80" width="550" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    <circle cx="30" cy="105" r="15" fill="#3B6B9C"/>
    <text x="30" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2</text>
    <text x="55" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Wine &amp; Spirits</text>
    <text x="55" y="117" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Elimination of 17-35% duties + 350 GIs protected</text>
    
    <rect x="0" y="140" width="550" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    <circle cx="30" cy="165" r="15" fill="#F5B800"/>
    <text x="30" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3</text>
    <text x="55" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Dairy (Cheese)</text>
    <text x="55" y="177" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">30,000 tonnes duty-free quota + GI protection</text>
    
    <rect x="0" y="200" width="550" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    <circle cx="30" cy="225" r="15" fill="#10B981"/>
    <text x="30" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">4</text>
    <text x="55" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Machinery &amp; Chemicals</text>
    <text x="55" y="237" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Progressive elimination of 14-20% tariffs</text>
  </g>
  
  <!-- Member State Positions -->
  <text x="50" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#134D28">MEMBER STATE POSITIONS (December 2025)</text>
  
  <g transform="translate(50, 620)">
    <!-- Opposition -->
    <rect x="0" y="0" width="350" height="130" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="175" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">OPPOSING / CONCERNED</text>
    <text x="175" y="50" font-family="Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">France • Italy • Poland</text>
    <text x="175" y="70" font-family="Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Hungary • Austria • Ireland</text>
    <text x="175" y="100" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Potential blocking minority formed</text>
    <text x="175" y="118" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(≥35% EU population required)</text>
    
    <!-- Support -->
    <rect x="380" y="0" width="350" height="130" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="555" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">SUPPORTIVE</text>
    <text x="555" y="50" font-family="Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Germany • Spain</text>
    <text x="555" y="70" font-family="Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Nordic Countries</text>
    <text x="555" y="100" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Industrial export interests</text>
    <text x="555" y="118" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Trade diversification priority</text>
    
    <!-- Timeline -->
    <rect x="760" y="0" width="390" height="130" rx="10" fill="white" stroke="#3B6B9C" stroke-width="2"/>
    <text x="955" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B6B9C" text-anchor="middle">TIMELINE</text>
    <text x="955" y="55" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Dec 2024: Agreement concluded</text>
    <text x="955" y="75" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Sep 2025: Submitted to Council</text>
    <text x="955" y="95" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Dec 2025: Safeguards agreed</text>
    <text x="955" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3B6B9C" text-anchor="middle">Jan 2026: Signing expected</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="770" width="1200" height="30" fill="#134D28"/>
  <text x="600" y="790" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">© 2025 Beresol | www.beresol.eu | Open Report #2: EU-Mercosur Agreement</text>
</svg>
