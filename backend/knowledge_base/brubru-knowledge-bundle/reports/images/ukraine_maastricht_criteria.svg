<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="euroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="70" fill="url(#euroGrad)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">Ukraine vs. Maastricht Convergence Criteria</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#bfdbfe">Euro adoption requirements | All criteria currently failed by substantial margins</text>

  <!-- Euro symbol decoration -->
  <text x="50" y="50" font-size="40" fill="white" opacity="0.2">€</text>
  <text x="850" y="50" font-size="40" fill="white" opacity="0.2">€</text>

  <!-- Criteria cards -->

  <!-- Budget Deficit -->
  <g transform="translate(40, 95)">
    <rect width="160" height="200" rx="10" fill="white" filter="url(#cardShadow)"/>
    <rect width="160" height="8" rx="4" fill="#ef4444"/>

    <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Budget Deficit</text>
    <text x="80" y="55" text-anchor="middle" font-size="9" fill="#64748b">% of GDP</text>

    <!-- Threshold bar -->
    <rect x="20" y="75" width="120" height="20" rx="4" fill="#dcfce7"/>
    <text x="30" y="89" font-size="10" font-weight="500" fill="#16a34a">EU: ≤3%</text>

    <!-- Ukraine bar (showing 20% of max scale) -->
    <rect x="20" y="105" width="120" height="50" rx="4" fill="#fef2f2"/>
    <rect x="20" y="105" width="120" height="50" rx="4" fill="#fee2e2"/>
    <text x="80" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">17-24%</text>

    <!-- Gap indicator -->
    <rect x="20" y="165" width="120" height="25" rx="4" fill="#fecaca"/>
    <text x="80" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">5-8x above</text>
  </g>

  <!-- Public Debt -->
  <g transform="translate(215, 95)">
    <rect width="160" height="200" rx="10" fill="white" filter="url(#cardShadow)"/>
    <rect width="160" height="8" rx="4" fill="#ef4444"/>

    <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Public Debt</text>
    <text x="80" y="55" text-anchor="middle" font-size="9" fill="#64748b">% of GDP</text>

    <!-- Threshold bar -->
    <rect x="20" y="75" width="120" height="20" rx="4" fill="#dcfce7"/>
    <text x="30" y="89" font-size="10" font-weight="500" fill="#16a34a">EU: ≤60%</text>

    <!-- Ukraine bar -->
    <rect x="20" y="105" width="120" height="50" rx="4" fill="#fee2e2"/>
    <text x="80" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">90-101%</text>

    <!-- Gap indicator -->
    <rect x="20" y="165" width="120" height="25" rx="4" fill="#fecaca"/>
    <text x="80" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">1.5-1.7x above</text>
  </g>

  <!-- Inflation -->
  <g transform="translate(390, 95)">
    <rect width="160" height="200" rx="10" fill="white" filter="url(#cardShadow)"/>
    <rect width="160" height="8" rx="4" fill="#f97316"/>

    <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Inflation</text>
    <text x="80" y="55" text-anchor="middle" font-size="9" fill="#64748b">Annual rate</text>

    <!-- Threshold bar -->
    <rect x="20" y="75" width="120" height="20" rx="4" fill="#dcfce7"/>
    <text x="30" y="89" font-size="10" font-weight="500" fill="#16a34a">EU: ~3-4%</text>

    <!-- Ukraine bar -->
    <rect x="20" y="105" width="120" height="50" rx="4" fill="#ffedd5"/>
    <text x="80" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">9-12%</text>

    <!-- Gap indicator -->
    <rect x="20" y="165" width="120" height="25" rx="4" fill="#fed7aa"/>
    <text x="80" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">~3x above</text>
  </g>

  <!-- Interest Rate -->
  <g transform="translate(565, 95)">
    <rect width="160" height="200" rx="10" fill="white" filter="url(#cardShadow)"/>
    <rect width="160" height="8" rx="4" fill="#f97316"/>

    <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Interest Rate</text>
    <text x="80" y="55" text-anchor="middle" font-size="9" fill="#64748b">Long-term bonds</text>

    <!-- Threshold bar -->
    <rect x="20" y="75" width="120" height="20" rx="4" fill="#dcfce7"/>
    <text x="30" y="89" font-size="10" font-weight="500" fill="#16a34a">EU: ~5-6%</text>

    <!-- Ukraine bar -->
    <rect x="20" y="105" width="120" height="50" rx="4" fill="#ffedd5"/>
    <text x="80" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">15.5%</text>

    <!-- Gap indicator -->
    <rect x="20" y="165" width="120" height="25" rx="4" fill="#fed7aa"/>
    <text x="80" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">~3x above</text>
  </g>

  <!-- ERM II -->
  <g transform="translate(740, 95)">
    <rect width="120" height="200" rx="10" fill="white" filter="url(#cardShadow)"/>
    <rect width="120" height="8" rx="4" fill="#64748b"/>

    <text x="60" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">ERM II</text>
    <text x="60" y="55" text-anchor="middle" font-size="9" fill="#64748b">Participation</text>

    <!-- Threshold -->
    <rect x="15" y="75" width="90" height="20" rx="4" fill="#dcfce7"/>
    <text x="60" y="89" text-anchor="middle" font-size="9" font-weight="500" fill="#16a34a">2 years min</text>

    <!-- Ukraine status -->
    <rect x="15" y="105" width="90" height="50" rx="4" fill="#f1f5f9"/>
    <text x="60" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Not</text>
    <text x="60" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">participating</text>

    <!-- Gap -->
    <rect x="15" y="165" width="90" height="25" rx="4" fill="#e2e8f0"/>
    <text x="60" y="182" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">N/A</text>
  </g>

  <!-- Timeline projection -->
  <g transform="translate(40, 315)">
    <rect width="820" height="120" rx="10" fill="white" filter="url(#cardShadow)"/>

    <text x="30" y="30" font-size="13" font-weight="600" fill="#1e293b">Realistic Euro Adoption Timeline</text>

    <!-- Timeline -->
    <line x1="50" y1="70" x2="780" y2="70" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Milestones -->
    <circle cx="100" cy="70" r="8" fill="#3b82f6"/>
    <text x="100" y="55" text-anchor="middle" font-size="9" font-weight="500" fill="#1e293b">EU Accession</text>
    <text x="100" y="90" text-anchor="middle" font-size="8" fill="#64748b">~2030-2032</text>

    <circle cx="300" cy="70" r="8" fill="#8b5cf6"/>
    <text x="300" y="55" text-anchor="middle" font-size="9" font-weight="500" fill="#1e293b">Post-war Recovery</text>
    <text x="300" y="90" text-anchor="middle" font-size="8" fill="#64748b">2032-2038</text>

    <circle cx="500" cy="70" r="8" fill="#f59e0b"/>
    <text x="500" y="55" text-anchor="middle" font-size="9" font-weight="500" fill="#1e293b">ERM II Entry</text>
    <text x="500" y="90" text-anchor="middle" font-size="8" fill="#64748b">~2038-2040</text>

    <circle cx="700" cy="70" r="8" fill="#22c55e"/>
    <text x="700" y="55" text-anchor="middle" font-size="9" font-weight="500" fill="#1e293b">Euro Adoption</text>
    <text x="700" y="90" text-anchor="middle" font-size="8" fill="#64748b">2040s earliest</text>

    <!-- Note -->
    <text x="30" y="110" font-size="9" fill="#64748b">Precedent: Estonia 7 years, Lithuania 11 years, Croatia 9.5 years, Bulgaria 19 years from EU accession to euro</text>
  </g>
</svg>