<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="70" fill="url(#headerGreen)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">AI Act Compliance Cost Estimates</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#d1fae5">Per-system and annual costs by organisation type and risk category</text>

  <!-- Cost bars visualization -->
  <g transform="translate(50, 100)">
    <!-- Y axis label -->
    <text x="-10" y="150" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90, -10, 150)">Estimated Cost (EUR)</text>

    <!-- Scale -->
    <text x="140" y="20" text-anchor="end" font-size="9" fill="#94a3b8">€15M</text>
    <line x1="145" y1="16" x2="800" y2="16" stroke="#e2e8f0" stroke-dasharray="4"/>

    <text x="140" y="80" text-anchor="end" font-size="9" fill="#94a3b8">€5M</text>
    <line x1="145" y1="76" x2="800" y2="76" stroke="#e2e8f0" stroke-dasharray="4"/>

    <text x="140" y="140" text-anchor="end" font-size="9" fill="#94a3b8">€2M</text>
    <line x1="145" y1="136" x2="800" y2="136" stroke="#e2e8f0" stroke-dasharray="4"/>

    <text x="140" y="200" text-anchor="end" font-size="9" fill="#94a3b8">€500K</text>
    <line x1="145" y1="196" x2="800" y2="196" stroke="#e2e8f0" stroke-dasharray="4"/>

    <text x="140" y="260" text-anchor="end" font-size="9" fill="#94a3b8">€200K</text>
    <line x1="145" y1="256" x2="800" y2="256" stroke="#e2e8f0" stroke-dasharray="4"/>

    <!-- Baseline -->
    <line x1="145" y1="280" x2="800" y2="280" stroke="#94a3b8" stroke-width="2"/>

    <!-- Large Enterprise High-Risk -->
    <g transform="translate(180, 0)">
      <rect x="0" y="244" width="100" height="36" rx="4" fill="#f97316" filter="url(#shadow)"/>
      <text x="50" y="295" text-anchor="middle" font-size="9" fill="#1e293b">Large Enterprise</text>
      <text x="50" y="307" text-anchor="middle" font-size="8" fill="#64748b">(High-Risk)</text>
      <text x="50" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">€200-400K</text>
      <text x="50" y="248" text-anchor="middle" font-size="8" fill="#64748b">per system</text>
    </g>

    <!-- SME High-Risk -->
    <g transform="translate(300, 0)">
      <rect x="0" y="252" width="100" height="28" rx="4" fill="#fbbf24" filter="url(#shadow)"/>
      <text x="50" y="295" text-anchor="middle" font-size="9" fill="#1e293b">SME</text>
      <text x="50" y="307" text-anchor="middle" font-size="8" fill="#64748b">(High-Risk)</text>
      <text x="50" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">€100-200K</text>
      <text x="50" y="256" text-anchor="middle" font-size="8" fill="#64748b">per system</text>
    </g>

    <!-- GPAI Non-Systemic -->
    <g transform="translate(420, 0)">
      <rect x="0" y="168" width="100" height="112" rx="4" fill="#8b5cf6" filter="url(#shadow)"/>
      <text x="50" y="295" text-anchor="middle" font-size="9" fill="#1e293b">GPAI Provider</text>
      <text x="50" y="307" text-anchor="middle" font-size="8" fill="#64748b">(Non-Systemic)</text>
      <text x="50" y="159" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">€0.5-2M</text>
      <text x="50" y="172" text-anchor="middle" font-size="8" fill="#64748b">total</text>
    </g>

    <!-- GPAI Systemic Risk -->
    <g transform="translate(540, 0)">
      <rect x="0" y="16" width="100" height="264" rx="4" fill="#dc2626" filter="url(#shadow)"/>
      <text x="50" y="295" text-anchor="middle" font-size="9" fill="#1e293b">GPAI Provider</text>
      <text x="50" y="307" text-anchor="middle" font-size="8" fill="#64748b">(Systemic Risk)</text>
      <text x="50" y="8" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">€5-15M</text>
      <text x="50" y="-5" text-anchor="middle" font-size="8" fill="#991b1b">annually</text>
    </g>

    <!-- Penalties reference -->
    <g transform="translate(680, 0)">
      <rect x="0" y="80" width="110" height="200" rx="6" fill="#fef2f2" filter="url(#shadow)"/>
      <text x="55" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Max Penalties</text>
      <line x1="15" y1="110" x2="95" y2="110" stroke="#fecaca"/>
      <text x="55" y="130" text-anchor="middle" font-size="9" fill="#1e293b">Prohibited:</text>
      <text x="55" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">€35M / 7%</text>
      <text x="55" y="170" text-anchor="middle" font-size="9" fill="#1e293b">High-Risk:</text>
      <text x="55" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#f97316">€15M / 3%</text>
      <text x="55" y="210" text-anchor="middle" font-size="9" fill="#1e293b">GPAI:</text>
      <text x="55" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#8b5cf6">€15M / 3%</text>
      <text x="55" y="250" text-anchor="middle" font-size="8" fill="#64748b">of global</text>
      <text x="55" y="262" text-anchor="middle" font-size="8" fill="#64748b">turnover</text>
    </g>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(50, 375)">
    <rect width="800" height="35" rx="6" fill="#fef3c7"/>
    <text x="400" y="22" text-anchor="middle" font-size="10" font-weight="500" fill="#92400e">Market Impact: 23% of EU AI startups reconsidering high-risk applications due to compliance costs | SMEs face disproportionate burden</text>
  </g>
</svg>