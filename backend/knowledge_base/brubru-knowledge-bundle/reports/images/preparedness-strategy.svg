<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3d26"/>
      <stop offset="100%" style="stop-color:#2d5a3d"/>
    </linearGradient>
    <linearGradient id="pillar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pillar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="pillar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="80" fill="url(#headerGrad)"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="white">EU Preparedness Union Strategy</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#94d5aa">Adopted 26 March 2025 | 30 Key Actions | 60 Implementation Steps</text>

  <!-- EU flag decoration -->
  <circle cx="60" cy="40" r="25" fill="#003399" opacity="0.3"/>
  <circle cx="840" cy="40" r="25" fill="#003399" opacity="0.3"/>

  <!-- Three Pillars -->

  <!-- Pillar 1: All-hazards approach -->
  <g transform="translate(60, 110)">
    <rect width="250" height="340" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect width="250" height="8" rx="4" fill="url(#pillar1)"/>

    <!-- Icon -->
    <circle cx="125" cy="55" r="35" fill="#eff6ff" filter="url(#iconShadow)"/>
    <g transform="translate(125, 55)">
      <!-- Shield icon -->
      <path d="M0 -20 L18 -12 L18 5 C18 15 0 25 0 25 C0 25 -18 15 -18 5 L-18 -12 Z"
            fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <path d="M-8 0 L-2 6 L10 -6" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ALL-HAZARDS</text>
    <text x="125" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">APPROACH</text>

    <line x1="30" y1="150" x2="220" y2="150" stroke="#e2e8f0"/>

    <!-- Key points -->
    <g font-size="10" fill="#475569">
      <circle cx="40" cy="175" r="3" fill="#3b82f6"/>
      <text x="52" y="178">Natural disasters</text>

      <circle cx="40" cy="200" r="3" fill="#3b82f6"/>
      <text x="52" y="203">Technological failures</text>

      <circle cx="40" cy="225" r="3" fill="#3b82f6"/>
      <text x="52" y="228">Cyber threats</text>

      <circle cx="40" cy="250" r="3" fill="#3b82f6"/>
      <text x="52" y="253">Hybrid threats</text>

      <circle cx="40" cy="275" r="3" fill="#3b82f6"/>
      <text x="52" y="278">Health emergencies</text>

      <circle cx="40" cy="300" r="3" fill="#3b82f6"/>
      <text x="52" y="303">Energy blackouts</text>
    </g>

    <!-- Bottom stat -->
    <rect x="20" y="315" width="210" height="35" rx="6" fill="#eff6ff"/>
    <text x="125" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">31 crisis scenarios identified</text>
  </g>

  <!-- Pillar 2: Whole-of-government -->
  <g transform="translate(325, 110)">
    <rect width="250" height="340" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect width="250" height="8" rx="4" fill="url(#pillar2)"/>

    <!-- Icon -->
    <circle cx="125" cy="55" r="35" fill="#f0fdf4" filter="url(#iconShadow)"/>
    <g transform="translate(125, 55)">
      <!-- Building/Institution icon -->
      <rect x="-18" y="-5" width="36" height="25" fill="none" stroke="#22c55e" stroke-width="2"/>
      <path d="M-22 -5 L0 -20 L22 -5" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <line x1="-10" y1="5" x2="-10" y2="20" stroke="#22c55e" stroke-width="2"/>
      <line x1="0" y1="5" x2="0" y2="20" stroke="#22c55e" stroke-width="2"/>
      <line x1="10" y1="5" x2="10" y2="20" stroke="#22c55e" stroke-width="2"/>
    </g>

    <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">WHOLE-OF-</text>
    <text x="125" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">GOVERNMENT</text>

    <line x1="30" y1="150" x2="220" y2="150" stroke="#e2e8f0"/>

    <!-- Key points -->
    <g font-size="10" fill="#475569">
      <circle cx="40" cy="175" r="3" fill="#22c55e"/>
      <text x="52" y="178">EU-level coordination</text>

      <circle cx="40" cy="200" r="3" fill="#22c55e"/>
      <text x="52" y="203">Member State cooperation</text>

      <circle cx="40" cy="225" r="3" fill="#22c55e"/>
      <text x="52" y="228">Cross-sectoral planning</text>

      <circle cx="40" cy="250" r="3" fill="#22c55e"/>
      <text x="52" y="253">rescEU strategic reserves</text>

      <circle cx="40" cy="275" r="3" fill="#22c55e"/>
      <text x="52" y="278">Crisis management protocols</text>

      <circle cx="40" cy="300" r="3" fill="#22c55e"/>
      <text x="52" y="303">Solidarity mechanisms</text>
    </g>

    <!-- Bottom stat -->
    <rect x="20" y="315" width="210" height="35" rx="6" fill="#f0fdf4"/>
    <text x="125" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">22 rescEU stockpiles in 16 MS</text>
  </g>

  <!-- Pillar 3: Whole-of-society -->
  <g transform="translate(590, 110)">
    <rect width="250" height="340" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect width="250" height="8" rx="4" fill="url(#pillar3)"/>

    <!-- Icon -->
    <circle cx="125" cy="55" r="35" fill="#fffbeb" filter="url(#iconShadow)"/>
    <g transform="translate(125, 55)">
      <!-- People icon -->
      <circle cx="-12" cy="-10" r="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M-20 8 Q-12 0 -4 8" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="12" cy="-10" r="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M4 8 Q12 0 20 8" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M-8 12 Q0 5 8 12" fill="none" stroke="#f59e0b" stroke-width="2"/>
    </g>

    <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">WHOLE-OF-</text>
    <text x="125" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">SOCIETY</text>

    <line x1="30" y1="150" x2="220" y2="150" stroke="#e2e8f0"/>

    <!-- Key points -->
    <g font-size="10" fill="#475569">
      <circle cx="40" cy="175" r="3" fill="#f59e0b"/>
      <text x="52" y="178">72-hour citizen preparedness</text>

      <circle cx="40" cy="200" r="3" fill="#f59e0b"/>
      <text x="52" y="203">Public awareness campaigns</text>

      <circle cx="40" cy="225" r="3" fill="#f59e0b"/>
      <text x="52" y="228">Private sector engagement</text>

      <circle cx="40" cy="250" r="3" fill="#f59e0b"/>
      <text x="52" y="253">Civil society involvement</text>

      <circle cx="40" cy="275" r="3" fill="#f59e0b"/>
      <text x="52" y="278">Community resilience</text>

      <circle cx="40" cy="300" r="3" fill="#f59e0b"/>
      <text x="52" y="303">Risk communication</text>
    </g>

    <!-- Bottom stat -->
    <rect x="20" y="315" width="210" height="35" rx="6" fill="#fffbeb"/>
    <text x="125" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">PreparEU pilot: 4 countries</text>
  </g>

  <!-- Footer -->
  <rect x="60" y="460" width="780" height="2" fill="#e2e8f0"/>
  <text x="450" y="478" text-anchor="middle" font-size="9" fill="#94a3b8">Based on former President Niinistö's October 2024 report calling for a "profound change of mindset" in European resilience</text>
</svg>