<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="70" fill="url(#headerGrad)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">Ukraine's Institutional Impact on the EU</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#bfdbfe">Population ranking, EP representation, and Council voting dynamics</text>

  <!-- Left section: Population Ranking -->
  <g transform="translate(40, 95)">
    <rect width="260" height="320" rx="10" fill="white" filter="url(#shadow)"/>
    <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">EU Population Ranking</text>
    <text x="130" y="48" text-anchor="middle" font-size="10" fill="#64748b">With Ukraine as 5th largest member</text>

    <!-- Population bars -->
    <!-- Germany -->
    <g transform="translate(20, 70)">
      <rect width="220" height="28" rx="4" fill="#e0e7ff"/>
      <rect width="220" height="28" rx="4" fill="#4f46e5"/>
      <text x="10" y="19" font-size="11" font-weight="500" fill="white">Germany</text>
      <text x="210" y="19" text-anchor="end" font-size="11" font-weight="600" fill="white">84.4M</text>
    </g>

    <!-- France -->
    <g transform="translate(20, 105)">
      <rect width="178" height="28" rx="4" fill="#c7d2fe"/>
      <rect width="178" height="28" rx="4" fill="#6366f1"/>
      <text x="10" y="19" font-size="11" font-weight="500" fill="white">France</text>
      <text x="168" y="19" text-anchor="end" font-size="11" font-weight="600" fill="white">68.2M</text>
    </g>

    <!-- Italy -->
    <g transform="translate(20, 140)">
      <rect width="154" height="28" rx="4" fill="#a5b4fc"/>
      <rect width="154" height="28" rx="4" fill="#818cf8"/>
      <text x="10" y="19" font-size="11" font-weight="500" fill="white">Italy</text>
      <text x="144" y="19" text-anchor="end" font-size="11" font-weight="600" fill="white">58.9M</text>
    </g>

    <!-- Spain -->
    <g transform="translate(20, 175)">
      <rect width="126" height="28" rx="4" fill="#c4b5fd"/>
      <rect width="126" height="28" rx="4" fill="#a78bfa"/>
      <text x="10" y="19" font-size="11" font-weight="500" fill="white">Spain</text>
      <text x="116" y="19" text-anchor="end" font-size="11" font-weight="600" fill="white">48.1M</text>
    </g>

    <!-- Ukraine (highlighted) -->
    <g transform="translate(20, 210)">
      <rect width="98" height="32" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
      <text x="10" y="21" font-size="11" font-weight="700" fill="#1e293b">Ukraine</text>
      <text x="88" y="21" text-anchor="end" font-size="11" font-weight="700" fill="#1e293b">37.5M</text>
    </g>

    <!-- Poland -->
    <g transform="translate(20, 250)">
      <rect width="96" height="28" rx="4" fill="#ddd6fe"/>
      <rect width="96" height="28" rx="4" fill="#c4b5fd"/>
      <text x="10" y="19" font-size="11" font-weight="500" fill="#4c1d95">Poland</text>
      <text x="86" y="19" text-anchor="end" font-size="11" font-weight="600" fill="#4c1d95">36.8M</text>
    </g>

    <text x="130" y="305" text-anchor="middle" font-size="9" fill="#64748b">Share of EU-28 population: 7.9%</text>
  </g>

  <!-- Center section: EP Seats -->
  <g transform="translate(320, 95)">
    <rect width="260" height="320" rx="10" fill="white" filter="url(#shadow)"/>
    <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">European Parliament</text>
    <text x="130" y="48" text-anchor="middle" font-size="10" fill="#64748b">Seat allocation challenge</text>

    <!-- Current vs With Ukraine -->
    <g transform="translate(20, 70)">
      <!-- Current EP -->
      <rect width="100" height="100" rx="8" fill="#dcfce7"/>
      <text x="50" y="35" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">Current EU</text>
      <text x="50" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#16a34a">720</text>
      <text x="50" y="85" text-anchor="middle" font-size="10" fill="#166534">MEPs</text>
    </g>

    <g transform="translate(140, 70)">
      <!-- With Ukraine -->
      <rect width="100" height="100" rx="8" fill="#fef2f2"/>
      <text x="50" y="35" text-anchor="middle" font-size="10" font-weight="500" fill="#991b1b">With Ukraine</text>
      <text x="50" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#dc2626">~775</text>
      <text x="50" y="85" text-anchor="middle" font-size="10" fill="#991b1b">MEPs</text>
    </g>

    <!-- Treaty limit indicator -->
    <g transform="translate(20, 185)">
      <rect width="220" height="50" rx="6" fill="#fef3c7"/>
      <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Treaty of Lisbon Cap</text>
      <text x="110" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706">751 MEPs Maximum</text>
    </g>

    <!-- Ukraine allocation -->
    <g transform="translate(20, 250)">
      <rect width="220" height="55" rx="6" fill="url(#goldGrad)"/>
      <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Ukraine Projected Seats</text>
      <text x="110" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">52-59 MEPs</text>
    </g>
  </g>

  <!-- Right section: Council Dynamics -->
  <g transform="translate(600, 95)">
    <rect width="260" height="320" rx="10" fill="white" filter="url(#shadow)"/>
    <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Council Voting Impact</text>
    <text x="130" y="48" text-anchor="middle" font-size="10" fill="#64748b">QMV and blocking coalitions</text>

    <!-- QMV thresholds -->
    <g transform="translate(20, 70)">
      <rect width="220" height="70" rx="6" fill="#f1f5f9"/>
      <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">QMV Requirements</text>
      <text x="110" y="42" text-anchor="middle" font-size="12" fill="#1e293b">55% of member states</text>
      <text x="110" y="58" text-anchor="middle" font-size="12" fill="#1e293b">65% of population</text>
    </g>

    <!-- Ukraine's weight -->
    <g transform="translate(20, 155)">
      <rect width="220" height="55" rx="6" fill="url(#goldGrad)"/>
      <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Ukraine's Population Weight</text>
      <text x="110" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">7.8% of EU</text>
    </g>

    <!-- Blocking coalition -->
    <g transform="translate(20, 225)">
      <rect width="220" height="80" rx="6" fill="#fef2f2"/>
      <text x="110" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Blocking Coalition</text>
      <text x="110" y="45" text-anchor="middle" font-size="12" fill="#1e293b">4 large states including</text>
      <text x="110" y="62" text-anchor="middle" font-size="12" fill="#1e293b">Ukraine could block</text>
      <text x="110" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">any QMV decision</text>
    </g>
  </g>

  <!-- Bottom note -->
  <g transform="translate(40, 430)">
    <rect width="820" height="55" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="20" y="25" font-size="11" font-weight="600" fill="#1e293b">Key Implications:</text>
    <text x="20" y="43" font-size="10" fill="#64748b">Treaty amendment required for EP seat cap | Redistribution politically difficult | Full veto power on CFSP decisions | Fundamentally altered decision-making dynamics</text>
  </g>
</svg>