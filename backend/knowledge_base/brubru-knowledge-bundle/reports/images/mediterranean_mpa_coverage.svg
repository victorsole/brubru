<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="seaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0891b2" stroke-width="2" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f0f9ff"/>

  <!-- Title -->
  <rect width="900" height="65" fill="#0369a1"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">Mediterranean Marine Protected Areas & Trawling Restrictions</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#bae6fd">EU Member State Coverage | EU Biodiversity Strategy 2030 Target: 30%</text>

  <!-- Map Background (simplified Mediterranean) -->
  <ellipse cx="450" cy="260" rx="380" ry="140" fill="url(#seaGrad2)" opacity="0.4"/>

  <!-- Country Cards arranged around the map -->

  <!-- Spain -->
  <g transform="translate(40, 100)">
    <rect width="150" height="110" rx="8" fill="white" filter="url(#cardShadow2)"/>
    <rect width="150" height="6" rx="3" fill="#dc2626"/>
    <text x="75" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Spain</text>
    <text x="75" y="45" text-anchor="middle" font-size="10" fill="#64748b">GSAs 1, 2, 5, 6</text>
    <line x1="15" y1="55" x2="135" y2="55" stroke="#e2e8f0"/>
    <text x="20" y="72" font-size="9" fill="#64748b">MPA Coverage:</text>
    <text x="130" y="72" text-anchor="end" font-size="11" font-weight="600" fill="#dc2626">~12%</text>
    <text x="20" y="88" font-size="9" fill="#64748b">Fully Protected:</text>
    <text x="130" y="88" text-anchor="end" font-size="11" font-weight="600" fill="#dc2626">&lt;0.1%</text>
    <text x="75" y="103" text-anchor="middle" font-size="8" fill="#94a3b8">Partial trawl restrictions</text>
  </g>

  <!-- France -->
  <g transform="translate(210, 85)">
    <rect width="150" height="110" rx="8" fill="white" filter="url(#cardShadow2)"/>
    <rect width="150" height="6" rx="3" fill="#22c55e"/>
    <text x="75" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">France</text>
    <text x="75" y="45" text-anchor="middle" font-size="10" fill="#64748b">GSAs 7, 8</text>
    <line x1="15" y1="55" x2="135" y2="55" stroke="#e2e8f0"/>
    <text x="20" y="72" font-size="9" fill="#64748b">MPA Coverage:</text>
    <text x="130" y="72" text-anchor="end" font-size="11" font-weight="600" fill="#22c55e">~33%</text>
    <text x="20" y="88" font-size="9" fill="#64748b">Fully Protected:</text>
    <text x="130" y="88" text-anchor="end" font-size="11" font-weight="600" fill="#f97316">&lt;0.1%</text>
    <text x="75" y="103" text-anchor="middle" font-size="8" fill="#94a3b8">Gulf of Lion FRA</text>
  </g>

  <!-- Italy -->
  <g transform="translate(380, 100)">
    <rect width="150" height="110" rx="8" fill="white" filter="url(#cardShadow2)"/>
    <rect width="150" height="6" rx="3" fill="#f97316"/>
    <text x="75" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Italy</text>
    <text x="75" y="45" text-anchor="middle" font-size="10" fill="#64748b">GSAs 9, 10, 11, 16-19</text>
    <line x1="15" y1="55" x2="135" y2="55" stroke="#e2e8f0"/>
    <text x="20" y="72" font-size="9" fill="#64748b">MPA Coverage:</text>
    <text x="130" y="72" text-anchor="end" font-size="11" font-weight="600" fill="#f97316">~11%</text>
    <text x="20" y="88" font-size="9" fill="#64748b">Fully Protected:</text>
    <text x="130" y="88" text-anchor="end" font-size="11" font-weight="600" fill="#f97316">&lt;0.5%</text>
    <text x="75" y="103" text-anchor="middle" font-size="8" fill="#94a3b8">Limited enforcement</text>
  </g>

  <!-- Greece - Highlighted as leader -->
  <g transform="translate(550, 85)">
    <rect width="160" height="125" rx="8" fill="white" filter="url(#cardShadow2)" stroke="#22c55e" stroke-width="2"/>
    <rect width="160" height="6" rx="3" fill="#22c55e"/>
    <text x="80" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Greece ★</text>
    <text x="80" y="45" text-anchor="middle" font-size="10" fill="#64748b">GSAs 20, 22, 23</text>
    <line x1="15" y1="55" x2="145" y2="55" stroke="#e2e8f0"/>
    <text x="20" y="72" font-size="9" fill="#64748b">MPA Coverage:</text>
    <text x="140" y="72" text-anchor="end" font-size="11" font-weight="600" fill="#22c55e">~22%</text>
    <text x="20" y="88" font-size="9" fill="#64748b">Fully Protected:</text>
    <text x="140" y="88" text-anchor="end" font-size="11" font-weight="600" fill="#22c55e">~2%</text>
    <rect x="10" y="97" width="140" height="20" rx="4" fill="#f0fdf4"/>
    <text x="80" y="111" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">TRAWL BAN BY 2030</text>
  </g>

  <!-- Croatia -->
  <g transform="translate(720, 120)">
    <rect width="140" height="100" rx="8" fill="white" filter="url(#cardShadow2)"/>
    <rect width="140" height="6" rx="3" fill="#3b82f6"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Croatia</text>
    <text x="70" y="43" text-anchor="middle" font-size="9" fill="#64748b">GSAs 17, 18</text>
    <line x1="10" y1="52" x2="130" y2="52" stroke="#e2e8f0"/>
    <text x="15" y="68" font-size="9" fill="#64748b">MPA:</text>
    <text x="125" y="68" text-anchor="end" font-size="10" font-weight="600" fill="#3b82f6">~25%</text>
    <text x="15" y="84" font-size="9" fill="#64748b">Protected:</text>
    <text x="125" y="84" text-anchor="end" font-size="10" font-weight="600" fill="#f97316">&lt;1%</text>
  </g>

  <!-- Slovenia, Malta, Cyprus - smaller cards -->
  <g transform="translate(40, 340)">
    <rect width="120" height="85" rx="6" fill="white" filter="url(#cardShadow2)"/>
    <rect width="120" height="5" rx="2" fill="#8b5cf6"/>
    <text x="60" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Slovenia</text>
    <text x="60" y="42" text-anchor="middle" font-size="9" fill="#64748b">GSA 17</text>
    <text x="15" y="60" font-size="8" fill="#64748b">MPA: ~15%</text>
    <text x="15" y="75" font-size="8" fill="#64748b">Small coastal zone</text>
  </g>

  <g transform="translate(175, 340)">
    <rect width="120" height="85" rx="6" fill="white" filter="url(#cardShadow2)"/>
    <rect width="120" height="5" rx="2" fill="#ec4899"/>
    <text x="60" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Malta</text>
    <text x="60" y="42" text-anchor="middle" font-size="9" fill="#64748b">GSA 15</text>
    <text x="15" y="60" font-size="8" fill="#64748b">MPA: ~18%</text>
    <text x="15" y="75" font-size="8" fill="#64748b">Small-scale focus</text>
  </g>

  <g transform="translate(310, 340)">
    <rect width="120" height="85" rx="6" fill="white" filter="url(#cardShadow2)"/>
    <rect width="120" height="5" rx="2" fill="#14b8a6"/>
    <text x="60" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Cyprus</text>
    <text x="60" y="42" text-anchor="middle" font-size="9" fill="#64748b">GSA 25</text>
    <text x="15" y="60" font-size="8" fill="#64748b">MPA: ~10%</text>
    <text x="15" y="75" font-size="8" fill="#64748b">Eastern Med focus</text>
  </g>

  <!-- Key Stats Box -->
  <g transform="translate(455, 320)">
    <rect width="200" height="135" rx="8" fill="white" filter="url(#cardShadow2)"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">GFCM Key Measures</text>
    <line x1="15" y1="32" x2="185" y2="32" stroke="#e2e8f0"/>

    <circle cx="25" cy="52" r="4" fill="#0ea5e9"/>
    <text x="35" y="56" font-size="9" fill="#475569">1,000m depth trawl ban</text>

    <circle cx="25" cy="72" r="4" fill="#0ea5e9"/>
    <text x="35" y="76" font-size="9" fill="#475569">87 VME protection zones</text>

    <circle cx="25" cy="92" r="4" fill="#0ea5e9"/>
    <text x="35" y="96" font-size="9" fill="#475569">1.75M km² restricted areas</text>

    <circle cx="25" cy="112" r="4" fill="#0ea5e9"/>
    <text x="35" y="116" font-size="9" fill="#475569">10 multiannual plans</text>

    <line x1="15" y1="125" x2="185" y2="125" stroke="#e2e8f0"/>
    <text x="100" y="142" text-anchor="middle" font-size="8" fill="#dc2626">Only 0.04% fully protected</text>
  </g>

  <!-- EU Target Box -->
  <g transform="translate(680, 320)">
    <rect width="180" height="135" rx="8" fill="#fef3c7" filter="url(#cardShadow2)"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">EU 2030 Targets</text>
    <line x1="15" y1="32" x2="165" y2="32" stroke="#fcd34d"/>

    <text x="90" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#d97706">30%</text>
    <text x="90" y="72" text-anchor="middle" font-size="9" fill="#92400e">Legal Protection Target</text>

    <text x="90" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">10%</text>
    <text x="90" y="110" text-anchor="middle" font-size="9" fill="#92400e">Strict Protection Target</text>

    <text x="90" y="130" text-anchor="middle" font-size="8" fill="#b45309">Marine Action Plan 2023:</text>
    <text x="90" y="142" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">End trawling in MPAs by 2030</text>
  </g>
</svg>