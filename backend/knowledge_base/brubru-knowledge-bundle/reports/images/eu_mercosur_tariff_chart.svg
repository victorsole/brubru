<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="barShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="#134D28"/>
  <text x="450" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">TARIFF REDUCTIONS BY SECTOR</text>
  
  <!-- Subtitle -->
  <text x="450" y="85" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Current Mercosur tariffs on EU exports vs. post-agreement rates</text>
  
  <!-- Legend -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#3B6B9C"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">Current tariff</text>
    <rect x="130" y="0" width="18" height="18" rx="3" fill="#134D28"/>
    <text x="155" y="14" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">Post-agreement</text>
  </g>
  
  <!-- Y-axis label -->
  <text x="30" y="350" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" transform="rotate(-90, 30, 350)">Tariff Rate (%)</text>
  
  <!-- Grid lines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="100" y1="130" x2="850" y2="130"/>
    <line x1="100" y1="200" x2="850" y2="200"/>
    <line x1="100" y1="270" x2="850" y2="270"/>
    <line x1="100" y1="340" x2="850" y2="340"/>
    <line x1="100" y1="410" x2="850" y2="410"/>
    <line x1="100" y1="480" x2="850" y2="480"/>
  </g>
  
  <!-- Y-axis labels -->
  <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">35%</text>
  <text x="90" y="205" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">28%</text>
  <text x="90" y="275" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">21%</text>
  <text x="90" y="345" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">14%</text>
  <text x="90" y="415" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">7%</text>
  <text x="90" y="485" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0%</text>
  
  <!-- X-axis -->
  <line x1="100" y1="480" x2="850" y2="480" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- BAR CHART DATA -->
  
  <!-- Automobiles: 35% -> 0% -->
  <g transform="translate(130, 0)">
    <rect x="0" y="130" width="35" height="350" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="40" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">35%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Automobiles</text>
  </g>
  
  <!-- Machinery: 20% -> 0% -->
  <g transform="translate(250, 0)">
    <rect x="0" y="280" width="35" height="200" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="18" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">20%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Machinery</text>
  </g>
  
  <!-- Chemicals: 14% -> 0% -->
  <g transform="translate(370, 0)">
    <rect x="0" y="340" width="35" height="140" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="18" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">14%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Chemicals</text>
  </g>
  
  <!-- Wine: 27% -> 0% -->
  <g transform="translate(490, 0)">
    <rect x="0" y="210" width="35" height="270" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="18" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">27%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Wine</text>
  </g>
  
  <!-- Spirits: 35% -> 0% -->
  <g transform="translate(610, 0)">
    <rect x="0" y="130" width="35" height="350" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="18" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">35%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Spirits</text>
  </g>
  
  <!-- Cheese: 28% -> 0% (quota) -->
  <g transform="translate(730, 0)">
    <rect x="0" y="200" width="35" height="280" rx="4" fill="#3B6B9C" filter="url(#barShadow)"/>
    <rect x="45" y="480" width="35" height="0" rx="4" fill="#134D28" filter="url(#barShadow)"/>
    <text x="18" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B6B9C" text-anchor="middle">28%</text>
    <text x="63" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#134D28" text-anchor="middle">0%*</text>
    <text x="40" y="510" font-family="Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Cheese</text>
  </g>
  
  <!-- Savings callout -->
  <rect x="550" y="545" width="300" height="45" rx="8" fill="#F5B800" opacity="0.2" stroke="#F5B800" stroke-width="2"/>
  <text x="700" y="568" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle">💰 €4 BILLION annual savings</text>
  <text x="700" y="582" font-family="Arial, sans-serif" font-size="11" fill="#92400E" text-anchor="middle">for EU exporters</text>
  
  <!-- Note -->
  <text x="100" y="545" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">*Cheese: duty-free within 30,000 tonne quota</text>
  <text x="100" y="560" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Note: Phase-in periods vary from 4 to 15 years depending on sector</text>
  
  <!-- Footer -->
  <rect x="0" y="575" width="900" height="25" fill="#134D28"/>
  <text x="450" y="592" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">© 2025 Beresol | Source: European Commission DG Trade | Open Report #2: EU-Mercosur Agreement</text>
</svg>
