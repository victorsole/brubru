id: 21
name: SaaS & B2B Startup Compliance
policy_area: Digital Policy and Digital Economy
description: Data protection, security, and B2B software compliance essentials
applicability: SaaS startups, B2B software, cloud services, enterprise software, data processors
is_startup_focused: true
is_published: true
laws:
- celex: 32016R0679
  title: Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April
    2016 on the protection of natural persons with regard to the processing of personal data
    and on the free movement of such data, and repealing Directive 95/46/EC (General Data
    Protection Regulation) (Text with EEA relevance)
- celex: 32022L2555
  title: Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December
    2022 on measures for a high common level of cybersecurity across the Union (NIS2 Directive)
- celex: 32023R2854
  title: Regulation (EU) 2023/2854 of the European Parliament and of the Council of 13 December
    2023 on harmonised rules on fair access to and use of data and amending Regulation (EU)
    2017/2394 and Directive (EU) 2020/1828 (Data Act)Text with EEA relevance.
- celex: 32024R2847
  title: Regulation (EU) 2024/2847 of the European Parliament and of the Council of 23 October
    2024 on horizontal cybersecurity requirements for products with digital elements and amending
    Regulations (EU) No 168/2013 and (EU) 2019/1020 and Directive (EU) 2020/1828 (Cyber Resilience
    Act)
requirements:
- article: Arts 2-3 + Annexes I-II (are you in scope?)
  law_celex: 32022L2555
  criticality: critical
  addressee: economic_operator
  applicable_entity: Digital service providers
  deadline: null
  interpretive: null
  requirement_text: Establish first whether NIS2 applies at all, because nothing else in this
    regime follows if it does not. It catches medium and large entities, meaning 50 or more
    staff or annual turnover and balance sheet total above EUR 10 million, that operate in
    an Annex I or Annex II sector. For software businesses the relevant entries are cloud
    computing service providers, data centre service providers, managed service providers
    and managed security service providers, all of which are 'important' entities, plus DNS,
    TLD and trust service providers, which are 'essential'. Size thresholds do not apply to
    those last categories. A small SaaS company selling ordinary business software is usually
    out of scope, and recording that conclusion is the compliant outcome.
- article: Article 21 (risk management measures)
  law_celex: 32022L2555
  criticality: critical
  addressee: economic_operator
  applicable_entity: Essential and important entities
  deadline: null
  interpretive: null
  requirement_text: 'If in scope, take appropriate and proportionate technical, operational
    and organisational measures covering at least: policies on risk analysis and information
    system security; incident handling; business continuity including backup management and
    crisis management; supply chain security including the security of relationships with
    direct suppliers; security in acquisition, development and maintenance including vulnerability
    handling and disclosure; policies to assess the effectiveness of those measures; basic
    cyber hygiene and security training; policies on cryptography and encryption; human resources
    security, access control and asset management; and multi-factor or continuous authentication
    and secured communications.'
- article: Article 23 (24h / 72h / 1 month reporting)
  law_celex: 32022L2555
  criticality: critical
  addressee: economic_operator
  applicable_entity: Essential and important entities
  deadline: null
  interpretive: null
  requirement_text: 'If in scope, report significant incidents to the CSIRT or competent authority
    on a fixed clock: an early warning within 24 hours of becoming aware, an incident notification
    with an initial assessment within 72 hours, and a final report within one month. An incident
    is significant if it has caused or is capable of causing severe operational disruption
    or financial loss, or considerable material or non-material damage to others. Where the
    incident is likely to affect the provision of services, inform recipients too.'
- article: Article 20 (management accountability)
  law_celex: 32022L2555
  criticality: important
  addressee: economic_operator
  applicable_entity: Management bodies of in-scope entities
  deadline: null
  interpretive: null
  requirement_text: If in scope, the management body must approve the cybersecurity risk management
    measures, oversee their implementation, and can be held liable for failing to do so. Members
    of the management body must follow training, and entities must offer similar training
    to their staff regularly.
- article: Article 28 (you are probably a processor)
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: SaaS providers acting as processors
  deadline: null
  interpretive: null
  requirement_text: A B2B SaaS provider handling customer data is normally a processor, and
    must be engaged under a written contract covering the subject matter, duration, nature
    and purpose of processing, the types of data and categories of data subject, and the controller's
    rights. Process only on documented instructions, ensure staff are bound by confidentiality,
    apply Article 32 security, respect the conditions for engaging sub-processors including
    prior specific or general written authorisation and notice of changes, assist the controller
    with data subject rights and with Articles 32 to 36, delete or return the data at the
    end of the service, and make available the information needed to demonstrate compliance
    and allow audits.
- article: Article 30(2) (processor's record of processing)
  law_celex: 32016R0679
  criticality: important
  addressee: economic_operator
  applicable_entity: Processors
  deadline: null
  interpretive: null
  requirement_text: Maintain a record of all categories of processing carried out on behalf
    of each controller, including the controller's identity, the categories of processing,
    any third-country transfers with the safeguards relied on, and a general description of
    the technical and organisational security measures. The under-250-employee exemption rarely
    helps a SaaS business because the processing is not occasional.
- article: Article 32 (security of processing)
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers and processors
  deadline: null
  interpretive: null
  requirement_text: Implement security appropriate to the risk, having regard to the state
    of the art and the costs of implementation, considering pseudonymisation and encryption,
    the ability to ensure ongoing confidentiality, integrity, availability and resilience,
    the ability to restore availability after an incident, and a process for regularly testing
    and evaluating the effectiveness of the measures.
- article: Article 33(2) (breach notice to your customer)
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Processors
  deadline: null
  interpretive: null
  requirement_text: As a processor, notify the controller without undue delay after becoming
    aware of a personal data breach. The controller's own 72-hour clock to the supervisory
    authority starts when it becomes aware, so a slow processor notification is what makes
    a customer late. Fix the trigger, the route and the content of that notice in the data
    processing agreement rather than leaving it to the incident.
- article: Ch V, Arts 44-49 (international transfers)
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers and processors transferring data
  deadline: null
  interpretive: null
  requirement_text: 'Transfer personal data outside the EEA only on a valid basis: an adequacy
    decision, standard contractual clauses or binding corporate rules with a transfer impact
    assessment, or a narrow Article 49 derogation. Map where the data actually goes, including
    sub-processors, support teams with remote access and backup regions, because a US-headquartered
    analytics tool or a support desk outside the EEA is a transfer whether or not it appears
    in the architecture diagram.'
- article: Arts 13-14 + 12 (transparency to end users)
  law_celex: 32016R0679
  criticality: important
  addressee: economic_operator
  applicable_entity: Controllers
  deadline: null
  interpretive: null
  requirement_text: Where the company acts as a controller, over its own website, marketing
    and its employees, provide the Article 13 and 14 information in a concise, transparent,
    intelligible and easily accessible form using clear and plain language, and respond to
    data subject requests within one month.
- article: Article 37 (do you need a DPO?)
  law_celex: 32016R0679
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Controllers and processors
  deadline: null
  interpretive: null
  requirement_text: Designate a data protection officer where the core activities consist
    of processing that requires regular and systematic monitoring of data subjects on a large
    scale, or large-scale processing of special categories or criminal conviction data. Acting
    as a processor does not by itself trigger the duty, and recording a reasoned conclusion
    that no DPO is required is a compliant outcome.
- article: Arts 23-26, 29 (switching and exit)
  law_celex: 32023R2854
  criticality: important
  addressee: economic_operator
  applicable_entity: Providers of data processing services
  deadline: '2025-09-12'
  interpretive: null
  requirement_text: 'As a provider of a data processing service, remove the commercial, technical,
    contractual and organisational obstacles that stop a customer moving to another provider
    or to its own infrastructure: a maximum 30-day notice period to start switching, a transitional
    period of up to 30 days extendable where technically unfeasible, functional equivalence
    for infrastructure services, and export of all exportable data in a structured, commonly
    used and machine-readable format. Switching charges were reduced from 12 January 2024
    and are withdrawn entirely from 12 January 2027.'
- article: Art 28 + Ch VI (contract terms, non-EU access)
  law_celex: 32023R2854
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Providers of data processing services
  deadline: '2025-09-12'
  interpretive: null
  requirement_text: Set out the switching arrangements in the contract in writing and make
    it available before signature, and take reasonable technical, organisational and legal
    measures to prevent international governmental access to non-personal data held in the
    Union where that access would conflict with Union or Member State law.
- article: Arts 2-3 (does the CRA reach your product?)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: null
  interpretive: null
  requirement_text: Establish scope first. The Regulation applies to products with digital
    elements made available on the market whose intended purpose or reasonably foreseeable
    use includes a direct or indirect logical or physical data connection to a device or network.
    That captures software as well as hardware, so a hosted product distributed as software
    is in scope where it is placed on the market as a product. It does not apply to products
    covered by the medical devices Regulations 2017/745 and 2017/746, by Regulation 2019/2144
    on vehicle type-approval, to products certified under Regulation 2018/1139 on aviation,
    or to marine equipment under Directive 2014/90/EU. A pure service, as opposed to a product
    placed on the market, sits outside it. Record the conclusion either way.
- article: Art 6 + Annex I (essential requirements)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: 'Design, develop and produce the product in accordance with the essential
    cybersecurity requirements in Part I of Annex I: delivered with a secure by default configuration
    and the ability to reset to it, protection from unauthorised access with appropriate authentication,
    confidentiality and integrity of stored, transmitted and processed data, processing only
    the data adequate, relevant and limited to what is necessary, protection of the availability
    of essential functions, minimisation of attack surfaces, reduction of the impact of incidents,
    recording and monitoring of relevant internal activity, and the ability to apply security
    updates including, where applicable, automatic updates with an opt-out. Part II adds the
    vulnerability handling requirements.'
- article: Art 13(1)-(3) (risk assessment, documented)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: Undertake an assessment of the cybersecurity risks associated with the
    product and take its outcome into account in the planning, design, development, production,
    delivery and maintenance phases. The assessment must be documented and updated as appropriate
    throughout the support period, and must analyse risks based on the intended purpose, reasonably
    foreseeable use and conditions of use, and state whether and how each Annex I Part I point
    (2) security requirement applies and is implemented.
- article: Art 13(8) (support period, minimum five years)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: 'Determine and state a support period reflecting how long the product
    is expected to be in use, during which vulnerabilities are handled. The support period
    must be at least five years, unless the product is expected to be in use for less, in
    which case it matches the expected use time. This is a commercial commitment as much as
    a legal one: it fixes how long security updates must be produced for versions already
    sold.'
- article: Annex I Part II (vulnerability handling)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: 'Handle vulnerabilities for the duration of the support period: identify
    and document components in a software bill of materials covering at least the top-level
    dependencies; address and remediate vulnerabilities without delay, including by providing
    security updates; apply regular tests and reviews; publicly disclose information about
    fixed vulnerabilities once available; put in place and enforce a coordinated vulnerability
    disclosure policy; provide a contact address for reporting; and distribute security updates
    without delay and free of charge, separately from functionality updates where technically
    feasible.'
- article: Art 14 (24h / 72h vulnerability + incident report)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2026-09-11'
  interpretive: null
  requirement_text: Notify any actively exploited vulnerability, and any severe incident having
    an impact on the security of the product, simultaneously to the CSIRT designated as coordinator
    and to ENISA through the single reporting platform. The clock is an early warning without
    undue delay and in any event within 24 hours of becoming aware, then a fuller notification
    within 72 hours giving the general nature of the exploit and any corrective or mitigating
    measures taken and available to users. This obligation starts well before the rest of
    the Regulation, on 11 September 2026.
- article: Arts 28, 30-31 (declaration, CE marking, docs)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: Draw up the EU declaration of conformity stating that the essential requirements
    are met, affix the CE marking visibly, legibly and indelibly before placing the product
    on the market, and prepare the technical documentation before doing so, keeping it and
    the declaration at the disposal of market surveillance authorities for at least ten years
    after placing on the market or for the support period, whichever is longer.
- article: Arts 7-8 + 32 (which conformity route applies)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: Determine which conformity assessment route the product needs. For products
    that are neither important nor critical, the manufacturer's own internal control procedure
    under module A is enough. Important products in Annex III class I may use internal control
    only where harmonised standards or a European cybersecurity certification scheme are applied
    in full, and otherwise need a third party; class II always needs a third-party route.
    Critical products in Annex IV may be required to hold a European cybersecurity certificate
    at assurance level at least substantial. Getting this wrong is the difference between
    self-assessment and a notified body.
- article: Art 24 (open-source software stewards)
  law_celex: 32024R2847
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Open-source software stewards
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: If the company acts as an open-source software steward, meaning a legal
    person other than a manufacturer that systematically provides sustained support for the
    development of specific open-source products intended for commercial activities, put in
    place and document in a verifiable manner a cybersecurity policy fostering secure development,
    effective vulnerability handling and voluntary reporting. The steward regime is lighter
    than the manufacturer regime, and merely contributing to open source does not create it.
- article: Arts 19-22 (importer, distributor, or maker?)
  law_celex: 32024R2847
  criticality: important
  addressee: economic_operator
  applicable_entity: Importers, distributors and modifiers
  deadline: '2027-12-11'
  interpretive: null
  requirement_text: Know which role the company holds, because the manufacturer's full obligations
    attach to an importer or distributor that places a product on the market under its own
    name or trade mark, or that carries out a substantial modification of a product already
    placed on the market. Rebranding or materially modifying third-party software makes the
    company the manufacturer of it.
- article: Art 71 (when each duty starts)
  law_celex: 32024R2847
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2026-09-11'
  interpretive: true
  requirement_text: 'The Regulation entered into force on 10 December 2024 and applies from
    11 December 2027. Two parts start earlier: the Article 14 reporting obligations from 11
    September 2026, and Chapter IV on notification of conformity assessment bodies from 11
    June 2026. Work back from December 2027 for design and conformity work, and from September
    2026 for the reporting pipeline.'
- article: Art 64 (penalties)
  law_celex: 32024R2847
  criticality: recommended
  addressee: member_state
  applicable_entity: Manufacturers of products with digital elements
  deadline: null
  interpretive: true
  requirement_text: Non-compliance with the Annex I essential requirements or the Article
    13 and 14 obligations carries administrative fines up to EUR 15 000 000 or, for an undertaking,
    2.5% of total worldwide annual turnover for the preceding financial year, whichever is
    higher. The obligations in Articles 18 to 23, 28, 30, 31, 32, 33(5), 39, 41, 47, 49 and
    53 reach EUR 10 000 000 or 2%, and supplying incorrect, incomplete or misleading information
    to notified bodies or market surveillance authorities EUR 5 000 000 or 1%.
- article: Art 33 (support for SMEs and start-ups)
  law_celex: 32024R2847
  criticality: recommended
  addressee: member_state
  applicable_entity: SMEs and start-ups
  deadline: null
  interpretive: true
  requirement_text: Member States must, where appropriate, run awareness-raising and training
    on the Regulation tailored to microenterprises and small enterprises, establish a dedicated
    communication channel for advice and queries, and support testing and conformity assessment
    procedures. This is an offer to use, not a duty to discharge, and never counts as a gap.
- article: Art 69(3) (legacy products, reporting)
  law_celex: 32024R2847
  criticality: critical
  addressee: economic_operator
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2026-09-11'
  interpretive: null
  requirement_text: 'The reporting duty reaches products you already sold. Article 69(2) spares
    products placed on the market before 11 December 2027 unless they are substantially modified,
    but Article 69(3) expressly disapplies that for Article 14: from 11 September 2026 you
    must notify actively exploited vulnerabilities and severe incidents for every in-scope
    product with digital elements you have placed on the market, including the existing installed
    base. The Commission FAQ (v1.0, 3 December 2025, section 5.3) sets the limit: for those
    legacy products you are required to notify, but you are NOT required to meet the other
    obligations such as vulnerability handling, since build environments, tooling and staff
    for old code may no longer exist. The duty attaches on becoming aware after the reporting
    rules start applying, not retrospectively. Build the notification path for the whole portfolio,
    not only for new products.'
- article: Art 69(1) (existing certificates)
  law_celex: 32024R2847
  criticality: important
  addressee: economic_operator
  applicable_entity: Manufacturers relying on existing cybersecurity certificates
  deadline: '2028-06-11'
  interpretive: null
  requirement_text: EU-type examination certificates and approval decisions issued on cybersecurity
    requirements under other Union harmonisation legislation, such as Commission Delegated
    Regulation (EU) 2022/30 under the Radio Equipment Directive, remain valid until 11 June
    2028, unless that legislation says otherwise or the certificate expires sooner. Check
    the expiry of every certificate you rely on and plan reassessment under the CRA before
    it lapses, because the transitional does not renew itself.
- article: Arts 35-51 (notified bodies, applying)
  law_celex: 32024R2847
  criticality: recommended
  addressee: member_state
  applicable_entity: Member States and conformity assessment bodies
  deadline: '2026-06-11'
  interpretive: true
  requirement_text: 'Chapter IV has been applying since 11 June 2026, ahead of the rest of
    the Regulation. By that date Member States had to designate the notifying authorities
    responsible for assessing, designating and monitoring conformity assessment bodies. Bodies
    that complete the procedure are published on the Commission''s NANDO database. This is
    context rather than a duty on you, but it is the reason a notified body can be engaged
    now: if your product needs a third-party route, capacity is being built during the run-up,
    and Article 43(2) only asks Member States to strive to have enough notified bodies by
    11 December 2026.'
- article: Art 16 (single reporting platform)
  law_celex: 32024R2847
  criticality: recommended
  addressee: eu_agency
  applicable_entity: ENISA and the coordinating CSIRTs
  deadline: '2026-09-11'
  interpretive: true
  requirement_text: Notifications under Article 14 go through a single reporting platform
    operated by ENISA, with the notification reaching the CSIRT designated as coordinator
    and ENISA at the same time. The platform is the infrastructure the reporting duty depends
    on, so confirm the submission route and your access to it before 11 September 2026 rather
    than while a 24-hour clock is running.
- article: Art 27 (harmonised standards route)
  law_celex: 32024R2847
  criticality: recommended
  addressee: commission
  applicable_entity: Manufacturers of products with digital elements
  deadline: '2027-12-11'
  interpretive: true
  requirement_text: 'Conformity is presumed where a product meets harmonised standards cited
    in the Official Journal, and for most products self-assessment against those standards
    is the default route. The standards are not all ready: the Commission FAQ records that
    the horizontal standard on secure products and the standard on vulnerability handling
    were requested from the European standardisation organisations by 30 August 2026, and
    the standard covering the Annex I Part I essential requirements by 30 October 2027. Where
    no harmonised standard is available in time, the burden of demonstrating conformity by
    other means falls on you, so track the citations rather than assuming a standard will
    exist.'
