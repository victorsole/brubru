    support of Regulation (EU) 2017/745 and listed in the Annex to this Decision are hereby
    published in the Official Journal of the European Union
- article: Article 2
  law_celex: 32021R1182
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Commission
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the day of its publication in
    the Official Journal of the European Union
- article: Article 7
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers and other entities involved in device marketing
  deadline: null
  interpretive: null
  requirement_text: It shall be prohibited to use text, names, trade marks, pictures in the
    labelling, instructions for use, making available, putting into service and advertising
    of devices
- article: Article 10(15)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: Where manufacturers have their devices designed or manufactured by another
    legal or natural person the information on the identity of that person shall be part of
    the information to be submitted in accordance with Article 29(4)
- article: Article 78(14)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: '2027-05-26'
  interpretive: null
  requirement_text: From 26 May 2027, all Member States shall be required to apply that procedure
- article: Article 120(6)
  law_celex: null
  criticality: critical
  addressee: notified_body
  applicable_entity: notified bodies
  deadline: null
  interpretive: null
  requirement_text: Notified bodies must be notified prior to 26 May 2020
- article: Annex VII, Section 4.5.2
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: notified bodies or certification entities
  deadline: null
  interpretive: null
  requirement_text: That plan shall ensure that the entire range of devices covered by the
    certificate is sampled
- article: Annex VIII, Section 3.2
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers and regulatory bodies
  deadline: null
  interpretive: null
  requirement_text: Accessories for a medical device shall be classified in their own right
- article: Annex IX, Section 2.3
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: notified bodies
  deadline: null
  interpretive: null
  requirement_text: In the case of class IIa and class IIb devices, the quality management
    system assessment shall be accompanied by the assessment of technical documentation for
    devices selected on a representative basis as specified in Section 4
- article: Annex IX, Section 3.5
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: notified bodies
  deadline: null
  interpretive: null
  requirement_text: In the case of class IIa and class IIb devices, the surveillance assessment
    shall also include an assessment of the technical documentation as specified in Section
    4 for the device or devices concerned on the basis of further representative samples
- article: Annex IX, Section 4.3
  law_celex: null
  criticality: critical
  addressee: notified_body
  applicable_entity: notified bodies
  deadline: null
  interpretive: null
  requirement_text: The notified body shall assess the technical documentation using staff
    with proven knowledge
- article: Article 4(1)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: Manufacturers of devices that provide instructions for use in electronic
    form to users instead of in paper form shall undertake a documented risk assessment covering
    specific elements including knowledge and experience of intended users, characteristics
    of environment, user experience with hardware/software, access to electronic resources,
    safeguards against tampering, safety mechanisms, emergency situations, website unavailability
    impact, provision timeframe for paper form, website compatibility, and version management.
- article: Article 4(2)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: The risk assessment for the provision of the instructions for use in electronic
    form shall be updated in view of the experience gained in the post-marketing phase.
- article: Article 5(1)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: The risk assessment shall demonstrate that providing instructions for
    use in electronic form maintains or improves the level of safety obtained by providing
    the instructions for use in paper form.
- article: Article 5(2)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall provide instructions for use in electronic form in all Member
    States where the product is made available or put into service unless duly justified in
    the risk assessment.
- article: Article 5(3)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall have a system in place to provide the instructions for use
    in paper form at no additional cost for the user, within the time period set out in the
    risk assessment and at the latest within 7 calendar days of receiving a request from the
    user or at the time of delivery of the device if so requested at the time of order.
- article: Article 5(4)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall provide, on the device or a leaflet, information on foreseeable
    medical emergency situations and, for devices fitted with a built-in system visually displaying
    the instructions for use, information on how to start the device.
- article: Article 5(5)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall ensure the proper design and functioning of the instructions
    for use in electronic form and provide verification and validation evidence to this effect.
- article: Article 5(6)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: For medical devices fitted with a built-in system visually displaying
    the instructions for use, they shall ensure that displaying the instructions for use does
    not impede the safe use of the device, in particular, life-monitoring or life-supporting
    functions.
- article: Article 5(7)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall provide, in their catalogue or other appropriate device information
    support, information on software and hardware requirements needed to display the instructions
    for use.
- article: Article 5(8)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: They shall have a system in place to clearly indicate when the instructions
    for use have been revised and to inform each user of the device thereof if the revision
    was necessary for safety reasons.
- article: Article 5(9)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: For devices with a defined expiry date, except implantable devices, they
    shall keep the instructions for use available for users in electronic form for 10 years
    after the last device has been placed on the market and at least 2 years after the end
    of the expiry date of the last produced device.
- article: Article 5(10)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: For devices without a defined expiry date and implantable devices, they
    shall keep the instructions for use available for the users in electronic form for 15
    years after the last device has been placed on the market.
- article: Article 5(11)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: The instructions for use shall be available on their website in an official
    language of the Union determined by the Member State in which the device is made available
    to the user or patient.
- article: Article 5(12)
  law_celex: 32021R2226
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturers
  deadline: null
  interpretive: null
  requirement_text: Effective systems and procedures shall be in place to ensure that device
    users having downloaded instructions for use from the website can be informed in case
    of updates or corrective actions with regards to those instructions for use.
- article: Article 110(2)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Devices with certificates issued under Directive 98/79/EC may continue
    to be placed on the market or put into service until 27 May 2025
- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Devices must continue to comply with Directive 98/79/EC from the date
    of application of this Regulation if placed on the market under derogation provisions
- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: There shall be no significant changes in the design and intended purpose
    of devices placed on the market under derogation provisions
- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Class D devices requiring notified body involvement under this Regulation
    but not under Directive 98/79/EC may be placed on the market until 26 May 2025
- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Class C devices requiring notified body involvement under this Regulation
