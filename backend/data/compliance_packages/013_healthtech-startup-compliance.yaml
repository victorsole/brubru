- article: Recital 3
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Member State Coordination Group on Health Technology Assessment
  deadline: null
  interpretive: true
  requirement_text: The Coordination Group shall set the request periods for joint scientific
    consultations on medical devices and in vitro diagnostic medical devices at the latest
    by the day on which it adopts its annual work programme
- article: Recital 4
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: health technology developers
  deadline: null
  interpretive: true
  requirement_text: Health technology developers shall submit the requests for joint scientific
    consultations, the briefing package and any further data through the HTA IT platform
- article: Recital 4
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: health technology developers
  deadline: null
  interpretive: true
  requirement_text: Requests and dossiers shall be presented using the templates set out by
    the Coordination Group pursuant to Article 21, points (a) and (b), of Regulation (EU)
    2021/2282
- article: Recital 5
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: health technology developers
  deadline: null
  interpretive: true
  requirement_text: The health technology developer shall indicate in the request for joint
    scientific consultation whether, in parallel, it is requesting the expert panel consultation
- article: Recital 7
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: HTA secretariat
  deadline: null
  interpretive: true
  requirement_text: The HTA secretariat shall share with the European Medicines Agency the
    list of requests for joint scientific consultation on medical devices for which the health
    technology developer indicated that it is requesting in parallel the expert panel consultation
- article: Recital 7
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: HTA secretariat and European Medicines Agency
  deadline: null
  interpretive: true
  requirement_text: The HTA secretariat and the European Medicines Agency shall inform each
    other which of the requests were selected for joint scientific consultation and which
    ones were accepted for the expert panel consultation
- article: Recital 8
  law_celex: 32025R0117
  criticality: recommended
  addressee: economic_operator
  applicable_entity: HTA secretariat and European Medicines Agency
  deadline: null
  interpretive: true
  requirement_text: The HTA secretariat and the European Medicines Agency shall exchange the
