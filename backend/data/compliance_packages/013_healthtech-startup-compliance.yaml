- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Class A devices placed on the market in sterile condition and requiring
    notified body involvement under this Regulation but not under Directive 98/79/EC may be
    placed on the market until 26 May 2027
- article: Article 110(3)
  law_celex: 32022R0112
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operators
  deadline: null
  interpretive: null
  requirement_text: Devices eligible for extended transitional periods must have had a declaration
