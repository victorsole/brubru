    under document C(2014) 2475) (2014/224/EU)
- celex: 32019R1783
  title: Commission Regulation (EU) 2019/1783 of 1 October 2019 amending Regulation (EU) No
    548/2014 on implementing Directive 2009/125/EC of the European Parliament and of the Council
    with regard to small, medium and large power transformers (Text with EEA relevance)
- celex: 32020R1294
  title: Commission Implementing Regulation (EU) 2020/1294 of 15 September 2020 on the Union
    renewable energy financing mechanism (Text with EEA relevance)
- celex: 32021R1119
  title: Regulation (EU) 2021/1119 of the European Parliament and of the Council of 30 June
