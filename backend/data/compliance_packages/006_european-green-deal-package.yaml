id: 6
name: European Green Deal Package
policy_area: Climate Action
description: Comprehensive package of climate and environmental legislation
applicability: 'All sectors: energy, transport, industry, agriculture'
is_startup_focused: false
is_published: false
laws:
- celex: 32010R0205
  title: Commission Decision of 31 March 2010 concerning the reporting questionnaire relating
    to Regulation (EC) No 166/2006 of the European Parliament and of the Council concerning
    the establishment of a European Pollutant Release and Transfer Register and amending Council
    Directives 91/689/EEC and 96/61/EC (notified under document C(2010) 1955) (Text with EEA
    relevance) (2010/205/EU)
- celex: 32014D0224
  title: Commission Implementing Decision of 16 April 2014 on the transfer of assigned amount
