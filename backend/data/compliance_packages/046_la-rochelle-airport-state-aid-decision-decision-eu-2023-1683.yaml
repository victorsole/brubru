id: 46
name: La Rochelle Airport State Aid Decision (Decision (EU) 2023/1683)
policy_area: Competition
description: The Commission assessed public funding to the operator of La Rochelle airport
  and the airport-services and marketing agreements concluded with airlines including Ryanair.
  Applying the market-economy operator principle with an incremental-profitability analysis,
  it found unlawful aid to the airlines and ordered recovery, while assessing the airport
  operating aid under the Aviation Guidelines.
applicability: Regional airport operators and public authorities; airlines signing marketing
  and airport-services agreements.
is_startup_focused: false
is_published: false
laws:
- celex: 32023D1683
  title: Commission Decision (EU) 2023/1683 of 26 July 2022 on the measure SA.26494 2012/C
    (ex 2012/NN) implemented by France in favour of the operator of La Rochelle airport and
    certain airlines operating at that airport (notified under document C(2022) 5145) (Only
    the French text is authentic) (Text with EEA relevance)
requirements:
- article: Article 107(1) TFEU / recitals 231-242
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airport operator (public body)
  deadline: null
  interpretive: null
  requirement_text: Any airport operated by a public-law body (chamber of commerce, concession
    authority, public authority) must treat all financial flows from public budgets or parafiscal
    levies as State resources. All commercial decisions of such a body are imputable to the
    State and subject to State aid notification rules.
- article: Article 108(3) TFEU / recital 533
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airport operator
  deadline: null
  interpretive: null
  requirement_text: Before concluding any incentive agreement, airport services agreement
    or marketing services agreement with an airline, the airport must prepare a documented,
    ex ante incremental profitability analysis showing that the agreement generates a positive
    Net Present Value of incremental revenues over incremental costs. Absence of contemporaneous
    documentation is treated as evidence of non-compliance with the Market Economy Operator
    test.
- article: 2014 Aviation Guidelines, para. 53-56 / recitals 4
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airport operator
  deadline: null
  interpretive: null
  requirement_text: 'The incremental profitability test must model all incremental aeronautical
    revenues (landing, passenger, parking charges) and non-aeronautical revenues (retail,
    food and beverage, car parks, advertising) generated by the airline''s passengers, net
    of all incremental costs (handling, security, staff, marketing payments). The single-till
    approach applies: non-aeronautical revenues attributable to an airline''s passenger volume
    count toward that airline''s profitability contribution.'
- article: 2014 Aviation Guidelines, para. 53-56 / recitals 4
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airport operator
  deadline: null
  interpretive: null
  requirement_text: The incremental profitability analysis must be positive in the base scenario.
    A negative NPV in both the base scenario and in the most favourable stress scenario (the
    'imprudent' scenario using highest-end revenue assumptions) is decisive evidence that
    no market economy operator would have concluded the agreement.
- article: Article 107(1) TFEU / recitals 432-438
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airline / airport operator
  deadline: null
  interpretive: null
  requirement_text: An airline and its wholly-owned marketing subsidiary that always contract
    jointly or in immediate sequence with an airport will be treated as a single economic
    entity for State aid assessment purposes. Airports and airlines may not structure commercial
    relationships across separate legal entities to disaggregate the State aid calculation
    or the recovery obligation.
- article: Council Regulation (EU) 2015/1589 / Regulation (EC
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airline / Member State
  deadline: null
  interpretive: null
  requirement_text: Where incompatible State aid is found in an airport-airline marketing
    agreement, recovery is ordered jointly and severally against the economically linked airline
    entities. Recovery carries compound annual interest from the date of each payment to the
    date of actual restitution, calculated under the Regulation 794/2004 methodology. Beneficiaries
    must budget for compounding when assessing exposure.
- article: Article 108(2) TFEU / Decision Article 5
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Member State
  deadline: null
  interpretive: null
  requirement_text: France (and by extension any Member State subject to a recovery order)
    must adopt and implement all necessary measures to recover incompatible aid within four
    months of notification of the Decision. This deadline is firm. Failure to comply exposes
    the Member State to infringement proceedings and direct referral to the Court of Justice.
- article: 2014 Aviation Guidelines, para. 79-85 / recital 35
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Public authority / airport operator
  deadline: null
  interpretive: null
  requirement_text: Investment grants to small regional airports (category D, under 1 million
    passengers) may be compatible under Article 107(3)(c) TFEU, but aid intensity must remain
    within the ceiling permitted by the Guidelines. The gross grant equivalent must be calculated
    as a proportion of eligible investment costs and documented before disbursement. Internal
    rate-of-return analysis must demonstrate the investment would not be made without public
    support.
- article: 2014 Aviation Guidelines, para. 112-137 / recitals
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Public authority / airport operator
  deadline: null
  interpretive: null
  requirement_text: Operating aid to a category D airport requires demonstration that the
    airport faces structural financial unviability that cannot be overcome within the normal
    adjustment period. The granting authority must produce audited financial projections showing
    persistent loss-making, quantify the minimum aid necessary to cover the funding gap, and
    document proportionality. Time-limited aid with a degressive profile is required.
- article: 2014 Aviation Guidelines, para. 150-163 / recitals
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Airport operator / Member State
  deadline: null
  interpretive: null
  requirement_text: The Altmark/SGEI exemption from State aid rules requires that the airport
    genuinely provides a service of general economic interest with no alternative transport
    mode (rail, road) serving the same connectivity need. Airports located near cities with
    functioning rail or motorway connections to major centres cannot credibly claim SGEI status.
    All four Altmark conditions must be met cumulatively; the cost-benchmark condition (competitive
    tender or independent cost analysis) is typically the hardest.
- article: 2014 Aviation Guidelines, para. 116-126 / recitals
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Airport operator / public authority
  deadline: null
  interpretive: null
  requirement_text: Local authority subsidies paid to an airport for tourism promotion or
    other public-interest purposes do not alter the incremental profitability calculation
    at the airport-airline level. Each layer of the public-funding chain is assessed separately.
    An airport cannot aggregate local-authority subsidies with its own revenues to make a
    commercially irrational airline deal appear profitable.
- article: 2014 Aviation Guidelines, para. 138-148 / recitals
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airport operator / airline
  deadline: null
  interpretive: null
  requirement_text: 'Start-up aid for new routes at regional airports is permissible under
    the 2014 Guidelines only if: the route is genuinely new; the aid is time-limited (maximum
    three years); it degresses annually; and it covers only the start-up period. Ongoing incentive
    payments to airlines for established routes, even if labelled as ''marketing services
    agreements'', do not qualify as start-up aid and cannot be justified under the Guidelines.'
- article: 2014 Aviation Guidelines / Decision Article 1
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Public authority
  deadline: null
  interpretive: null
  requirement_text: 'An airport must document the regional connectivity rationale for any
    State aid it seeks: the geographic remoteness or peripherality of the region, the absence
    of less distortive alternatives, the link between the airport''s operation and regional
    economic development, and proportionality of the funding to the financing gap. Compatibility
    under Article 107(3)(c) TFEU requires evidence on all these dimensions.'
- article: Article 107(1) TFEU / Decision Article 2
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Airport operator / public authority
  deadline: null
  interpretive: null
  requirement_text: 'Subsidies granted by public authorities to reimburse an airport for carrying
    out public-remit tasks (safety, security, FIATA obligations, immigration checks) that
    are financed on a cost-coverage basis do not constitute State aid because there is no
    selective advantage: the subsidy merely reimburses a public obligation. Airports and public
    authorities must maintain clear accounting separation between public-remit tasks and commercial
    airport activities.'
- article: Article 107(1) TFEU / Decision Article 2 (non-sele
  law_celex: 32023D1683
  criticality: important
  addressee: economic_operator
  applicable_entity: Airport operator
  deadline: null
  interpretive: null
  requirement_text: Airline charge discounts or waivers that apply to all airlines under the
    same objective, non-discriminatory conditions (e.g. all daytime flights, all airlines
    of a certain weight category) do not constitute selective State aid because no individual
    undertaking is favoured. Airport pricing schemes must be based on objective, transparent
    and non-discriminatory criteria published in advance.
- article: Regulation (EC) No 794/2004 / Decision Article 5
  law_celex: 32023D1683
  criticality: critical
  addressee: economic_operator
  applicable_entity: Airline / airport operator
  deadline: null
  interpretive: null
  requirement_text: Recovery interest is compounded annually and runs from the date of disbursement
    to the date of actual repayment. Where an investigation spans a decade, the compounded
    interest component can approach or exceed the principal. Airlines and airports involved
    in contested incentive agreements must provision for this exposure from the moment an
    investigation is opened and factor it into any negotiated settlement with national authorities.
