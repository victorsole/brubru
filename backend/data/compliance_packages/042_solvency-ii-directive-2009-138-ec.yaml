id: 42
name: Solvency II (Directive 2009/138/EC)
policy_area: Economic and Financial Affairs
description: 'The EU risk-based prudential regime for insurers and reinsurers: the Solvency
  Capital Requirement and Minimum Capital Requirement, market-consistent technical provisions,
  own-funds tiering, the prudent-person principle, the system of governance and ORSA, public
  disclosure (SFCR) and group supervision.'
applicability: Insurance and reinsurance undertakings, insurance groups, national supervisors
  and EIOPA.
is_startup_focused: false
is_published: true
laws:
- celex: 32009L0138
  title: Directive 2009/138/EC of the European Parliament and of the Council on the taking-up
    and pursuit of the business of Insurance and Reinsurance (Solvency II)
requirements:
- article: Article 76-77 (Technical Provisions)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Insurance and reinsurance undertakings must calculate technical provisions
    on a market-consistent basis as the sum of a best estimate (probability-weighted discounted
    cash flows) and a risk margin (cost of capital adjustment). Where future cash flows can
    be reliably replicated using financial instruments with observable market values, the
    market value may be used without a separate split.
- article: Article 100 (SCR Requirement)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: All undertakings must hold eligible own funds covering the Solvency Capital
    Requirement at all times. The SCR corresponds to the Value-at-Risk of basic own funds
    subject to a 99.5% confidence level over a one-year period, equivalent to ruin occurring
    no more than once in 200 years.
- article: Article 101(4) (SCR Risk Coverage)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: The SCR must cover at least non-life underwriting risk, life underwriting
    risk, health underwriting risk, market risk, credit risk, and operational risk (which
    includes legal risk). Operational risk does not include strategic or reputational risk.
- article: Article 98(1) (Own Funds Tiering Limits)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: For SCR compliance, Tier 1 own-fund items (permanent and fully subordinate)
    must exceed one-third of total eligible own funds, and Tier 3 items (neither fully permanent
    nor subordinate) must be less than one-third of total eligible own funds.
- article: Article 129(1)-(3) (MCR Requirement)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Undertakings must calculate a Minimum Capital Requirement as a simple
    linear function calibrated to 85% Value-at-Risk over one year. The MCR must not fall below
    25% nor exceed 45% of the SCR, with absolute floors ranging from EUR 1,000,000 (captive
    reinsurance) to EUR 3,200,000 depending on undertaking class.
- article: Article 103-111 (Standard Formula)
  law_celex: 32009L0138
  criticality: important
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings not approved for internal models
  deadline: null
  interpretive: null
  requirement_text: Undertakings using the standard formula must calculate the SCR as the
    sum of the Basic SCR (aggregating five risk modules each calibrated at 99.5% VaR one-year),
    plus an operational risk capital charge, plus an adjustment for loss-absorbing capacity
    of technical provisions and deferred taxes.
- article: Article 112-127 (Internal Models)
  law_celex: 32009L0138
  criticality: important
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings seeking supervisory approval for
    internal models
  deadline: null
  interpretive: null
  requirement_text: Full or partial internal models may replace the standard formula if supervisory
    approval is granted. Internal models must meet use test (embedded in risk management),
    statistical quality standards, calibration equivalent to 99.5% VaR one-year, profit-and-loss
    attribution, validation (including statistical testing), and documentation standards.
- article: Article 41 (System of Governance)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must establish an effective system of governance providing
    for sound and prudent management, including written policies on risk management, internal
    control, internal audit, and outsourcing reviewed at least annually. The system must be
    proportionate to the nature, scale, and complexity of the undertaking.
- article: Article 44 (Risk Management Function)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must establish a risk management function covering underwriting
    and reserving, asset-liability management, investment decisions including derivatives,
    liquidity and concentration risk, operational risk, and reinsurance arrangements. For
    internal model users, the function must oversee model design, testing, and documentation.
- article: Article 45 (Own Risk and Solvency Assessment)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must conduct its Own Risk and Solvency Assessment covering
    overall solvency needs with respect to its specific risk profile and approved risk tolerance,
    continuous compliance with SCR and MCR and technical provision requirements, and the degree
    to which the undertaking's risk profile deviates from SCR assumptions. The assessment
    must be conducted regularly and following any significant change in risk profile.
- article: Article 46 (Compliance Function)
  law_celex: 32009L0138
  criticality: important
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must establish a compliance function to advise the management
    body on compliance with laws and regulations and to assess the impact of legal changes
    on the undertaking's operations.
- article: Article 47 (Internal Audit Function)
  law_celex: 32009L0138
  criticality: important
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must establish an internal audit function that is objective
    and independent from operational functions. The function must evaluate the adequacy and
    effectiveness of internal controls and governance, with findings reported to the management
    body.
- article: Article 48 (Actuarial Function)
  law_celex: 32009L0138
  criticality: important
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must establish an actuarial function to coordinate technical
    provisions calculation, ensure appropriateness of calculation methods and underlying assumptions,
    assess data quality and sufficiency, and express opinions on underwriting policy and reinsurance
    arrangements.
- article: Article 42 (Fit and Proper Requirement)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: All persons who effectively run the undertaking or hold other key functions
    must at all times be professionally qualified, knowledgeable, and experienced (fit) and
    of good repute and integrity (proper). Any changes to key function holders must be notified
    to the supervisory authority.
- article: Article 51-56 (Solvency and Financial Condition Re
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: all insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: Every undertaking must publish an annual Solvency and Financial Condition
    Report containing business description, governance system assessment, risk exposure and
    concentration analysis, valuation bases with explanations of differences from financial
    statements, and capital management information including own funds amount, SCR and MCR
    amounts, and SCR calculation method used.
- article: Article 138 (SCR Non-Compliance)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: An undertaking in breach of the SCR must immediately notify its supervisory
    authority and submit a recovery plan within two months. The undertaking must re-establish
    compliance with the SCR within six months, extendable to nine months in exceptional market
    conditions.
- article: Article 139 (MCR Non-Compliance)
  law_celex: 32009L0138
  criticality: critical
  addressee: economic_operator
  applicable_entity: insurance and reinsurance undertakings
  deadline: null
  interpretive: null
  requirement_text: An undertaking in breach of the MCR must immediately notify its supervisory
    authority and establish a short-term finance scheme within one month. Failure to restore
    compliance within three months results in mandatory withdrawal of authorisation.
