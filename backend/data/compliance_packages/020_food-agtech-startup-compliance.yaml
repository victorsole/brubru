    the name(s) of the manufacturer(s) of the novel food, if different than the applicant''s,
    address and contact details; (b) the name, address and contact details of the person responsible
    for the dossier authorised to communicate on behalf of the applicant with the Commission;
    (c) the date of submission of the dossier; (d) a table of contents of the dossier; (e)
    a detailed list of documents annexed to the dossier, including references to titles, volumes
    and pages; (f) a list of the parts of the dossier to be treated as confidential and verifiable
    justification; (g) information and explanations substantiating the existence of the applicant''s
    right of reference to the proprietary scientific evidence.'
- article: Article 5(2)
