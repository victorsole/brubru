    the requirements of Directive 2004/10/EC or, if they are carried out outside the territory
    of the Union, they shall follow the OECD Principles of Good Laboratory Practice. The applicant
    shall provide evidence of compliance with those requirements and shall justify any deviation
    from the standard protocols.
