- article: Point 1
  law_celex: 32015H1381
  criticality: recommended
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Perform during the years 2016, 2017 and 2018 monitoring on the presence
    of arsenic in food, including a wide variety of foodstuffs reflecting consumption habits
    such as cereal grains, cereal based products, fruit and vegetable juices, drinking water,
    coffee, dry tea leaves, beer, fish and sea food, vegetables, algae products, milk, dairy
    products, food intended for infants and young children, food for special medical purposes
    and food supplements
- article: Point 2
  law_celex: 32015H1381
  criticality: recommended
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Follow the sampling procedures as laid down in Commission Regulation (EC)
    No 333/2007 to ensure that the samples are representative for the sampled lot
- article: Point 3
  law_celex: 32015H1381
  criticality: recommended
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Carry out the analysis of arsenic, preferably by determining the content
    of inorganic and total arsenic and, if possible, other relevant arsenic species in accordance
    with Annex III to Regulation (EC) No 882/2004 using a method of analysis that has been
    proven to generate reliable results
- article: Point 4
  law_celex: 32015H1381
  criticality: recommended
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Provide on a regular basis to EFSA the monitoring data expressed on whole
    weight basis with the information and in the electronic reporting format as set out by
    EFSA for compilation into one database
