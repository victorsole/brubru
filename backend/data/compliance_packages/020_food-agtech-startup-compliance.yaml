  law_celex: 32017R2469
  criticality: critical
  addressee: economic_operator
  applicable_entity: applicants for novel food authorization
  deadline: null
  interpretive: null
  requirement_text: Where it cannot be excluded that a novel food intended for a particular
    group of the population would be also consumed by other groups of the population the safety
    data provided shall also cover those groups.
- article: Article 5(7)
  law_celex: 32017R2469
  criticality: critical
  addressee: economic_operator
  applicable_entity: applicants for novel food authorization
  deadline: null
  interpretive: null
  requirement_text: For each biological or toxicological study, the applicant shall clarify
    whether the test material conforms to the proposed or existing specification. Where the
    test material differs from that specification, the applicant shall demonstrate the relevance
    of those data to the novel food under consideration.
- article: Article 5(7)
  law_celex: 32017R2469
  criticality: critical
  addressee: economic_operator
  applicable_entity: applicants for novel food authorization
  deadline: null
  interpretive: null
