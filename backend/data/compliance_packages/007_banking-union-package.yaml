  requirement_text: Member States shall apply measures from 26 June 2021
- article: Article 67(1)
  law_celex: 32019L2034
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall apply the measures necessary to comply with point
    (6) of Article 62 as regards Article 8a(3) of Directive 2013/36/EU
- article: Article 67(1)
  law_celex: 32019L2034
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall apply the measures necessary to comply with point
    (5) of Article 64
- article: Article 138 CRR
  law_celex: null
  criticality: critical
  addressee: eu_agency
  applicable_entity: European Banking Authority (EBA)
  deadline: null
  interpretive: null
  requirement_text: EBA is required to refuse or revoke confirmation if the ECAI has used
    an unsolicited credit assessment to put pressure on the rated entity to place an order
    for a credit assessment or other services
- article: Article 11 CRA Regulation
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: credit rating agencies
  deadline: null
  interpretive: null
  requirement_text: Credit rating agencies are required to submit data concerning their credit
    ratings to CEREP
- article: Article 2
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: This Decision
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the twentieth day following that
    of its publication in the Official Journal of the European Union
- article: Recital 7
  law_celex: 32013R1022
  criticality: recommended
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: true
  requirement_text: Competent authorities should use the handbook
- article: Article 1(2)(a)
  law_celex: 32013R1022
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Banking Authority
  deadline: null
  interpretive: null
  requirement_text: The Authority shall act within the powers conferred by this Regulation
    and within the scope of specified directives and regulations
- article: Article 2(1)
  law_celex: 32016D0188
  criticality: critical
  addressee: economic_operator
  applicable_entity: users of SSM electronic applications, systems, platforms and services
  deadline: null
  interpretive: null
  requirement_text: SSM electronic applications, systems, platforms and services with medium
    or above medium criticality shall only be accessed and used if a user has been authenticated
    by means of an electronic certificate issued and managed by a certification authority
    accepted in accordance with the ESCB/SSM certificate acceptance framework, including by
    the ESCB-PKI certification authority.
- article: Article 2(2)
  law_celex: 32016D0188
  criticality: critical
  addressee: economic_operator
  applicable_entity: ESCB-PKI certification authority
  deadline: null
  interpretive: null
  requirement_text: The ESCB-PKI certification authority shall issue electronic certificates
    and provide other certification services to the competent authorities participating in
    the ESCB-PKI pursuant to Article 3 for their certificate subscribers and for the certificate
    subscribers of third parties working with them to enable them to securely access and use
    SSM electronic applications, systems, platforms and services.
- article: Article 3(2)
  law_celex: 32016D0188
  criticality: critical
  addressee: economic_operator
  applicable_entity: participating competent authorities
  deadline: null
  interpretive: null
  requirement_text: The participating competent authority shall be subject to the obligations
    set out in Articles 6, 7 and 12 of Decision ECB/2013/1 and shall submit a declaration
    to the Governing Council by which it confirms its participation and compliance with the
    obligations laid down in the Level 2 — Level 3 Agreement referred to in Article 4(2) of
    that Decision.
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall assess the compliance of credit institutions
    and investment firms with the requirements to use the Internal Ratings Based Approach
    at all times, covering all requirements irrespective of their degree of materiality
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall apply the same criteria to all aspects of
    the assessment of compliance with the requirements to use the IRB Approach, including
    initial applications, additional applications, material changes, notifications, ongoing
    reviews, and applications for return to less sophisticated approaches
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall apply the same methods for assessment to ensure
    consistent assessment of compliance with IRB Approach requirements throughout the Union
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify compliance with the minimum criteria
    specified in this Regulation and any other relevant criteria necessary for assessing IRB
    Approach compliance
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: In subsequent requests for permission based on approved sequential implementation
    plans, competent authorities shall base their assessment at least on the rules on use
    and experience test, assignment to grades or pools, rating systems and risk quantification
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Where an institution has delegated tasks, activities or functions relating
    to rating systems to a third party or obtained rating systems from a third party vendor,
    competent authorities shall verify that all rating systems and related processes are assessed,
    adequate controls are implemented, full documentation is available, and the institution
    has sufficient in-house understanding
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify the appropriateness of the time limit
    for implementation of the roll-out plan, compliance with deadlines, and the necessity
    of changes to the roll-out plan
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify that all exposures covered by the roll-out
    plan have a defined and reasonable maximum timeframe for implementation of the IRB Approach
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify the robustness of the validation function,
    including independence from credit risk control unit, completeness, frequency and adequacy
    of methods and procedures, and soundness of the reporting process
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify that validation of performance of rating
    systems covering material portfolios and back-testing of all other rating systems is performed
    at least annually
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify that all areas of the IRB Approach
    are effectively covered by internal audits and that annual reviews are performed to determine
    areas requiring more thorough reviews
- article: General requirement
  law_celex: 32022R0439
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall verify that rating systems are incorporated
    in the relevant processes of the institution within the broader processes of risk management,
    credit approval and decision-making process as part of the use test
- article: Article 1
  law_celex: 32017D0935
  criticality: critical
  addressee: economic_operator
  applicable_entity: members of management bodies of significant supervised entities
  deadline: null
  interpretive: null
  requirement_text: Members of the management body of a significant supervised entity must
    fulfil fit and proper requirements at all times in accordance with Article 91 of Directive
    2013/36/EU and any other applicable law
- article: Article 2(1)
  law_celex: 32017D0935
  criticality: critical
  addressee: economic_operator
  applicable_entity: ECB Governing Council
  deadline: null
  interpretive: null
  requirement_text: The Governing Council delegates the power to adopt fit and proper decisions
    to the heads of work units nominated by the Executive Board in accordance with Article
    5 of Decision (EU) 2017/933 (ECB/2016/40)
- article: Article 2(2)
  law_celex: 32017D0935
  criticality: critical
  addressee: economic_operator
  applicable_entity: heads of work units
  deadline: null
  interpretive: null
  requirement_text: The heads of work units shall adopt delegated decisions in accordance
    with this Decision and applicable law
- article: Article 3(1)
  law_celex: 32017D0935
  criticality: critical
  addressee: economic_operator
  applicable_entity: heads of work units
  deadline: null
  interpretive: null
  requirement_text: A fit and proper decision shall not be adopted by means of a delegated
    decision if the relevant supervised entity is the supervised entity at the highest level
    of consolidation within the participating Member States of a significant supervised group
- article: Article 3(1)
  law_celex: 32017D0935
  criticality: critical
  addressee: economic_operator
  applicable_entity: heads of work units
  deadline: null
  interpretive: null
  requirement_text: A fit and proper decision shall not be adopted by means of a delegated
    decision if the relevant supervised entity is the credit institution with the largest
    total value of assets in a significant supervised group, if this entity is different to
    that referred to in point (a)
- article: Article 1(1)
  law_celex: 32022R2060
  criticality: critical
  addressee: economic_operator
  applicable_entity: institutions
  deadline: null
  interpretive: null
  requirement_text: Risk factors that do not belong to a curve, surface or cube shall be assessed
    as modellable where specific criteria are met regarding verifiable prices over 12-month
    observation periods
- article: Article 1(1)(a)(i)
  law_celex: 32022R2060
  criticality: critical
  addressee: economic_operator
  applicable_entity: institutions
  deadline: null
  interpretive: null
  requirement_text: The institution has identified for that risk factor the existence of at
    least 24 prices which are verifiable, have distinct observation dates and are considered
    representative of that risk factor
- article: Article 1(1)(a)(ii)
  law_celex: 32022R2060
  criticality: critical
  addressee: economic_operator
  applicable_entity: institutions
  deadline: null
  interpretive: null
  requirement_text: There has not been a period of 90 days or more in which there were less
    than four of the verifiable prices
- article: Article 1(1)(b)
  law_celex: 32022R2060
  criticality: critical
  addressee: economic_operator
  applicable_entity: institutions
  deadline: null
  interpretive: null
