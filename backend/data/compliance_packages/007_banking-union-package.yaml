  requirement_text: Comply with Directive 2013/36/EU of the European Parliament and of the
    Council of 26 June 2013 on access to the activity of credit institutions and the prudential
    supervision of credit institutions and investment firms, amending Directive 2002/87/EC
    and repealing Directives 2006/48/EC and 2006/49/EC (Text with EEA relevance)
- article: Article 67(1)
  law_celex: 32019L2034
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: '2021-06-26'
