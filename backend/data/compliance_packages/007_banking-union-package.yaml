requirements:
- article: Recital 14
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB and competent authorities of non-participating Member States
  deadline: null
  interpretive: true
  requirement_text: The ECB and the competent authorities of Member States that are not participating
    Member States shall conclude a memorandum of understanding describing in general terms
    how they will cooperate with one another in the performance of their supervisory tasks
    under Union law in relation to the financial institutions referred to in this Regulation.
- article: Recital 14
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB and competent authorities of non-participating Member States
  deadline: null
  interpretive: true
  requirement_text: The memorandum should be reviewed on a regular basis.
- article: Recital 16
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB
  deadline: null
  interpretive: true
  requirement_text: The ECB should be able to exercise supervisory tasks in relation to all
    credit institutions authorised in, and branches established in, participating Member States.
- article: Recital 17
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB
  deadline: null
  interpretive: true
  requirement_text: When carrying out the tasks conferred on it, and without prejudice to
    the objective to ensure the safety and soundness of credit institutions, the ECB should
    have full regard to the diversity of credit institutions and their size and business models,
    as well as the systemic benefits of diversity in the banking industry of the Union.
- article: Recital 18
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB
  deadline: null
  interpretive: true
  requirement_text: The exercise of the ECB's tasks should contribute in particular to ensure
    that credit institutions fully internalise all costs caused by their activities so as
    to avoid moral hazard and the excessive risk taking arising from it.
- article: Recital 18
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB
  deadline: null
  interpretive: true
  requirement_text: It should take full account of the relevant macroeconomic conditions in
    Member States, in particular the stability of the supply of credit and facilitation of
    productive activities for the economy at large.
- article: Recital 20
  law_celex: 32013R1024
  criticality: recommended
  addressee: economic_operator
  applicable_entity: ECB
  deadline: null
  interpretive: true
  requirement_text: The ECB should therefore have the task of authorising credit institutions
    that are to be established in a participating Member State and should be respon
- article: Article 1(1)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: When assessing the appropriateness of the risk weights referred to in
    Article 124(2), first subparagraph, of Regulation (EU) No 575/2013, the authorities designated
    in accordance with Article 124(1a) of that Regulation shall determine the loss experience
    as the ratio of losses to exposure value for exposures secured by mortgages on residential
    property and commercial immovable property
- article: Article 1(1)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: When assessing the appropriateness of the risk weights, the authorities
    shall determine the loss expectation as the best estimate of losses to be realised during
    a forward-looking horizon of at least one year, and, if so determined by that authority,
    up to three years
- article: Article 1(1)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: The loss expectation shall be determined as the average of the estimated
    losses for each year during the chosen forward-looking horizon
- article: Article 1(2)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: The authorities shall determine the loss expectation by adjusting the
    loss experience upwards or downwards, or by keeping the loss experience unchanged
- article: Article 1(2)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: When determining the loss expectation, the authorities shall reflect the
    forward-looking immovable property market developments during a forward-looking horizon
    of at least one year and, if so determined by that authority, up to three years
- article: Article 1(3)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: 'The loss expectation shall be based on all of the following: historical
    evolution and cyclical characteristics of the immovable property market, past and present
    structural characteristics, fundamental drivers of demand and supply, riskiness of exposures,
    expected evolution in prices and volatility, expected evolution in macroeconomic variables,
    time horizon, national specificities, and other relevant data indicators'
- article: Article 1(4)
  law_celex: 32023R0206
  criticality: critical
  addressee: economic_operator
  applicable_entity: authorities designated in accordance with Article 124(1a) of Regulation
    (EU) No 575/2013
  deadline: null
  interpretive: null
  requirement_text: Where there is a lot of uncertainty as to the factors referred to in paragraph
    3, point (e), the authorities shall consider a margin of prudence when determining the
    loss expectation
- article: Article 2
  law_celex: 32013R0797
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Union institutions
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the date of its publication in
    the Official Journal of the European Union
- article: Article 2
  law_celex: 32020D1575
  criticality: critical
  addressee: national_authority
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: The competent authority to assess reports and give feedback to the whistleblower,
    and/or to follow up on reports concerning high-level ECB officials shall be the President,
    or where the high-level ECB official referred to in the report is the President, the Vice-President
- article: Article 3(1)
  law_celex: 32020D1575
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: Reports concerning high-level ECB officials shall be followed up in accordance
    with Decision (EU) 2016/456 where such reports fall within the scope of that Decision
- article: Article 3(2)
  law_celex: 32020D1575
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: Reports that do not fall within the scope of Decision (EU) 2016/456 shall
    be followed up in accordance with Administrative Circular 01/2006 on internal administrative
    inquiries
- article: Article 4
  law_celex: 32020D1575
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the third day following that of
    its publication in the Official Journal of the European Union
- article: Article 162(1)
  law_celex: 32013L0036
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: '2014-01-01'
  interpretive: null
  requirement_text: Member States shall apply those provisions from 1 January 2014
- article: Article 162(6)
  law_celex: 32013L0036
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: '2014-01-01'
  interpretive: null
  requirement_text: Article 133 shall apply from 1 January 2014
- article: General
  law_celex: 32013L0036
  criticality: important
  addressee: economic_operator
  applicable_entity: Banks, credit institutions, financial supervisors
  deadline: null
