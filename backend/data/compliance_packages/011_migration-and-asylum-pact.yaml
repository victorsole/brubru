- article: Recital 25
  law_celex: 32013L0032
  criticality: recommended
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: true
  requirement_text: 'The procedure in which an application for international protection is
    examined should normally provide an applicant at least with: the right to stay pending
    a decision by the determining authority; access to the services of an interpreter for
    submitting his or her case if interviewed by the authorities; the opportunity to communicate
    with a representative of the United Nations High Commissioner for Refugees (UNHCR) and
    with organisations providing advice or counselling to applicants for international protection;
    the right to appropriate notification of a decision and of the reasons for that decision
    in fact and in law; the opportunity to consult a legal adviser or other counsellor; the
    right to be informed of his or her legal position at decisive moments in the course of
    the procedure, in a language which he or she understands or is reasonably supposed to
    understand; and, in the case of a negative decision, the right to an effective remedy
    before a court or a tribunal'
- article: Article 3(1)
  law_celex: 32004L0082
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall take the necessary steps to establish an obligation
    for carriers to transmit at the request of the authorities responsible for carrying out
    checks on persons at external borders, by the end of check-in, information concerning
    the passengers they will carry to an authorised border crossing point through which these
    persons will enter the territory of a Member State.
