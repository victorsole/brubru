id: 28
name: Morocco Aluminium Road Wheels Countervailing Duties (Reg 2025/500)
policy_area: Trade and Economic Security
description: 'Commission Implementing Regulation (EU) 2025/500 imposing definitive countervailing
  (anti-subsidy) duties on certain aluminium road wheels (ARW) from Morocco. Adopted 13 March
  2025 under Article 15 of the Basic Anti-Subsidy Regulation (Reg 2016/1037). Definitive duties:
  Dika Morocco Africa (DMA) 31.4%, Hands 8 5.6%, all other Morocco 5.6% - on top of the existing
  anti-dumping duties of 9.0% to 17.5% (Reg 2023/99). Central legal finding: Chinese Belt-and-Road
  preferential financing channelled through CITIC Dicastal into its Moroccan subsidiary DMA
  is attributed to the Government of Morocco as the country of export, applying the cross-border
  subsidy doctrine affirmed by the Court of Justice on 28 November 2024 (Hengshi/Jushi Egypt,
  C-269/23P and C-272/23P). Lesser-duty rule not applied; duty set at full subsidy amount.'
applicability: 'EU importers and customs authorities; Moroccan exporting producers (Dika Morocco
  Africa, Hands 8); CITIC Dicastal group; EU aluminium road wheel producers; EU automotive
  manufacturers and ACEA; Member State customs. Product scope: certain aluminium road wheels
  of motor vehicles, CN ex 8708 70 10 and ex 8708 70 50 (TARIC 8708701015, 8708701050, 8708705015,
  8708705050), originating in Morocco.'
is_startup_focused: false
is_published: false
laws:
- celex: 32025R0500
  title: Commission Implementing Regulation (EU) 2025/500 of 13 March 2025 imposing definitive
    countervailing duties on imports of certain aluminium road wheels originating in Morocco
requirements:
- article: Article 1(1) (product + duty)
  law_celex: 32025R0500
  criticality: critical
  addressee: economic_operator
  applicable_entity: EU importers of Moroccan ARW
  deadline: null
  interpretive: null
  requirement_text: A definitive countervailing duty is imposed on imports of certain aluminium
    road wheels of motor vehicles of HS headings 8701 to 8705, whether or not with accessories
    and whether or not fitted with tyres, currently falling under CN codes ex 8708 70 10 and
    ex 8708 70 50 (TARIC 8708701015, 8708701050, 8708705015, 8708705050) and originating in
    Morocco.
- article: Article 1(2) (DMA rate)
  law_celex: 32025R0500
  criticality: critical
  addressee: economic_operator
  applicable_entity: Dika Morocco Africa S.A.
  deadline: null
  interpretive: null
  requirement_text: The definitive countervailing duty on the net, free-at-Union-frontier
    price before duty for aluminium road wheels produced by Dika Morocco Africa S.A. is 31.4%
    (TARIC additional code C897).
- article: Article 1(2) (Hands 8 + residual)
  law_celex: 32025R0500
  criticality: critical
  addressee: economic_operator
  applicable_entity: Hands 8 and all other Morocco
  deadline: null
  interpretive: null
  requirement_text: The definitive countervailing duty is 5.6% for Hands 8 S.A. (TARIC additional
    code C873) and 5.6% for all other imports originating in Morocco (TARIC additional code
    C999).
- article: Relationship to anti-dumping duties
  law_celex: 32025R0500
  criticality: important
  addressee: economic_operator
  applicable_entity: EU importers of Moroccan ARW
  deadline: null
  interpretive: null
  requirement_text: These countervailing duties apply in addition to the definitive anti-dumping
    duties of 9.0% to 17.5% already imposed on the same product from Morocco by Commission
    Implementing Regulation (EU) 2023/99, subject to the rule against double-counting export
    subsidies.
- article: Article 1(3) (invoice condition)
  law_celex: 32025R0500
  criticality: important
  addressee: economic_operator
  applicable_entity: exporting producers / importers
  deadline: null
  interpretive: null
  requirement_text: Application of the individual (company-specific) duty rates is conditional
    on presentation to customs of a valid commercial invoice bearing a dated and signed declaration
    by a named official certifying the manufacturer and TARIC additional code; otherwise the
    all-other-imports rate applies.
- article: Cross-border subsidy attribution
  law_celex: 32025R0500
  criticality: important
  addressee: economic_operator
  applicable_entity: Moroccan exporting producers
  deadline: null
  interpretive: null
  requirement_text: Chinese preferential financing under the Belt and Road Initiative, channelled
    through CITIC Dicastal into its Moroccan subsidiary, is attributed to the Government of
    Morocco as the country of export, applying the doctrine affirmed by the Court of Justice
    on 28 November 2024 in the Hengshi/Jushi Egypt cases (C-269/23 P and C-272/23 P).
- article: Subsidy schemes (DMA)
  law_celex: 32025R0500
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Dika Morocco Africa S.A.
  deadline: null
  interpretive: null
  requirement_text: DMA's countervailed subsidies (overall 31.45%) include a preferential
    price of inputs (15.65%), de facto loans linked to capital goods (5.44%) and to the provision
    of inputs (2.03%), capitalised loans and payables, loans from related Chinese entities,
    a grant, and Moroccan import-duty, corporate-income-tax and professional-tax exemptions.
- article: Subsidy schemes (Hands 8)
  law_celex: 32025R0500
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Hands 8 S.A.
  deadline: null
  interpretive: null
  requirement_text: Hands 8's countervailed subsidies (overall 5.60%) include a grant (1.57%)
    and Moroccan import-duty, corporate-income-tax and professional-tax exemptions, plus a
    preferential-financing element.
- article: Level of measures (no lesser duty)
  law_celex: 32025R0500
  criticality: important
  addressee: economic_operator
  applicable_entity: exporting producers / importers
  deadline: null
  interpretive: null
  requirement_text: Under Article 15(1) of the basic Regulation the duty may not exceed the
    countervailable subsidies; the lesser-duty rule does not apply in anti-subsidy investigations
    unless the full amount is clearly not in the Union interest, so the duty is set at the
    full subsidy amount.
- article: Injury and causation finding
  law_celex: 32025R0500
  criticality: recommended
  addressee: commission
  applicable_entity: Union ARW industry
  deadline: null
  interpretive: null
  requirement_text: The Commission found material injury to the Union industry (profitability
    falling from 1% in 2020 to minus 3% in the investigation period, market share falling
    from 71% to 65%) caused by surging subsidised Moroccan imports (volume index 100 to 675;
    market share 2% to 9%).
- article: Association Agreement objection
  law_celex: 32025R0500
  criticality: recommended
  addressee: commission
  applicable_entity: Government of Morocco
  deadline: null
  interpretive: null
  requirement_text: The Commission rejected Morocco's argument that countervailing duties
    are barred by Articles 8 and 9 of the EU-Morocco Euro-Mediterranean Association Agreement,
    relying on Article 36, which makes the GATT Article VI rules (and thus the WTO ASCM and
    the basic Regulation) the applicable disciplines for trade-distorting subsidies.
- article: Article 2 (entry into force)
  law_celex: 32025R0500
  criticality: recommended
  addressee: economic_operator
  applicable_entity: EU importers / customs authorities
  deadline: null
  interpretive: null
  requirement_text: The Regulation enters into force on the day following its publication
    in the Official Journal of the European Union; unless otherwise specified, the provisions
    in force concerning customs duties apply.
