id: 61
name: EU Batteries Regulation (Reg 2023/1542)
policy_area: Environment
description: 'Regulation (EU) 2023/1542 concerning batteries and waste batteries, repealing
  Directive 2006/66/EC and amending the Waste Framework Directive 2008/98/EC and the market
  surveillance Regulation (EU) 2019/1020. The first EU law to regulate a product across its
  entire life cycle in a single instrument, from sustainable and responsible sourcing of raw
  materials through manufacturing, carbon footprint, performance and durability, safety, labelling
  and information, to collection, recycling efficiency and the recovery of critical raw materials
  at end of life. Covers five battery categories: portable, light means of transport (LMT),
  starting-lighting-ignition (SLI), industrial and electric vehicle (EV) batteries. Introduces
  a mandatory carbon footprint declaration, minimum recycled-content thresholds for cobalt,
  lead, lithium and nickel, supply-chain due diligence obligations for larger economic operators,
  removability and replaceability rules for portable and LMT batteries, and a digital battery
  passport with a QR code for LMT, industrial and EV batteries. Legal bases Article 114 TFEU
  (internal market) and Article 192(1) TFEU (environment). Entered into force 17 August 2023;
  most provisions apply from 18 February 2024, with staggered dates running to 2036 for the
  toughest sustainability and end-of-life targets.'
applicability: All economic operators placing batteries on the Union market or putting them
  into service, regardless of whether the battery is produced in the Union or imported, sold
  on its own or incorporated into appliances, light means of transport, vehicles or other
  products. Manufacturers, importers, distributors, authorised representatives and producers
  (for extended producer responsibility) all carry obligations. Supply-chain due diligence
  applies to economic operators with net turnover above 40 million euros (with group and small-and-medium-sized-enterprise
  carve-outs). Producer responsibility organisations, waste operators and recyclers are bound
  by the collection, treatment and recycling-efficiency duties.
is_startup_focused: false
is_published: true
laws:
- celex: 32023R1542
  title: Regulation (EU) 2023/1542 of the European Parliament and of the Council of 12 July
    2023 concerning batteries and waste batteries, amending Directive 2008/98/EC and Regulation
    (EU) 2019/1020 and repealing Directive 2006/66/EC
requirements:
- article: Art 6
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-02-18'
  interpretive: null
  requirement_text: 'SUBSTANCE RESTRICTIONS: batteries placed on the market must not contain
    restricted substances beyond the limits in Annex I (including mercury, cadmium and lead
    limits carried over and tightened from Directive 2006/66/EC). The Commission may amend
    Annex I via the REACH-aligned restriction procedure (Articles 86 to 88, ECHA dossier).'
- article: Art 7
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2025-02-18'
  interpretive: null
  requirement_text: 'CARBON FOOTPRINT DECLARATION: electric vehicle, rechargeable industrial
    (above 2 kWh) and light means of transport (LMT) batteries must carry a carbon footprint
    declaration per functional unit. Applies from 18 Feb 2025 (EV), 18 Feb 2026 (industrial
    above 2 kWh), 18 Aug 2028 (LMT). A carbon footprint performance class label follows, then
    compliance with a maximum life-cycle carbon footprint threshold (EV from 18 Feb 2028).'
- article: Art 8
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2031-08-18'
  interpretive: null
  requirement_text: 'RECYCLED CONTENT: industrial (above 2 kWh), EV, SLI and (from 2036) LMT
    batteries containing cobalt, lead, lithium or nickel must first disclose, then meet minimum
    recycled-content shares. From 18 Aug 2031: cobalt 16 percent, lead 85 percent, lithium
    6 percent, nickel 6 percent. From 18 Aug 2036 these tighten to cobalt 26 percent, lithium
    12 percent, nickel 15 percent (lead stays 85 percent).'
- article: Art 9
  law_celex: 32023R1542
  criticality: recommended
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-02-18'
  interpretive: null
  requirement_text: 'PERFORMANCE AND DURABILITY (portable general use): portable batteries
    of general use (AA, AAA, button cells and other standardised formats) must meet minimum
    electrochemical performance and durability values set by delegated act; the phase-out
    of non-rechargeable portable general-use batteries is kept under review.'
- article: Art 10
  law_celex: 32023R1542
  criticality: recommended
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-02-18'
  interpretive: null
  requirement_text: 'PERFORMANCE AND DURABILITY (rechargeable): rechargeable industrial (above
    2 kWh), LMT and EV batteries must be accompanied by documentation of electrochemical performance
    and durability parameters (Annex IV), and later meet minimum values set by delegated act.'
- article: Art 11
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operator placing the product on the market
  deadline: '2027-02-18'
  interpretive: null
  requirement_text: 'REMOVABILITY AND REPLACEABILITY: portable batteries incorporated in products
    must be readily removable and replaceable by the end-user; LMT batteries must be removable
    and replaceable by an independent professional. Applies from 18 Feb 2027. This is the
    Regulation''s core right-to-repair obligation.'
- article: Art 12
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-02-18'
  interpretive: null
  requirement_text: 'SAFETY OF STATIONARY STORAGE: stationary battery energy storage systems
    (BESS) must be accompanied by technical documentation demonstrating they are safe during
    normal operation and use, evidenced by successful testing for the safety parameters in
    Annex V.'
- article: Art 13
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2027-02-18'
  interpretive: null
  requirement_text: 'LABELLING, MARKING AND QR CODE: batteries must carry labels with capacity
    and other data, the separate-collection symbol (from 18 Aug 2025), heavy-metal symbols
    where applicable, and a QR code giving access to required information and (for LMT, industrial
    above 2 kWh and EV batteries) the battery passport. The QR code is mandatory from 18 Feb
    2027.'
- article: Art 14
  law_celex: 32023R1542
  criticality: recommended
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-02-18'
  interpretive: null
  requirement_text: 'BATTERY MANAGEMENT SYSTEM DATA: stationary BESS, LMT and EV batteries
    must contain a battery management system storing state-of-health and expected lifetime
    data, with read-only access for the natural or legal person who has lawfully purchased
    the battery (or a third party acting on their behalf), to support second-life assessment.'
- article: Art 17-18
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: manufacturer
  deadline: '2024-08-18'
  interpretive: null
  requirement_text: 'CONFORMITY ASSESSMENT AND CE MARKING: before placing a battery on the
    market the manufacturer must carry out the applicable conformity assessment procedure
    (Annex VIII), draw up an EU declaration of conformity and affix the CE marking. Applies
    from 18 Aug 2024.'
- article: Art 48-52
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operator (turnover >= 40m euros)
  deadline: '2025-08-18'
  interpretive: null
  requirement_text: 'SUPPLY-CHAIN DUE DILIGENCE: economic operators with net turnover of 40
    million euros or more must adopt, maintain, independently verify and publicly report a
    battery due diligence policy covering the raw materials cobalt, natural graphite, lithium
    and nickel, addressing social and environmental risk categories in Annex X. Applies from
    18 Aug 2025. Small and medium-sized enterprises are exempt.'
- article: Art 55-56
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: producer
  deadline: '2025-08-18'
  interpretive: null
  requirement_text: 'PRODUCER REGISTRATION AND EPR: producers must register in the producer
    register of every Member State where they first make a battery available, and bear extended
    producer responsibility, financing and organising the collection, treatment and recycling
    of the batteries they place on the market. Applies from 18 Aug 2025.'
- article: Art 59-60
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: producer / producer responsibility organisation
  deadline: '2027-12-31'
  interpretive: null
  requirement_text: 'COLLECTION TARGETS: producers (or PROs) must set up free take-back and
    collection networks and meet binding collection targets. Portable batteries: 63 percent
    by 31 Dec 2027 and 73 percent by 31 Dec 2030. LMT batteries: 51 percent by 31 Dec 2028
    and 61 percent by 31 Dec 2031.'
- article: Art 62
  law_celex: 32023R1542
  criticality: recommended
  addressee: economic_operator
  applicable_entity: distributor
  deadline: '2025-08-18'
  interpretive: null
  requirement_text: 'DISTRIBUTOR TAKE-BACK: distributors must take back waste batteries from
    end-users free of charge and with no obligation to buy a new battery, regardless of chemical
    composition, origin or brand. Applies from 18 Aug 2025.'
- article: Art 71
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: recycler / waste management operator
  deadline: '2025-12-31'
  interpretive: null
  requirement_text: 'RECYCLING EFFICIENCY (Annex XII Part B): recycling processes must reach
    minimum recycling efficiencies by 31 Dec 2025: lead-acid 75 percent, lithium-based 65
    percent, nickel-cadmium 80 percent, other 50 percent. Rising by 31 Dec 2030 to lead-acid
    80 percent and lithium-based 70 percent.'
- article: Art 71
  law_celex: 32023R1542
  criticality: important
  addressee: economic_operator
  applicable_entity: recycler / waste management operator
  deadline: '2027-12-31'
  interpretive: null
  requirement_text: 'MATERIAL RECOVERY (Annex XII Part C): recyclers must recover, from waste
    batteries, cobalt, copper, lead and nickel at 90 percent by 31 Dec 2027 and 95 percent
    by 31 Dec 2031, and lithium at 50 percent by 31 Dec 2027 and 80 percent by 31 Dec 2031.'
- article: Art 75-76
  law_celex: 32023R1542
  criticality: recommended
  addressee: economic_operator
  applicable_entity: producer / waste management operator
  deadline: '2025-08-18'
  interpretive: null
  requirement_text: 'REPORTING: producers, PROs and waste management operators must report
    annually to competent authorities on batteries placed on the market, collected, and treated,
    and on collection, recycling-efficiency and recovery rates achieved, for onward reporting
    to the Commission. Applies from 18 Aug 2025.'
- article: Art 77-78
  law_celex: 32023R1542
  criticality: critical
  addressee: economic_operator
  applicable_entity: economic operator placing the battery on the market
  deadline: '2027-02-18'
  interpretive: null
  requirement_text: 'DIGITAL BATTERY PASSPORT: LMT, industrial (above 2 kWh) and EV batteries
    placed on the market must have an electronic battery passport, unique per battery, accessible
    via the QR code, holding composition, carbon footprint, supply-chain due diligence, performance,
    durability and end-of-life data with public and restricted-access layers. Applies from
    18 Feb 2027.'
