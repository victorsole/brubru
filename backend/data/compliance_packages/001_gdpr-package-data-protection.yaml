requirements:
- article: Article 1(2)(b)
  law_celex: 32023L2123
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Each Member State shall ensure that personal data are processed pursuant
    to paragraph 3 of this Article only for the purposes of the prevention, investigation,
    detection or prosecution of terrorist offences and other criminal offences for which Europol
    is competent, as listed in Annex I of Regulation (EU) 2016/794
- article: Article 1(2)(c)
  law_celex: 32023L2123
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: The categories of personal data to be transmitted to Europol for the purposes
    referred to in paragraph 3a shall remain limited to those referred to in Section B, point
    2, of Annex II to Regulation (EU) 2016/794
- article: Article 1(2)(d)
  law_celex: 32023L2123
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: The categories of personal data that may be exchanged between Member States
    for the purposes referred to in the first subparagraph shall remain limited to those referred
    to in Section B, point 2, of Annex II to Regulation (EU) 2016/794
- article: Article 2(1)
  law_celex: 32023L2123
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: '2025-11-01'
  interpretive: null
  requirement_text: Member States shall bring into force the laws, regulations and administrative
    provisions necessary to comply with this Directive by 1 November 2025
- article: Article 2(1)
  law_celex: 32023L2123
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: They shall immediately inform the Commission thereof
- article: Article 2(1)
  law_celex: 32023L2123
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: When Member States adopt those measures, they shall contain a reference
    to this Directive or shall be accompanied by such a reference on the occasion of their
    official publication
- article: Article 2(2)
  law_celex: 32023L2123
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall communicate to the Commission the text of the main
    measures of national law which they adopt in the field covered by this Directive
- article: Article 1(1)
  law_celex: 32019D0165
  criticality: critical
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: null
  requirement_text: Commission must follow rules to inform data subjects of the processing
    of their data in accordance with Articles 14, 15 and 16 of Regulation (EU) 2018/1725 when
    conducting administrative inquiries, pre-disciplinary, disciplinary and suspension proceedings
- article: Article 2(1)
  law_celex: 32019D0165
  criticality: critical
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: null
  requirement_text: Commission shall consider whether any exceptions laid down in Regulation
    (EU) 2018/1725 apply when exercising duties with respect to data subjects' rights
- article: Recital 10
  law_celex: 32019D0165
  criticality: recommended
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: true
  requirement_text: Commission should inform all individuals of its activities involving processing
    of their personal data and of their rights, in a transparent and coherent manner, by means
    of data protection notices published on the Commission's website
- article: Recital 10
  law_celex: 32019D0165
  criticality: recommended
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: true
  requirement_text: Commission should individually inform, in an appropriate format, the data
    subjects involved in an administrative inquiry or in pre-disciplinary, disciplinary or
    suspension proceedings
- article: Recital 13
  law_celex: 32019D0165
  criticality: recommended
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: true
  requirement_text: Commission should handle all restrictions in a transparent manner and
    register each application of restrictions in the corresponding record system
- article: Recital 15
  law_celex: 32019D0165
  criticality: recommended
  addressee: commission
  applicable_entity: European Commission
  deadline: null
  interpretive: true
  requirement_text: Commission should regularly review the restrictions imposed in order to
    ensure that the data subject's rights to be informed are restricted only as long as such
    restrictions are necessary
- article: Recital 16
  law_celex: 32019D0165
  criticality: recommended
  addressee: economic_operator
  applicable_entity: data controllers
  deadline: null
  interpretive: true
  requirement_text: Controller should assess on a case-by-case basis whether the communication
    of the restriction would compromise its purpose when other rights of data subjects are
    restricted
- article: Recital 17
  law_celex: 32019D0165
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Data Protection Officer of the European Commission
  deadline: null
  interpretive: true
  requirement_text: Data Protection Officer of the European Commission should carry out an
    independent review of the application of restrictions, with a view to ensuring compliance
    with this Decision
- article: Article 6(5)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Director of the Authority for European political parties and European
    political foundations
  deadline: null
  interpretive: null
  requirement_text: The Director of the Authority shall exercise the powers conferred on the
    appointing authority by the Staff Regulations and the powers conferred on the authority
    empowered to conclude contracts of employment by the Conditions of Employment of Other
    Servants
- article: Article 6(5)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Authority staff
  deadline: null
  interpretive: null
  requirement_text: The selection of staff shall not result in a conflict of interests between
    their duties at the Authority and any other official duties, and they shall refrain from
    any act which is incompatible with the nature of their duties
- article: Article 10a(1)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: No European political party or European political foundation shall deliberately
    influence, or attempt to influence, the outcome of elections to the European Parliament
    by taking advantage of an infringement by a natural or legal person of the applicable
    rules on the protection of personal data
- article: Article 10a(2)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Authority for European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: The Authority shall refer matters to the committee of independent eminent
    persons when informed of a decision of a national supervisory authority finding infringement
    of data protection rules linked to political activities in the context of European Parliament
    elections
- article: Article 10a(3)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Authority for European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: The Authority shall request the opinion without undue delay, and no later
    than 1 month after being informed of the decision of the national supervisory authority
- article: Article 10a(3)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Authority for European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: The Authority shall set a short, reasonable deadline for the committee
    to give its opinion
- article: Article 10a(3)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Committee of independent eminent persons
  deadline: null
  interpretive: null
  requirement_text: The committee shall comply with the deadline set by the Authority
- article: Article 10a(4)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: Authority for European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: The decision of the Authority shall be duly reasoned, in particular with
    regard to the committee's opinion, and shall be published expeditiously
- article: Article 11(3)
  law_celex: 32019R0493
  criticality: critical
  addressee: national_authority
  applicable_entity: National supervisory authorities
  deadline: null
  interpretive: null
  requirement_text: The national supervisory authority shall cooperate with the committee
    in accordance with applicable law
- article: Article 18(2)
  law_celex: 32019R0493
  criticality: critical
  addressee: economic_operator
  applicable_entity: European political parties and European political foundations
  deadline: null
  interpretive: null
  requirement_text: European political parties and foundations must remain registered in the
    Register and may not be the subject of sanctions from the date of application until the
    end of the financial year or action covered by the contribution or grant
- article: Article 1(1)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: Head of Division of IG/IN
  deadline: null
  interpretive: null
  requirement_text: The relevant data controller must follow rules to inform data subjects
    of the processing of their data in accordance with Articles 14, 15 and 16 of Regulation
    (EU) 2018/1725
- article: Article 2(2)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: Head of Division of IG/IN
  deadline: null
  interpretive: null
  requirement_text: Personal data must be stored in a secured electronic and physical environment,
    which prevents unlawful access or transfer of data to persons who do not have a need to
    know
- article: Article 2(3)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: Head of Division of IG/IN
  deadline: null
  interpretive: null
  requirement_text: Personal data processed must be retained for at least five years and up
    to 10 years after the closure of the investigation
- article: Article 2(3)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: Head of Division of IG/IN
  deadline: null
  interpretive: null
  requirement_text: Data related to unsubstantiated cases shall be retained for up to five
    years maximum
- article: Article 2(4)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: Head of Division of IG/IN
  deadline: null
  interpretive: null
  requirement_text: Longer periods than specified must be subject to agreement of the DPO
    for exceptional and duly justified cases
- article: Article 3(1)
  law_celex: null
  criticality: critical
  addressee: economic_operator
  applicable_entity: IG/IN (Fraud Investigations Division)
  deadline: null
  interpretive: null
  requirement_text: IG/IN shall consider whether any of the exceptions laid down in the Regulation
    apply when exercising duties with respect to data subjects' rights
- article: Recital (7)
  law_celex: null
  criticality: recommended
  addressee: economic_operator
  applicable_entity: relevant data controller
  deadline: null
  interpretive: true
  requirement_text: The relevant data controller should inform all individuals of its activities
    involving processing of their personal data and of their rights in a transparent and coherent
    manner in the form of data protection notices published on the EIB website and the EIB
    Intranet, as well as individually inform data subjects relevant to its activities
- article: Recital (11)
  law_celex: null
  criticality: recommended
  addressee: economic_operator
  applicable_entity: IG/IN and OCCO
  deadline: null
  interpretive: true
  requirement_text: IG/IN and OCCO should handle all restrictions in a transparent manner
    and register each application of restrictions in the corresponding record system
- article: Recital (12)
  law_celex: null
  criticality: recommended
  addressee: economic_operator
  applicable_entity: relevant data controller
  deadline: null
  interpretive: true
  requirement_text: The relevant data controller should regularly review its position to ensure
    that the data subject's right to be informed is restricted only as long as the reasons
    for the deferral last
- article: Recital (13)
  law_celex: null
  criticality: recommended
  addressee: economic_operator
  applicable_entity: controller
  deadline: null
  interpretive: true
  requirement_text: The controller should assess on a case-by-case basis whether the communication
    of the restriction would compromise its purpose when a restriction of other data subjects'
    rights is applied
- article: Article 11
  law_celex: 32018R1962
  criticality: important
  addressee: eu_agency
  applicable_entity: European Anti-Fraud Office (OLAF)
  deadline: null
  interpretive: null
  requirement_text: The Office should inform all individuals of its activities involving processing
    of their personal data and of their rights in a transparent and coherent manner in the
    form of the data protection notices published on the Office's website, as well as to individually
    inform data subjects relevant to the investigation – persons concerned, witnesses and
    informants – in the appropriate format.
- article: Article 17
  law_celex: 32018R1962
  criticality: important
  addressee: economic_operator
  applicable_entity: Commission services and executive agencies
  deadline: null
  interpretive: null
  requirement_text: All Commission services and executing agencies processing personal data
    subject to their duty to inform the Office under Article 8(1) of Regulation (EU, Euratom)
    No 883/2013 or where such personal data are processed by the Office in the performance
    of its tasks should apply the rules set out in this Decision with a view to protecting
    the processing operations carried out by the Office.
- article: Article 17
  law_celex: 32018R1962
  criticality: important
  addressee: commission
  applicable_entity: Commission services and executive agencies
  deadline: null
  interpretive: null
  requirement_text: The Commission services and executive agencies concerned should therefore
    consult the Office on the relevant grounds for the restrictions and their necessity and
    proportionality in order to ensure their coherent application.
- article: Article 18
  law_celex: 32018R1962
  criticality: important
  addressee: eu_agency
  applicable_entity: European Anti-Fraud Office (OLAF), Commission services and executive
    agencies
  deadline: null
  interpretive: null
  requirement_text: The Office – and, where relevant, Commission services and executive agencies
    – should handle all restrictions in a transparent manner and register each application
    of restrictions in the corresponding record system.
- article: Article 19
  law_celex: 32018R1962
  criticality: important
  addressee: eu_agency
  applicable_entity: European Anti-Fraud Office (OLAF)
  deadline: null
  interpretive: null
  requirement_text: The Office should regularly review its position where the data subject's
    right to be informed in accordance with Articles 16 and 38 of Regulation (EU) 2018/1725
    is restricted only as long as the reasons for the deferral last.
- article: General
  law_celex: 32016L0680
  criticality: important
  addressee: economic_operator
