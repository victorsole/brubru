- article: Art 6
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers processing personal data
  deadline: null
  interpretive: null
  requirement_text: 'Identify and document a valid legal basis before processing any personal
    data. Processing is lawful only if at least one of the six bases applies: consent, contract,
    legal obligation, vital interests, public task, or legitimate interests.'
- article: Arts 13-14
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers processing personal data
  deadline: null
  interpretive: null
  requirement_text: Provide data subjects with clear, concise, transparent privacy information
    at the point of data collection (or within one month if data is obtained indirectly),
    covering the controller's identity, purposes, legal basis, recipients, retention periods
    and data-subject rights.
- article: Art 5
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers processing personal data
  deadline: null
  interpretive: null
  requirement_text: 'Ensure personal data is processed in accordance with the seven principles:
    lawfulness, fairness and transparency; purpose limitation; data minimisation; accuracy;
    storage limitation; integrity and confidentiality; and accountability.'
- article: Art 9
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers processing special category data
  deadline: null
  interpretive: null
  requirement_text: Obtain explicit consent or identify another specific exception listed
    in Article 9(2) before processing special categories of personal data (health, genetic,
    biometric, racial/ethnic origin, political opinions, religious/philosophical beliefs,
    trade union membership, sex life or sexual orientation data).
- article: Arts 15-22
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers processing personal data
  deadline: null
  interpretive: null
  requirement_text: Implement processes to respond to data-subject rights requests (access,
    rectification, erasure, restriction, portability, objection, automated decision-making)
    within one month of receipt, free of charge, with a two-month extension available for
    complex or numerous requests.
- article: Art 32
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers and processors
  deadline: null
  interpretive: null
  requirement_text: Implement appropriate technical and organisational security measures proportionate
    to the risk, including (where applicable) pseudonymisation and encryption, ongoing resilience
    of systems, timely restoration of data availability, and regular testing and evaluation
    of security effectiveness.
- article: Art 33
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers
  deadline: null
  interpretive: null
  requirement_text: Notify the competent supervisory authority of a personal data breach without
    undue delay and, where feasible, not later than 72 hours after becoming aware of it, unless
    the breach is unlikely to result in a risk to the rights and freedoms of natural persons.
- article: Art 34
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers
  deadline: null
  interpretive: null
  requirement_text: Communicate a personal data breach to affected data subjects without undue
    delay in plain language where the breach is likely to result in a high risk to their rights
    and freedoms, unless technical safeguards (e.g. encryption) render the data unintelligible.
- article: Art 35
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers
  deadline: null
  interpretive: null
  requirement_text: Carry out a Data Protection Impact Assessment prior to processing that
    is likely to result in a high risk to the rights and freedoms of natural persons, in particular
    when using new technologies, processing special categories at large scale, or systematically
    monitoring publicly accessible areas.
- article: Art 37
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Qualifying controllers and processors
  deadline: null
  interpretive: null
  requirement_text: 'Designate a Data Protection Officer where required: for all public authorities
    (except courts acting in their judicial capacity), for organisations whose core activities
    require large-scale regular and systematic monitoring of data subjects, and for those
    whose core activities involve large-scale processing of special categories or criminal
    conviction data.'
- article: Art 25
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers
  deadline: null
  interpretive: null
  requirement_text: 'Implement data protection by design and by default: integrate data protection
    principles (especially data minimisation) into processing systems from the outset, and
    ensure that by default only the personal data necessary for each specific purpose is processed.'
- article: Art 28
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers engaging processors
  deadline: null
  interpretive: null
  requirement_text: Execute a written data processing agreement with every processor before
    that processor handles personal data on behalf of the controller. The agreement must specify
    the scope, nature, purpose and duration of processing, the controller's instructions,
    security obligations, sub-processor rules and data return/deletion obligations.
- article: Art 30
  law_celex: 32016R0679
  criticality: important
  addressee: economic_operator
  applicable_entity: Controllers and processors (subject to SME exemption)
  deadline: null
  interpretive: null
  requirement_text: Maintain written records of processing activities, including the name
    and contact details of the controller and DPO, purposes, categories of data subjects and
    personal data, recipients, international transfers, envisaged erasure time limits, and
    a general description of security measures. Organisations with fewer than 250 employees
    are exempt unless processing is not occasional, likely to result in a risk, or involves
    special categories.
- article: Arts 44-49
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers and processors transferring data outside the EEA
  deadline: null
  interpretive: null
  requirement_text: 'Ensure a valid transfer mechanism is in place before transferring personal
    data to a third country or international organisation: an adequacy decision, standard
    contractual clauses, binding corporate rules, or another safeguard listed in Article 46.
    Document the mechanism in the records of processing activities.'
- article: Arts 7-8
  law_celex: 32016R0679
  criticality: critical
  addressee: economic_operator
  applicable_entity: Controllers relying on consent as a legal basis
  deadline: null
  interpretive: null
  requirement_text: Where consent is the chosen legal basis, ensure it is freely given, specific,
    informed and unambiguous; obtain it via a clear affirmative act; make withdrawal as easy
    as giving it; do not condition a service on consent to unnecessary processing; and for
    information society services directed at children under 16 (or a lower age set by the
    Member State, no lower than 13), obtain and verify parental consent.
- article: Art 27
  law_celex: 32016R0679
  criticality: important
  addressee: economic_operator
  applicable_entity: Non-EU controllers and processors subject to Article 3(2)
  deadline: null
  interpretive: null
  requirement_text: Designate in writing an EU-based representative where a controller or
    processor not established in the Union is subject to Article 3(2) and the processing is
    not occasional, involves large-scale special-category data, or is likely to result in
    a risk to the rights and freedoms of natural persons.
