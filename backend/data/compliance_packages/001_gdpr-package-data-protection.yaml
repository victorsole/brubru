id: 1
name: GDPR Package (Data Protection)
policy_area: Digital Policy and Digital Economy
description: General Data Protection Regulation and implementing acts covering personal data
  protection in the EU
applicability: Companies processing personal data of EU residents, public authorities, data
  processors
