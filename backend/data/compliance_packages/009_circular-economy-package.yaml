- article: Article 1(1)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: 'The amounts of food waste shall be measured separately for the following
    stages of the food supply chain: (a) primary production; (b) processing and manufacturing;
    (c) retail and other distribution of food; (d) restaurants and food services; (e) households.'
- article: Article 1(2)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Food waste shall be attributed to each of the stages of the food supply
    chain referred to in paragraph 1 in accordance with Annex I.
- article: Article 1(4)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: 'The measurement of food waste shall not cover the following items: (a)
    agricultural material referred to in Article 2(1)(f) of Directive 2008/98/EC; (b) animal
    by-products referred to in Article 2(2)(b) of Directive 2008/98/EC; (c) food waste residues
    collected within packaging waste classified under waste code 15 01; (d) food waste residues
    collected within waste classified under waste code 20 03 03; (e) non-food materials that
    are mixed together with food waste when collected, to the extent possible.'
- article: Article 1(5)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: 'The measurement of food waste shall not cover the following items: (a)
    food waste drained as or with wastewater; (b) substances that are destined for use as
    feed materials referred to in Article 2(2)(e) of Directive 2008/98/EC.'
- article: Article 2(1)
  law_celex: 32019L1597
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall measure each year the amount of food waste generated
    in a full calendar year.
- article: Article 2(2)
  law_celex: 32019L1597
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall measure the amount of food waste for a given stage
    of the food supply chain using the methodology set out in Annex III at least once every
    four years.
- article: Article 2(3)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: When the methodology set out in Annex III is not used, Member States shall
    measure the amount of food waste for a given stage of the food supply chain using the
    methodology set out in Annex IV.
- article: Article 2(4)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: For the first reporting period, as referred to in the third subparagraph
    of Article 37(3) of Directive 2008/98/EC, Member States shall measure the amount of food
    waste for all stages of the food supply chain using the methodology set out in Annex III.
- article: Article 2(5)
  law_celex: 32019L1597
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: The amounts of food waste shall be measured in metric tons of fresh mass.
- article: Article 4(1)
  law_celex: 32019L1597
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall take appropriate measures to ensure the reliability
    and accuracy of the measurements of food waste.
- article: Article 4(1)(a)
  law_celex: 32019L1597
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States shall ensure that the measurements conducted in accordance
    with the methodology set out in Annex III are based on a representative sample of the
    population to which its results are applied, and adequately reflect the variations in
    the data on food waste amounts to be measured.
- article: Annex II footnote (*)
  law_celex: 32015L1127
  criticality: important
  addressee: economic_operator
  applicable_entity: operators of incineration facilities
  deadline: null
  interpretive: null
  requirement_text: The value of HDD (Heating Degree Days) should be taken as the average
    of annual HDD values for the incineration facility location, calculated for a period of
    20 consecutive years before the year for which CCF is calculated
- article: Annex II footnote (*)
  law_celex: 32015L1127
  criticality: important
  addressee: economic_operator
  applicable_entity: operators of incineration facilities
  deadline: null
  interpretive: null
  requirement_text: 'For the calculation of the value of HDD the following method established
    by Eurostat should be applied: HDD is equal to (18 °C – Tm) × d if Tm is lower than or
    equal to 15 °C (heating threshold) and is nil if Tm is greater than 15 °C; where Tm is
    the mean (Tmin + Tmax)/2 outdoor temperature over a period of d days'
- article: Annex II footnote (*)
  law_celex: 32015L1127
  criticality: important
  addressee: economic_operator
  applicable_entity: operators of incineration facilities
  deadline: null
  interpretive: null
  requirement_text: Calculations are to be executed on a daily basis (d = 1), added up to
    a year
