requirements:
- article: Article 41(4)
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: products with EU Ecolabel
  deadline: null
  interpretive: null
  requirement_text: Products covered by a delegated act adopted pursuant to Article 4 which
    have been awarded the EU Ecolabel pursuant to Regulation (EC) No 66/2010 shall be presumed
    to comply with the ecodesign requirements set out in that delegated act to the extent
    that those requirements are covered by the EU Ecolabel criteria established pursuant to
    Article 8 of that Regulation
- article: Article 65(3)
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: contracting authorities and contracting entities
  deadline: null
  interpretive: null
  requirement_text: Targets shall require, on an annual or multiannual basis, a minimum percentage
    of 50% of procurement conducted at the level of contracting authorities or contracting
    entities, or at an aggregated national level, of the most environmentally sustainable
    products
- article: Article 69(5)
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: The information to be provided to the Commission and the other Member
    States in accordance with paragraph 4 of this Article shall be communicated through the
    information and communication system referred to in Article 34 of Regulation (EU) 2019/1020
    and shall include all available details, in particular the data necessary for the identification
    of the non-compliant product, the origin of the product, the nature of the non-compliance
    alleged and the risk involved
