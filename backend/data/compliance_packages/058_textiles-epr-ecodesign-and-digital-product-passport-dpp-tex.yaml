id: 58
name: 'Textiles: EPR, Ecodesign and Digital Product Passport (DPP-TEX)'
policy_area: Environment
description: 'The full obligation set for a textile, apparel or footwear producer placing
  products on the Union market: extended producer responsibility under Directive (EU) 2025/1892
  amending the Waste Framework Directive, plus the product-side Ecodesign for Sustainable
  Products Regulation (EU) 2024/1781 chain, being the prohibition on destroying unsold apparel
  and footwear from 19 July 2026, the annual disclosure of discarded unsold products from
  2 March 2027, and the horizontal digital product passport registry rules that will govern
  the textile DPP once the product-specific delegated act, indicatively timetabled for 2027
  in the ESPR Working Plan 2025-2030, is adopted.'
applicability: Producers, importers, distributors and distance sellers of apparel, clothing
  accessories, home textiles and footwear (CN chapters 61 and 62, headings 4203, 4303, 6301
  to 6306, 6309, 6401 to 6405, 6504, 6505); producer responsibility organisations; online
  platforms and fulfilment service providers; sorting and preparing-for-reuse operators; social
  economy entities receiving donated unsold stock.
is_startup_focused: false
is_published: true
