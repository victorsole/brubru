requirements:
- article: Article 22a(1), Annex IVc
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers of apparel, home textiles and footwear
  deadline: null
  interpretive: null
  requirement_text: 'Producers have extended producer responsibility for the textile, textile-related
    and footwear products listed in Annex IVc that they make available on the market for the
    first time. Scope is set by Combined Nomenclature code, not by description: Part I covers
    CN chapters 61 and 62 in full plus 6301 (excluding 63011000), 6302, 6303, 6304 (excluding
    heading 9404), 6309, 6504 and 6505; Part II covers 4203 and footwear codes 6401 to 6405.
    The headings cover products for household use or other uses where similar in nature and
    composition to household use, which includes professional and workwear uses, except products
    for professional or military use that pose safety, health or hygiene risks or raise security
    concerns.'
- article: Article 22a(14)
  law_celex: 32025L1892
  criticality: critical
  addressee: member_state
  applicable_entity: Member States, PROs
  deadline: '2028-04-17'
  interpretive: null
  requirement_text: Member States shall ensure that extended producer responsibility schemes
    for textile, textile-related and footwear products listed in Annex IVc are established
    by 17 April 2028, in accordance with Articles 8, 8a and 22a to 22d. This is distinct from
    the 17 June 2027 transposition deadline in Article 2(1).
- article: Article 3(4b)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Economic operators placing Annex IVc products on an EU market
  deadline: null
  interpretive: null
  requirement_text: A producer is any manufacturer, importer, distributor or other natural
    or legal person that, whatever the selling technique including distance contracts, either
    manufactures Annex IVc products under its own name or trademark in a Member State, resells
    such products there under its own name or trademark where the maker's mark does not appear,
    supplies them there for the first time on a professional basis from another Member State
    or a third country, or sells them by distance contract directly to end users in a Member
    State while established elsewhere. Persons supplying used products assessed as fit for
    re-use, persons supplying products derived from used or waste products or their parts,
    and self-employed tailors producing customised products are excluded.
- article: Article 22a(3)-(4)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Distance sellers established outside the Member State of sale
  deadline: null
  interpretive: null
  requirement_text: A producer selling by distance contract while established in another Member
    State must appoint, by written mandate, an authorised representative established in the
    Member State of sale to discharge its extended producer responsibility obligations there.
    Member States may extend the same requirement to producers established in third countries.
    A producer responsibility organisation may be appointed by written mandate to meet those
    obligations on the producer's behalf.
- article: Article 22a(8)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers of Annex IVc products, PROs
  deadline: null
  interpretive: null
  requirement_text: 'Producers shall cover the costs of: collection of used products for re-use
    and separate collection of waste products for preparing for re-use and recycling; transport
    for subsequent sorting and treatment; sorting, preparing for re-use, recycling, other
    recovery and disposal; collection, transport and treatment of waste arising from operations
    carried out by social economy entities and other actors in the collection system; compositional
    surveys of collected mixed municipal waste; information provision and campaigns on sustainable
    consumption, waste prevention, re-use, repair and recycling; data gathering and reporting
    to competent authorities; and support for research and development on product design under
    Article 5 of Regulation (EU) 2024/1781 and on waste prevention and management with a view
    to scaling up fibre-to-fibre recycling. Costs shall not exceed what is necessary to provide
    those services in a cost-efficient way.'
- article: Article 22a(10)-(11)
  law_celex: 32025L1892
  criticality: important
  addressee: economic_operator
  applicable_entity: Producers of Annex IVc products
  deadline: '2025-10-16'
  interpretive: null
  requirement_text: Cost coverage applies to products made available on the market for the
    first time from 16 October 2025 where an extended producer responsibility scheme was already
    established in that Member State on that date, and otherwise from the date the Member
    State brings its transposing measures into force or, at the latest, from 17 April 2028.
- article: Article 22b
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers, authorised representatives, Member States
  deadline: null
  interpretive: null
  requirement_text: Producers shall register in the national register of producers of textile,
    textile-related and footwear products in each Member State where they make Annex IVc products
    available on the market for the first time. Member States shall only allow such products
    to be made available where the producer, or its authorised representative, is registered.
    Registers shall be publicly accessible, free of charge, machine readable, sortable and
    searchable, and the Commission shall maintain a website linking all national registers.
- article: Article 22c(1)-(4)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers of Annex IVc products, PROs
  deadline: null
  interpretive: null
  requirement_text: Producers shall entrust a producer responsibility organisation to fulfil
    their extended producer responsibility obligations on their behalf. Producer responsibility
    organisations must obtain authorisation from a competent authority and demonstrate the
    necessary expertise in waste management and sustainability.
- article: Article 22c(5)-(6)
  law_celex: 32025L1892
  criticality: important
  addressee: economic_operator
  applicable_entity: PROs, producers of Annex IVc products
  deadline: null
  interpretive: null
  requirement_text: Financial contributions paid by producers shall be based on weight and,
    where appropriate, quantity, and shall be modulated on the basis of the ecodesign requirements
    adopted under Regulation (EU) 2024/1781 that are most relevant to waste prevention and
    to treatment in line with the waste hierarchy. Contributions shall take account of revenues
    from re-use, preparing for re-use and secondary raw materials, and shall ensure equal
    treatment of producers regardless of origin or size without disproportionate burdens on
    SMEs. Member States may additionally require modulation to address ultra-fast and fast
    fashion practices, based on product life span, useful life beyond the first user, and
    contribution to closing the loop.
- article: Article 22c(8)-(9)
  law_celex: 32025L1892
  criticality: critical
  addressee: pro
  applicable_entity: PROs, waste management operators, local authorities
  deadline: null
  interpretive: null
  requirement_text: Producer responsibility organisations shall establish a separate collection
    system for used and waste Annex IVc products regardless of nature, material composition,
    condition, name, brand, trademark or origin. Collection shall be free of charge, with
    suitable containers provided free of charge, at a frequency adapted to the area and volume.
    The system shall cover the whole territory of the Member State taking account of population
    size and density, accessibility and vicinity to end users, and shall not be limited to
    areas where collection is profitable. It shall maintain a sustained and technically feasible
    increase in separate collection with a corresponding decrease in mixed municipal waste.
- article: Article 22c(10)-(13)
  law_celex: 32025L1892
  criticality: important
  addressee: pro
  applicable_entity: PROs, social economy entities, re-use operators
  deadline: null
  interpretive: null
  requirement_text: Producer responsibility organisations shall not refuse the participation
    of local public authorities, social economy entities or other re-use operators in the
    separate collection system. Social economy entities may maintain and operate their own
    separate collection points, shall receive equal or preferential treatment in the location
    of collection points, and shall not be required to hand over collected products to the
    producer responsibility organisation. They shall report at least annually to the competent
    authority the quantity by weight collected, split between fit for re-use, destined for
    preparing for re-use and recycling, and destined for other recovery or disposal, indicating
    exports where possible. Member States may exempt them totally or partially where reporting
    would be a disproportionate administrative burden.
- article: Article 22a(13)
  law_celex: 32025L1892
  criticality: critical
  addressee: online_platform
  applicable_entity: Online platforms under the DSA, producers selling online
  deadline: null
  interpretive: null
  requirement_text: Providers of online platforms allowing consumers to conclude distance
    contracts with producers offering Annex IVc products to consumers in the Union shall,
    before allowing a producer to use their services, obtain the producer's registration details
    and registration number in the register of the Member State where the consumer is located,
    and a self-certification committing the producer to offering only products complying with
    the extended producer responsibility requirements in that Member State.
- article: Article 22a(15)-(17)
  law_celex: 32025L1892
  criticality: important
  addressee: economic_operator
  applicable_entity: Fulfilment service providers, producers selling into the EU
  deadline: null
  interpretive: null
  requirement_text: Producers shall provide fulfilment service providers with their registration
    and self-certification information at the moment the service contract is concluded. Fulfilment
    service providers shall make best efforts to assess whether that information is reliable
    and complete, request correction where it is not, and swiftly suspend service to the producer
    where the producer fails to correct, complete or update it, stating the reasons. Producers
    are liable for the accuracy of the information. A suspended producer has the right to
    challenge the suspension before a court.
- article: Article 22d(2)-(3)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Collection points, re-use operators, social economy entities
  deadline: null
  interpretive: null
  requirement_text: 'Separately collected used and waste textile, textile-related and footwear
    products are considered to be waste upon collection. By way of derogation, used products
    that are directly handed over by end users and directly professionally assessed as fit
    for re-use at the collection point by a re-use operator or social economy entity are not
    considered to be waste. The assessment must be professional: the decision may not be left
    to the end user.'
- article: Article 22d(5)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Sorting operators, PROs, waste treatment operators
  deadline: null
  interpretive: null
  requirement_text: Sorting operations shall generate products for re-use and preparing for
    re-use, prioritising local sorting and local re-use where appropriate; sort at a granularity
    allowing item-to-item separation of fractions fit for direct re-use from those needing
    further preparing for re-use, targeting a specific re-use market with up-to-date criteria;
    sort items assessed as unsuitable for re-use for remanufacturing and recycling, including
    fibre-to-fibre recycling where technology allows, prioritising remanufacturing over recycling;
    and produce outputs meeting the end-of-waste criteria referred to in Article 6.
- article: Article 22d(8)-(9)
  law_celex: 32025L1892
  criticality: critical
  addressee: economic_operator
  applicable_entity: Exporters and shippers of used textiles, sorting operators
  deadline: null
  interpretive: null
  requirement_text: Shipments arranged on a professional basis of used products assessed as
    fit for re-use shall be accompanied by a copy of the invoice and contract stating the
    products are destined for and fit for direct re-use; evidence of a prior sorting operation
    or direct professional assessment, as a copy of the records on every bale plus a protocol;
    and a declaration that no material in the consignment is waste. Records shall be fixed
    securely but not permanently to the packaging and shall describe the items at the most
    detailed sorting granularity achieved and name the company responsible for final sorting.
    Shipments shall be protected against damage in transport.
- article: Article 22d(6)
  law_celex: 32025L1892
  criticality: important
  addressee: economic_operator
  applicable_entity: Member States, competent authorities, PROs
  deadline: '2026-01-01'
  interpretive: null
  requirement_text: By 1 January 2026, and every five years thereafter, Member States shall
    carry out a compositional survey of collected mixed municipal waste to determine the share
    of waste textile, textile-related and footwear products, where appropriate by reference
    to the Annex IVc CN codes. Competent authorities may require producer responsibility organisations
    to take corrective action, including expanding the collection network and running information
    campaigns. Results shall be made available to the public.
- article: Article 22c(18), (20)
  law_celex: 32025L1892
  criticality: important
  addressee: pro
  applicable_entity: PROs, micro-enterprise producers
  deadline: null
  interpretive: null
  requirement_text: Producer responsibility organisations shall publish on their websites
    at least annually, subject to commercial confidentiality, the quantity by weight of products
    made available on the market for the first time; the quantity separately collected, specifying
    unsold products separately; the rates of re-use, preparing for re-use and recycling, specifying
    fibre-to-fibre recycling separately; the rates of other recovery and disposal; and the
    rates of export of products assessed as fit for re-use and of waste products. The same
    information shall be provided annually to competent authorities. Enterprises employing
    fewer than 10 persons with annual turnover and balance sheet not exceeding EUR 2 million
    report only the quantity made available.
- article: Article 41 as amended
  law_celex: 32025L1892
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Micro-enterprise producers of Annex IVc products
  deadline: '2029-04-17'
  interpretive: null
  requirement_text: From 17 April 2029, Articles 22a, 22b, 22c and 22d apply to enterprises
    which employ fewer than 10 persons and whose annual turnover and annual balance sheet
    do not exceed EUR 2 million. Until that date micro-enterprises are outside the textile
    extended producer responsibility obligations, subject to any pre-existing national scheme
    maintained under Article 193 TFEU.
- article: Article 2(1)
  law_celex: 32025L1892
  criticality: critical
  addressee: member_state
  applicable_entity: Member States
  deadline: '2027-06-17'
  interpretive: null
  requirement_text: Member States shall bring into force the laws, regulations and administrative
    provisions necessary to comply with this Directive by 17 June 2027 at the latest and shall
    immediately inform the Commission. Transposing measures shall contain a reference to this
    Directive or be accompanied by such a reference on official publication.
- article: Article 25(1), Annex VII
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers, importers and distributors of apparel, clothing accessories
    and footwear
  deadline: '2026-07-19'
  interpretive: null
  requirement_text: 'From 19 July 2026 the destruction of unsold consumer products listed
    in Annex VII is prohibited. Annex VII covers, by Combined Nomenclature code as in force
    on 28 June 2024: apparel and clothing accessories (4203 leather articles, chapter 61 knitted
    or crocheted, chapter 62 not knitted or crocheted, 6504 and 6505 headgear) and footwear
    (6401 to 6405). The prohibition does not apply to micro and small enterprises, and applies
    to medium-sized enterprises only from 19 July 2030.'
- article: Article 25(2)
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: All economic operators in the textile and footwear supply chain
  deadline: null
  interpretive: null
  requirement_text: Economic operators that are not themselves subject to the destruction
    prohibition shall not destroy unsold consumer products supplied to them with the purpose
    of circumventing that prohibition. This closes the route of passing unsold stock to an
    exempt micro or small entity for disposal.
- article: Article 24(1)
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: Large enterprises discarding unsold consumer products
  deadline: '2030-07-19'
  interpretive: null
  requirement_text: 'Large enterprises that discard unsold consumer products directly, or
    have them discarded on their behalf, shall disclose annually: the number and weight of
    unsold consumer products discarded during the previous financial year; the reasons for
    discarding them; where applicable the derogation relied on; the proportion of discarded
    products delivered to each waste treatment operation; and the measures taken and planned
    to prevent destruction. Micro and small enterprises are excluded; medium-sized enterprises
    are covered from 19 July 2030. The information may instead be included in sustainability
    reporting under Article 19a or 29a of Directive 2013/34/EU.'
- article: Article 13
  law_celex: 32024R1781
  criticality: critical
  addressee: economic_operator
  applicable_entity: Economic operators placing products with a DPP on the Union market
  deadline: null
  interpretive: null
  requirement_text: A digital product passport required by a delegated act adopted under Article
    4 must be registered in the digital product passport registry established and maintained
    by the Commission. The implementation arrangements for that registry are laid down in
    Commission Implementing Regulation (EU) 2026/1778.
- article: Article 18, Working Plan 2025-2030
  law_celex: 32024R1781
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Textile and apparel manufacturers planning DPP readiness
  deadline: null
  interpretive: null
  requirement_text: HORIZON, NOT YET BINDING. Article 18 lists textiles, in particular garments
    and footwear, among the priorities for the first ESPR working plan. The Ecodesign for
    Sustainable Products and Energy Labelling Working Plan 2025-2030 (COM(2025) 187) ranks
    Textiles/Apparel first with an indicative delegated-act adoption timeline of 2027, and
    states that information will generally be provided in the digital product passport, working
    in synergy with the Textile Labelling Regulation currently under review. Footwear is treated
    as a separate product category for which only a study is commissioned during the working-plan
    period. No product-specific ecodesign or DPP delegated act for textiles has been adopted
    at the time of seeding.
- article: Article 1
  law_celex: 32026R0002
  criticality: critical
  addressee: economic_operator
  applicable_entity: Large enterprises discarding unsold consumer products
  deadline: '2027-03-02'
  interpretive: null
  requirement_text: The disclosure obligation applies to products discarded in each financial
    year as from the first full financial year after 2 March 2027, the date of application
    of this Regulation. Economic operators shall disclose that information within 12 months
    after the end of that financial year.
- article: Article 2(1), Annex I
  law_celex: 32026R0002
  criticality: critical
  addressee: economic_operator
  applicable_entity: Large enterprises discarding unsold consumer products
  deadline: null
  interpretive: null
  requirement_text: 'The visual presentation and content of the disclosure shall comply with
    the format set out in Annex I. That format requires, per CN product category: legal entity
    name and identifier (EUID or other), standalone or consolidated disclosure, financial
    year start and end dates, number of units discarded, total weight in kilograms, whether
    packaging is included in that weight, the reason for discarding, and a percentage split
    across preparing for reuse, recycling, other recovery, disposal and total destruction,
    plus measures taken and planned to prevent destruction.'
- article: Article 2(2)
  law_celex: 32026R0002
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Enterprises within the scope of CSRD sustainability reporting
  deadline: null
  interpretive: null
  requirement_text: Operators bound to publish sustainability reporting in their management
    report under Article 19a or 29a of Directive 2013/34/EU, or publishing such reports voluntarily,
    that include the Annex I format in that reporting may publish a link to the report on
    their website instead of disclosing the information on the website directly, provided
    the link clearly states where the report contains that information.
- article: Article 3, Annex II
  law_celex: 32026R0002
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers, importers and distributors of apparel, clothing accessories
    and footwear
  deadline: null
  interpretive: null
  requirement_text: 'Disclosure shall be delimited on the first two digits of the relevant
    Combined Nomenclature code. The products listed in Annex II must instead be delimited
    at four-digit CN level. The Annex II list includes textile and apparel headings: 4203
    (articles of apparel and clothing accessories of leather), 4303 (articles of apparel,
    clothing accessories and other articles of furskin), 4818, 6301 (blankets and travelling
    rugs), 6302 (bed, table, toilet and kitchen linen), 6303 (curtains and interior blinds),
    6304 (other furnishing articles) and 6306 (tarpaulins, awnings, tents and sails).'
- article: Article 4
  law_celex: 32026R0002
  criticality: important
  addressee: economic_operator
  applicable_entity: Large enterprises discarding unsold consumer products
  deadline: null
  interpretive: null
  requirement_text: Economic operators shall keep the information and documentation necessary
    to demonstrate, in accordance with Article 24(2) of Regulation (EU) 2024/1781, the delivery
    and reception of discarded unsold consumer products, including statements on reception
    and treatment received from waste treatment operators, for five years after the disclosure
    of information on those products.
- article: Article 2
  law_celex: 32026R0296
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers, importers and distributors of apparel, clothing accessories
    and footwear
  deadline: '2026-07-19'
  interpretive: null
  requirement_text: 'Unsold consumer products listed in Annex VII to Regulation (EU) 2024/1781
    may be destroyed only where the documentation in Article 3 can be presented and one of
    ten circumstances applies: (a) the product is dangerous under Regulation (EU) 2023/988;
    (b) it is unfit for purpose through non-compliance with Union or national law and destruction
    is required by law or is the appropriate and proportionate corrective action; (c) it infringes
    intellectual property rights as established by a final judicial or ADR decision, a right-holder
    or authority notification, or a substantiated internal investigation; (d) a licence or
    contractual IP requirement has expired making further transfer an infringement; (e) removing
    protected or inappropriate labels, logos or recognisable design is technically unfeasible;
    (f) the product is unacceptable for consumer use through damage, deterioration or contamination
    and repair or refurbishment is not technically feasible or cost-effective; (g) design
    or manufacturing defects make repair technically unfeasible; (h) the donation route in
    Article 2(h) has been exhausted; (i) a social economy entity received it as a donation
    but found no recipient; (j) it was placed on the market after preparing for reuse by a
    waste treatment operator but found no recipient. This Regulation applies from 19 July
    2026.'
- article: Article 2(h)
  law_celex: 32026R0296
  criticality: critical
  addressee: economic_operator
  applicable_entity: Producers, importers and distributors of apparel, clothing accessories
    and footwear
  deadline: null
  interpretive: null
  requirement_text: Where none of the circumstances in points (a) to (g) applies, destruction
    is lawful only if the product was first offered for donation either directly to at least
    three suitable social economy entities located within the Union, or on an easily accessible
    page of the economic operator's website, for a period of at least eight weeks, and was
    not accepted for donation. 'Social economy entity' takes the meaning in Article 3(4i)
    of Directive 2008/98/EC. Build the eight-week clock and the three-entity offer into the
    unsold-stock process rather than treating it as an after-the-fact justification.
- article: Article 3
  law_celex: 32026R0296
  criticality: important
  addressee: economic_operator
  applicable_entity: Producers, importers and distributors of apparel, clothing accessories
    and footwear
  deadline: null
  interpretive: null
  requirement_text: For five years after a product subject to a derogation has been destroyed,
    economic operators shall keep and, on request, put at the disposal of competent authorities
    in electronic form within 30 days of receipt of the request, the documentation substantiating
    the derogation relied on, unless the information is already available to the competent
    national authority under another legal act.
- article: Article 4
  law_celex: 32026R1778
  criticality: critical
  addressee: economic_operator
  applicable_entity: Economic operators registering a DPP in the Commission registry
  deadline: null
  interpretive: null
  requirement_text: Before it can register a digital product passport, an economic operator
    must be qualified as a 'verified economic operator'. A legal person established in the
    Union does so by submitting evidence of identity and establishment by means of a qualified
    electronic seal supported by a qualified certificate issued by a qualified trust service
    provider under Regulation (EU) No 910/2014, or by a qualified electronic attestation of
    attributes. A sole trader uses a qualified electronic signature or an eIDAS electronic
    identification means at assurance level 'high'. Procure the eIDAS qualified seal or signature
    as a lead-time item; it is a precondition, not a formality.
- article: Article 8(1)-(2)
  law_celex: 32026R1778
  criticality: critical
  addressee: economic_operator
  applicable_entity: Economic operators registering a DPP in the Commission registry
  deadline: null
  interpretive: null
  requirement_text: The digital product passport shall be registered by the verified economic
    operator placing the product on the market or putting it into service, at the granularity
    level (model, batch or item) specified in the applicable delegated act adopted under Article
    4 of Regulation (EU) 2024/1781. Where Union law allows a third party to act in the registry
    on the operator's behalf, that third party must itself be verified.
- article: Article 8(3)-(5)
  law_celex: 32026R1778
  criticality: important
  addressee: economic_operator
  applicable_entity: Economic operators registering a DPP in the Commission registry
  deadline: null
  interpretive: null
  requirement_text: 'Where the same product is subject to different Union rules requiring
    registration at different levels of granularity, the passport shall be registered at the
    most granular level required by any of them. A passport created at item level must link
    both the batch and the model identifier where batch and model designs exist; a passport
    created at batch level must link the model identifier where a model design exists. Design
    the identifier hierarchy up front: retrofitting item-level linkage across an existing
    catalogue is materially harder than building it in.'
- article: Article 9
  law_celex: 32026R1778
  criticality: important
  addressee: economic_operator
  applicable_entity: Economic operators registering a DPP in the Commission registry
  deadline: null
  interpretive: null
  requirement_text: An economic operator that has registered a digital product passport shall
    be able to generate proof of registration at any time. The proof is a secure electronic
    document downloadable from the registry containing at least the unique product identifier,
    where relevant the commodity code, the name and identity of the responsible verified economic
    operator, the date and time of registration of the latest passport version validated by
    a Commission electronic time stamp, and a hash of that version. It is guaranteed by a
    qualified electronic seal under Article 38 of Regulation (EU) No 910/2014 and serves as
    evidence, including against third parties, that the registration obligation has been fulfilled.
- article: Article 19
  law_celex: 32026R1778
  criticality: critical
  addressee: economic_operator
  applicable_entity: Economic operators registering a DPP in the Commission registry
  deadline: null
  interpretive: null
  requirement_text: The verified economic operator is responsible for the accuracy and completeness
    of the information submitted at registration; shall keep the information stored in the
    registry accurate, complete and up to date at all times; shall implement appropriate technical
    and organisational security measures for the IT systems and credentials used to access
    the registry so as to prevent unauthorised access or modification of registration data;
    remains fully responsible for compliance where it authorises a verified third party to
    act on its behalf; and is the controller of the data it submits.
