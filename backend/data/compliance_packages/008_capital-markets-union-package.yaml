requirements:
- article: Article 2(1)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Each competent authority shall designate a single contact point for sending
    the information referred to in Article 3 and for communications on any issue relating
    to submission of that information.
- article: Article 2(2)
  law_celex: 32017R1158
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall notify the European Securities and Markets
    Authority (ESMA) of the contact points designated in accordance with paragraph 1.
- article: Article 2(3)
  law_celex: 32017R1158
  criticality: critical
  addressee: eu_agency
  applicable_entity: ESMA
  deadline: null
  interpretive: null
  requirement_text: ESMA shall designate a contact point for receiving the information set
    out in Articles 3 and 4 and for communications on any issue relating to the reception
    of that information.
- article: Article 2(4)
  law_celex: 32017R1158
  criticality: critical
  addressee: eu_agency
  applicable_entity: ESMA
  deadline: null
  interpretive: null
  requirement_text: ESMA shall publish the contact point referred to in paragraph 2 on its
    website.
- article: Article 3(1)
  law_celex: 32017R1158
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall provide ESMA with the information referred
    to in paragraphs 1 and 2 of Article 33 of Regulation (EU) No 596/2014, by filling in,
    as appropriate, the form set out in Annex I to this Regulation.
- article: Article 3(2)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: The information referred to in paragraph 1 shall be provided to ESMA no
    later than 31 of March of each year and shall relate to all investigations undertaken
    and all sanctions and measures imposed during the previous calendar year.
- article: Article 3(3)
  law_celex: 32017R1158
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall provide ESMA with the information referred
    to in paragraph 1 by secure electronic means of transmission.
- article: Article 3(4)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: ESMA
  deadline: null
  interpretive: null
  requirement_text: For the purposes of paragraph 1, ESMA shall specify and identify the secure
    electronic means to be used. Those means shall ensure that the completeness, integrity
    and confidentiality of the information is maintained during its transmission.
- article: Article 4(1)
  law_celex: 32017R1158
  criticality: critical
  addressee: national_authority
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Competent authorities shall report to ESMA the sanctions and measures
    referred to in Article 33(3) of Regulation (EU) No 596/2014 using the interfaces provided
    by the information technology system, and the related database, set up by ESMA to manage
    the receipt, storage and publication of information on those sanctions and measures.
- article: Article 4(2)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: The sanctions and measures referred to in paragraph 1 shall be submitted
    to ESMA in a report file in the format set out in Annex II.
- article: Article 5(1)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Where a competent authority wishes to invalidate an existing report file
    it has previously submitted to ESMA in accordance with Article 4, it shall cancel the
    existing report file and send a new report file.
- article: Article 5(2)
  law_celex: 32017R1158
  criticality: critical
  addressee: economic_operator
  applicable_entity: competent authorities
  deadline: null
  interpretive: null
  requirement_text: Where a competent authority wishes to update an existing report file it
    has previously submitted to ESMA in accordance with Article 4, it shall resubmit the report
    file with the updated information.
- article: Article 5(1)(a)
  law_celex: 32019D1006
  criticality: critical
  addressee: economic_operator
  applicable_entity: CSDs with access to T2S services
  deadline: null
  interpretive: null
  requirement_text: A CSD with access to T2S services shall comply, after it has migrated
    to T2S, with the five CSD access criteria on an ongoing basis and shall ensure, in particular,
    through a reliable self-assessment conducted each year and supported by relevant documentation
    that it continues to comply with CSD access criteria 1, 3, 4 and 5
- article: Article 5(1)(b)
  law_celex: 32019D1006
  criticality: critical
  addressee: economic_operator
  applicable_entity: CSDs with access to T2S services
  deadline: null
  interpretive: null
  requirement_text: A CSD with access to T2S services shall promptly provide the MIB with
    the most recent outcome of the assessment conducted by the relevant competent authority
    against Regulation (EU) No 909/2014, the Principles for Financial Market Infrastructures
    of the Committee on Payment and Market Infrastructures and the International Organisation
    of Securities Commissions (PFMI) or a legal framework implementing the PFMI. If the above
    outcome of the assessment is not available, the CSD shall submit a self-attestation based
    on the relevant documentation
- article: Article 5(1)(c)
  law_celex: 32019D1006
  criticality: critical
  addressee: economic_operator
  applicable_entity: CSDs with access to T2S services
  deadline: null
  interpretive: null
  requirement_text: A CSD with access to T2S services shall request a new assessment by the
    relevant competent authorities of its compliance with Regulation (EU) No 909/2014, the
    PFMI or a legal framework implementing the PFMI in the event of material changes to the
    CSD's system
- article: Article 5(1)(d)
  law_celex: 32019D1006
  criticality: critical
  addressee: economic_operator
  applicable_entity: CSDs with access to T2S services
  deadline: null
  interpretive: null
  requirement_text: A CSD with access to T2S services shall notify the MIB without undue delay
    where a relevant competent authority assessment or a self-assessment has established non-compliance
    with any of the five CSD access criteria
- article: Article 5(1)(e)
  law_celex: 32019D1006
  criticality: critical
  addressee: economic_operator
  applicable_entity: CSDs with access to T2S services
  deadline: null
  interpretive: null
  requirement_text: A CSD with access to T2S services shall, following a request from the
    MIB, provide an assessment report demonstrating that the CSD still complies with the five
    CSD access criteria
- article: Article 4(1)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies
  deadline: null
  interpretive: null
  requirement_text: Management companies must take into account sustainability risks when
    complying with organizational requirements
- article: Article 5(5)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies
  deadline: null
  interpretive: null
  requirement_text: Management companies must retain the necessary resources and expertise
    for the effective integration of sustainability risks
- article: Article 5a
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: investment companies
  deadline: null
  interpretive: null
  requirement_text: Investment companies must integrate sustainability risks in the management
    of UCITS, taking into account the nature, scale and complexity of their business
- article: Article 9(2)(g)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: senior management
  deadline: null
  interpretive: null
  requirement_text: Senior management must be responsible for the integration of sustainability
    risks in company activities
- article: Article 17(3)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies
  deadline: null
  interpretive: null
  requirement_text: Management companies must identify and include conflicts of interest that
    may arise as a result of the integration of sustainability risks in their processes, systems
    and internal controls
- article: Article 23(5)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies
  deadline: null
  interpretive: null
  requirement_text: Management companies must take into account sustainability risks when
    complying with risk management requirements
- article: Article 23(6)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies, investment companies
  deadline: null
  interpretive: null
  requirement_text: Management companies and investment companies must take into account principal
    adverse impacts on sustainability factors when complying with risk management requirements,
    where they consider such impacts
- article: Article 38(1)
  law_celex: 32021L1270
  criticality: critical
  addressee: economic_operator
  applicable_entity: management companies
  deadline: null
  interpretive: null
  requirement_text: Risk management policy must include procedures to assess exposure to sustainability
    risks for each UCITS managed
- article: Article 2(1)
  law_celex: 32021L1270
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: '2022-07-31'
  interpretive: null
  requirement_text: Member States must adopt and publish laws, regulations and administrative
    provisions necessary to comply with this Directive by 31 July 2022
- article: Article 2(1)
  law_celex: 32021L1270
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: '2022-08-01'
  interpretive: null
  requirement_text: Member States must apply transposition measures from 1 August 2022
- article: Article 2(1)
  law_celex: 32021L1270
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States must communicate to the Commission the text of transposition
    provisions
- article: Article 2(2)
  law_celex: 32021L1270
  criticality: critical
  addressee: member_state
  applicable_entity: member states
  deadline: null
  interpretive: null
  requirement_text: Member States must communicate to the Commission the text of main provisions
    of national law adopted in the field covered by this Directive
- article: Article 2a(2)
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: third country markets
  deadline: null
  interpretive: null
  requirement_text: A third country market is to be considered equivalent to a regulated market
    where that market complies with legally binding requirements that are equivalent to the
    requirements laid down in Title III of Directive 2014/65/EU and provided that that market
    is subject to effective supervision and enforcement in that third country on an ongoing
    basis
- article: Section 19(a)(1) Exchange Act
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: national securities exchanges
  deadline: null
  interpretive: null
  requirement_text: An exchange must be registered with the SEC as a NSE before it may begin
    operations
- article: Exchange Act
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: registered national securities exchanges
  deadline: null
  interpretive: null
  requirement_text: Registered NSEs are required to maintain rules, policies and procedures
    consistent with their statutory obligations, and to have the capacity to carry out their
    obligations on a continuous basis
- article: Exchange Act
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: national securities exchanges
  deadline: null
  interpretive: null
  requirement_text: NSEs must provide their members with impartial access to their markets
    and services
- article: Exchange Act
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: registered national securities exchanges
  deadline: null
  interpretive: null
  requirement_text: Registered NSEs are required to have clear and transparent rules regarding
    the admission of securities to trading so that those securities are capable of being traded
    in a fair, orderly, and efficient manner and are freely negotiable
- article: SEC rules
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: national securities exchanges
  deadline: null
  interpretive: null
  requirement_text: NSEs are prohibited from listing any security of an issuer that does not
    comply with the audit committee requirements set out in the SEC rules
- article: SEC Rule 9b-1
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: options markets
  deadline: null
  interpretive: null
  requirement_text: Options markets are required to prepare an options disclosure document
    with certain specified information about the characteristics and risks of exchange traded
    options
- article: SEC Rule 9b-1
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: broker-dealers
  deadline: null
  interpretive: null
  requirement_text: Broker-dealers are to provide customers with that options disclosure document,
    and that document is to be filed with the SEC prior to being furnished to customers
- article: SEC Rule 17Ad-22(c)
  law_celex: 32022L0552
  criticality: critical
  addressee: economic_operator
  applicable_entity: Options Clearing Corporation
  deadline: null
  interpretive: null
  requirement_text: The OCC is required to disclose annual audited financials publicly
- article: SEC Rule 17Ad-22(e)(23)
  law_celex: 32022L0552
