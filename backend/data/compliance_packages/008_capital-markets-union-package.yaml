    NCBs, security-by-security data and investor information on end-of-quarter or end-of-month
    positions and, in accordance with paragraph 5, financial transactions over the reference
    quarter or month, on the securities with an ISIN code they hold in custody on behalf of
    ICs
- article: Article 3(2b)
  law_celex: 32015R0730
  criticality: critical
  addressee: economic_operator
  applicable_entity: Insurance Corporations
  deadline: null
  interpretive: null
  requirement_text: Where NCBs derive data to be reported by ICs under this Regulation from
    data collected under Directive 2009/138/EC, ICs shall provide to the relevant NCB, on
    an annual basis, either aggregated or security-by-security data on end-of-year positions
    of securities with an ISIN code, further broken down by the total domestic holdings of
    the IC and the total holdings of its branches in each EEA country and outside the EEA
- article: Article 3(8)
  law_celex: 32015R0730
  criticality: critical
  addressee: economic_operator
  applicable_entity: National Central Banks
  deadline: null
  interpretive: null
  requirement_text: The relevant NCB shall request that heads of reporting groups report on
    a quarterly basis, the information required in Part 6 of Annex I under the flag 'issuer
    is part of the reporting group' (on a security-by-security basis), on the securities with
    an ISIN code which are held by their group in accordance with Article 3(3), and on the
    securities without an ISIN code which are held by their group in accordance with Article
    3(6)
- article: Article 3(10)
  law_celex: 32015R0730
  criticality: critical
  addressee: economic_operator
  applicable_entity: National Central Banks
  deadline: null
  interpretive: null
  requirement_text: Where a quantitative reporting template for supervisory reporting contains
    data needed to fulfil the statistical reporting requirements for ICs under this Regulation,
    NCBs shall have access to the entire template in order to ensure data quality
- article: Article 1(1)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: 'A trade repository shall verify all of the following in a received SFT
    report: (a) the identity of the report submitting entity, (b) that the XML template complies
    with ISO 20022 methodology, (c) that the report submitting entity is duly authorized,
    (d) that the same SFT report has not been submitted previously, (e-k) various other verification
    requirements'
- article: Article 1(2)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall verify whether information about collateral has
    been reported in Fields 73 to 96 for SFTs where Field 72 'Uncollateralised SL flag' is
    reported as 'false'
- article: Article 1(2)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: The trade repository shall notify the report submitting entity and the
    reporting counterparty as well as the entity responsible for reporting, if applicable,
    of the result of the verification
- article: Article 1(3)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall reject an SFT report that does not comply with
    one of the requirements set out in paragraph 1 and assign to it one of the rejection categories
- article: Article 1(4)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall provide the report submitting entity and the
    reporting counterparty as well as the entity responsible for reporting with detailed information
    on the results of the data verification in an XML format and a template developed in accordance
    with the ISO 20022 methodology
- article: Article 2(1)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall seek to reconcile a reported SFT by undertaking
    the steps set out in paragraph 2, provided that specified conditions are met
- article: Article 2(2)(a)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository having received an SFT report shall verify whether
    it has received a corresponding SFT report from or on behalf of the other counterparty
- article: Article 2(2)(b)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository that has not received a corresponding SFT report shall
    attempt to identify the trade repository that has received the corresponding SFT report
    by communicating to all registered trade repositories the values of specified fields
- article: Article 2(2)(c)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository that determines that another trade repository has received
    a corresponding SFT report shall exchange with that trade repository the details of the
    reported SFT in an XML format and a template developed in accordance with the ISO 20022
    methodology
- article: Article 2(2)(e)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall seek to match separately the fields pertaining
    to the loan data and the fields pertaining to the collateral data of a reported SFT in
    accordance with the tolerance limits and relevant dates of application
- article: Article 2(2)(f)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall subsequently assign values for the reconciliation
    categories for each reported SFT
- article: Article 2(2)(g)
  law_celex: 32019R0358
  criticality: critical
  addressee: economic_operator
  applicable_entity: trade repositories
  deadline: null
  interpretive: null
  requirement_text: A trade repository shall conclude the steps in points (a) to (f) at the
    earliest opportunity and shall take no such steps after 18:00 Universal Coordinated Time
    on a given working day
- article: Article 1
  law_celex: 32021D1822
  criticality: critical
  addressee: economic_operator
  applicable_entity: Ms Verena ROSS
  deadline: '2021-11-01'
  interpretive: null
  requirement_text: Ms Verena ROSS is hereby appointed as Chair of the European Securities
    and Markets Authority (ESMA) for a period of 5 years from 1 November 2021
- article: Article 2
  law_celex: 32021D1822
  criticality: critical
  addressee: economic_operator
  applicable_entity: Council Decision
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the date of its publication in
    the Official Journal of the European Union
- article: Article 1(2)
  law_celex: 32015D1613
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: The requirements set out in Article 77 of Guideline ECB/2014/60 shall
    not apply to ABS mezzanine tranches that are only eligible for purchase under the ABSPP
    if they meet specified guarantee and credit assessment requirements
- article: Article 1(2)(a)(i)
  law_celex: 32015D1613
  criticality: critical
  addressee: economic_operator
  applicable_entity: ABS mezzanine tranches under ABSPP
  deadline: null
  interpretive: null
  requirement_text: ABS mezzanine tranches must be secured by a guarantee meeting the requirements
    for guarantees of marketable assets as set out in Articles 114, 115, 117 and 118 of Part
    Four, Title IV of Guideline (EU) 2015/510
- article: Article 1(2)(a)(ii)
  law_celex: 32015D1613
  criticality: critical
  addressee: economic_operator
  applicable_entity: guarantors of ABS mezzanine tranches
  deadline: null
  interpretive: null
  requirement_text: Guarantor must have a credit assessment in accordance with Article 83(c)
    of Guideline ECB/2014/60 and provided by at least one accepted ECAI system, expressed
    in the form of a public credit rating, in compliance with, as a minimum, credit quality
    step 3 in the Eurosystem's harmonised rating scale
- article: Article 1(2)(b)
  law_celex: 32015D1613
  criticality: critical
  addressee: economic_operator
  applicable_entity: ABS mezzanine tranches under ABSPP
  deadline: null
  interpretive: null
  requirement_text: ABS mezzanine tranches must satisfy all other applicable eligibility criteria
    for purchase under the ABSPP
- article: Article 2
  law_celex: 32015D1613
  criticality: critical
  addressee: economic_operator
  applicable_entity: European Central Bank
  deadline: null
  interpretive: null
  requirement_text: This Decision shall enter into force on the twentieth day following its
    publication in the Official Journal of the European Union
- article: Article 2(1)(b)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: heads of banking groups, institutions or financial institutions
  deadline: null
  interpretive: null
  requirement_text: Group data reporting agents shall be heads of banking groups and institutions
    or financial institutions established in participating Member States and which are not
    part of a banking group where they have been identified by the Governing Council pursuant
    to paragraph 4 as part of the actual reporting population, and notified of their reporting
    obligations pursuant to paragraph 5.
- article: Article 2(3)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: actual reporting agents
  deadline: null
  interpretive: null
  requirement_text: The actual reporting agents shall be subject to full reporting requirements
    unless any derogation granted pursuant to Articles 4, 4a or 4b applies.
- article: Article 2(5)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: relevant NCB
  deadline: null
  interpretive: null
  requirement_text: The relevant NCB shall notify the group data reporting agents of the Governing
    Council's decision pursuant to paragraph 4, and of their obligations under this Regulation.
- article: Article 2(6)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: group data reporting agents
  deadline: null
  interpretive: null
  requirement_text: Any group data reporting agent that is notified in accordance with paragraph
    5 after the first reporting under this Regulation has started, shall begin reporting data
    no later than 6 months after the date of notification.
- article: Article 2(7)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: group data reporting agents
  deadline: null
  interpretive: null
  requirement_text: A group data reporting agent notified in accordance with paragraph 5 shall
    inform the relevant NCB of changes to its name or legal form, of mergers or restructurings,
    and of any other event or circumstances affecting its reporting obligations, within 14
    days of the occurrence of such event or circumstances.
- article: Article 2(8)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: group data reporting agents
  deadline: null
  interpretive: null
  requirement_text: A group data reporting agent notified in accordance with paragraph 5 shall
    remain subject to the obligations set out in this Regulation until it receives notification
    to the contrary by the relevant NCB.
- article: Article 3(2)(a)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: custodians
  deadline: null
  interpretive: null
  requirement_text: Custodians shall report securities they hold in custody for resident clients
    that do not report their own holdings pursuant to paragraph 1, in accordance with Part
    3 of Chapter 1 of Annex I.
- article: Article 3(2)(b)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: custodians
  deadline: null
  interpretive: null
  requirement_text: Custodians shall report securities they hold in custody for non-financial
    clients resident in other euro area Member States, in accordance with Part 4 of Chapter
    1 of Annex I.
- article: Article 3(2)(c)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: custodians
  deadline: null
  interpretive: null
  requirement_text: Custodians shall report securities issued by euro area entities they hold
    in custody for clients resident in non-euro area Member States and for clients resident
    outside the Union, in accordance with Part 5 of Chapter 1 of Annex I.
- article: Article 3(5)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: sectoral data reporting agents
  deadline: null
  interpretive: null
  requirement_text: Sectoral data reporting agents shall, in accordance with instructions
    by the relevant NCB, report either (a) security-by-security data on monthly or quarterly
    financial transactions and, where requested by the relevant NCB, other changes in volume;
    or (b) the statistical information needed to derive financial transactions on the basis
    of one of the approaches specified in Part 1 of Chapter 1 of Annex I.
- article: Article 3(6)
  law_celex: 32016R1384
  criticality: critical
  addressee: economic_operator
  applicable_entity: sectoral data reporting agents
  deadline: null
  interpretive: null
  requirement_text: Sectoral data reporting agents shall, if instructed by the relevant NCB,
    report on a quarterly or monthly basis data on end-of-quarter or end-of-month positions
    and, in accordance with paragraph 5, statistical information over the reference quarter
    or month, on holdings of securities without an ISIN code, in accordance with Part 7 of
    Chapter 1 of Annex I.
- article: Article 3(2)
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: managers of collective investment undertakings
  deadline: null
  interpretive: null
  requirement_text: Managers must not exceed the threshold of assets under management as referred
    to in point (b) of Article 3(2) of Directive 2011/61/EU
- article: Registration requirement
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: managers of collective investment undertakings
  deadline: null
  interpretive: null
  requirement_text: Managers must be registered with the competent authority in their home
    Member State in accordance with Directive 2011/61/EU
- article: Investment threshold
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: qualifying venture capital funds
  deadline: null
  interpretive: null
  requirement_text: Qualifying venture capital funds must invest at least 70% of their aggregate
    capital contributions and uncalled committed capital in qualifying portfolio undertakings
- article: Investment limitation
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: qualifying venture capital funds
  deadline: null
  interpretive: null
  requirement_text: Qualifying venture capital funds must not invest more than 30% of their
    aggregate capital contributions and uncalled committed capital in assets other than qualifying
    investments
- article: Geographic establishment requirement
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: qualifying venture capital funds
  deadline: null
  interpretive: null
  requirement_text: A qualifying venture capital fund must be established in the Union in
    order to be entitled to use the designation EuVECA
- article: Internal management restriction
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: internally managed qualifying venture capital funds
  deadline: null
  interpretive: null
  requirement_text: A qualifying venture capital fund which is internally managed must not
    be permitted to be the external manager of other collective investment undertakings or
    UCITS
- article: Continued compliance requirement
  law_celex: 32013R0345
  criticality: critical
  addressee: economic_operator
  applicable_entity: venture capital fund managers
  deadline: null
  interpretive: null
  requirement_text: Managers that exceed the threshold and become subject to Directive 2011/61/EU
    must continue to comply with certain requirements for the use of the designation EuVECA
    at all times in relation to qualifying venture capital funds
- article: Article 1(1)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCPs and competent authorities
  deadline: null
  interpretive: null
  requirement_text: The most relevant Union currencies shall be identified on the basis of
    the relative share of each currency in the CCP's average end-of-day open positions across
    all financial instruments cleared by the CCP, calculated over a period of one year.
- article: Article 1(2)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCPs and competent authorities
  deadline: null
  interpretive: null
  requirement_text: The most relevant Union currencies shall be the three currencies with
    the highest relative share calculated in accordance with paragraph 1, provided that each
    individual share exceeds 10%.
- article: Article 1(3)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCPs and competent authorities
  deadline: null
  interpretive: null
  requirement_text: The calculation of the relative share of the currencies shall be calculated
    on an annual basis.
- article: Article 2(1)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: After assessing that an application is complete as referred to in Article
    17(3) of Regulation (EU) No 648/2012, the CCP's competent authority shall circulate a
    proposal for the written agreement under Article 18(5) of Regulation (EU) No 648/2012
    to the members of the college determined in accordance with Article 18(2) of Regulation
    (EU) No 648/2012.
- article: Article 2(1)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: That written agreement shall include a process for annual review. It shall
    also include an amendment process whereby changes may be initiated at any time by the
    CCP's competent authority or by other members of the college, subject to approval by the
    college.
- article: Article 2(2)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: Where the members of the college referred to in paragraph 1 do not express
    any comments within 10 calendar days, the CCP's competent authority shall proceed with
    the adoption of the written agreement by the college and with the establishment of the
    college in accordance with Article 18(1) of Regulation (EU) No 648/2012.
- article: Article 2(3)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: members of the college
  deadline: null
  interpretive: null
  requirement_text: Where the members of the college express comments regarding the proposal
    for the written agreement circulated pursuant to paragraph 1, they shall submit those
    comments together with a thorough explanation to the CCP's competent authority within
    10 calendar days.
- article: Article 2(3)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: If relevant, the CCP's competent authority shall prepare a revised proposal
    and convene a meeting to agree on the final written agreement taking into account the
    deadline referred to in Article 18(1) of Regulation (EU) No 648/2012.
- article: Article 2(5)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: all members of the college
  deadline: null
  interpretive: null
  requirement_text: All members of the college will be bound by the written agreement adopted
    in accordance with paragraphs 1 to 3 of this Article.
- article: Article 3(1)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: Where a request for information is made to a college by a competent authority
    of a Member State which is not a member of the college in accordance with Article 18(3)
    of Regulation (EU) No 648/2012, the CCP's competent authority, after having consulted
    the college, shall decide on the most appropriate way to provide and request information
    to and from the authorities that are not members of the college.
- article: Article 3(2)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: each member of the college
  deadline: null
  interpretive: null
  requirement_text: Each member of the college shall designate one participant to attend the
    meetings of the college and may designate one alternate, with the exception of the CCP's
    competent authority which may require additional participants who shall have no voting
    rights.
- article: Article 3(3)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: relevant central banks
  deadline: null
  interpretive: null
  requirement_text: Where the central bank of issue of one of the most relevant Union currencies
    corresponds to more than one central bank, the relevant central banks shall determine
    the single representative who will participate in the college.
- article: Article 3(5)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: college members
  deadline: null
  interpretive: null
  requirement_text: Where in accordance with this Article there is more than one participant
    from a college member, or there are more college members belonging to the same Member
    State than number of votes that can be exercised by those college members in accordance
    with Article 19(3) of Regulation (EU) No 648/2012, that college member or those college
    members shall inform the college which participants shall exercise voting rights.
- article: Article 4(1)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: The CCP's competent authority shall ensure that the work of the college
    facilitates the tasks to be performed in accordance with Regulation (EU) No 648/2012.
- article: Article 4(2)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: college
  deadline: null
  interpretive: null
  requirement_text: The college shall notify ESMA of any tasks that the college performs in
    accordance with paragraph 1.
- article: Article 4(3)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: 'The CCP''s competent authority, shall at least ensure that: (a) the objectives
    of any meeting or activity of the college are clearly identified; (b) the college meetings
    or activities remain effective, while ensuring that all college members are fully informed
    of the college activities that are relevant to them; (c) the timetable for meetings or
    activities of the college is defined so that their outcome provides assistance to the
    supervision of the CCP; (d) the CCP and other key stakeholders have a clear understanding
    of the role and functioning of the college; (e) the activities of the college are regularly
    reviewed and remedial action is taken if the college is not operating effectively; (f)
    the agenda is set for an annual crisis management planning meeting amongst members of
    the college in cooperation with the CCP if necessary.'
- article: Article 4(4)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: To ensure the efficiency and effectiveness of the college, the CCP's competent
    authority shall act as a central point of contact for any matter related to the practical
    organisation of the college.
- article: Article 4(4)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: 'The CCP''s competent authority shall at least perform the following tasks:
    (a) draw-up, update and circulate the contact list of college members; (b) circulate the
    agenda as well as documentation for meetings or activities of the college; (c) record
    minutes of the meetings and formalise action points; (d) manage the college website or
    other electronic information-sharing mechanism, if any; (e) where practical, provide information
    and specialised teams where appropriate, to assist the college in its tasks; (f) share
    information in an appropriate manner among members of the college.'
- article: Article 4(5)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority and college
  deadline: null
  interpretive: null
  requirement_text: There shall be at least an annual meeting of the college and if deemed
    necessary by the CCP's competent authority, a meeting each time that a decision needs
    to be taken under Regulation (EU) No 648/2012.
- article: Article 4(5)
  law_celex: 32013R0876
  criticality: critical
  addressee: economic_operator
  applicable_entity: CCP's competent authority
  deadline: null
  interpretive: null
  requirement_text: The CCP's competent authority shall organise, periodically, meetings between
    members of the college and the senior management of the CCP.
