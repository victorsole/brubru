id: 23
name: China BEV Countervailing Duties (Reg 2024/2754)
policy_area: Trade and Economic Security
description: 'Commission Implementing Regulation (EU) 2024/2754 imposing definitive countervailing
  duties on imports of new battery electric vehicles (BEVs) for passenger transport originating
  in the People''s Republic of China. Adopted 29 October 2024 under Article 15 of the Basic
  Anti-Subsidy Regulation (Reg 2016/1037). Definitive additional ad valorem duties: BYD 17.0%,
  Geely 18.8%, SAIC 35.3%, Tesla (Shanghai) 7.8%, other cooperating 20.7%, all other companies
  35.3% — on top of the 6.5% conventional MFN tariff. Central legal finding: threat of material
  injury (Article 8(8)), not actual injury — provisional-duty securities released. All 5 undertaking
  offers rejected. Default 5-year duration.'
applicability: 'EU importers, EU customs authorities, Chinese exporting BEV producers (BYD/Geely/SAIC/Tesla
  Shanghai/other cooperating named in Annex/non-cooperating), EU BEV producers monitoring
  circumvention, EU automotive industry associations, Member State competent authorities.
  Product scope: new fully-electric passenger BEVs under CN code ex 8703 80 10 / TARIC 8703
  80 10 10. Excludes hybrids, plug-in hybrids, range-extended EVs, and BEVs for goods transport.'
is_startup_focused: false
is_published: false
laws:
- celex: 32024R2754
  title: Commission Implementing Regulation (EU) 2024/2754 of 29 October 2024 imposing a definitive
    countervailing duty on imports of new battery electric vehicles designed for the transport
    of persons originating in the People’s Republic of China
requirements:
- article: Article 1(1)
  law_celex: 32024R2754
  criticality: critical
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: Importers shall pay a definitive additional countervailing duty on imports
    of new battery electric vehicles for passenger transport (CN ex 8703 80 10, TARIC 8703
    80 10 10) originating in the People's Republic of China. The duty is expressed as an ad
    valorem rate on the CIF value at the EU border and applies on top of the conventional
    6.5% MFN customs duty.
- article: Article 1(2)
  law_celex: 32024R2754
  criticality: critical
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: 'The applicable rate depends on the exporting producer group: BYD Group
    17.0% (TARIC C184); Geely Group 18.8% (C185-C187 by entity); SAIC Group 35.3% (C188);
    Tesla (Shanghai) Co., Ltd 7.8% (C189); other cooperating companies named in the Annex
    20.7% (C190); all other companies 35.3% (C179). The combined total landed duty therefore
    ranges from 14.3% (Tesla Shanghai) to 41.8% (SAIC, non-cooperating).'
- article: Article 1(3)
  law_celex: 32024R2754
  criticality: critical
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: To benefit from the individual producer duty rate (rather than the 35.3%
    'all other companies' default), the importer shall present to Member State customs authorities
    a valid commercial invoice on which appears a dated and signed declaration by an official
    of the producing entity, certifying that the vehicles were manufactured by the named producer
    at its specified address with its TARIC additional code, and that the invoice information
    is complete and correct. Without the valid invoice, the 35.3% rate applies.
- article: Article 1(4)
  law_celex: 32024R2754
  criticality: important
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: Unless otherwise specified, the provisions in force concerning customs
    duties apply. This means standard Union Customs Code (Reg (EU) 952/2013) rules on origin
    determination, customs value calculation, customs procedures (release for free circulation,
    customs warehousing, etc.), and TARIC integration apply alongside this Regulation.
- article: Article 2
  law_celex: 32024R2754
  criticality: important
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs / customs authority
  deadline: '2024-07-08'
  interpretive: null
  requirement_text: Amounts secured by way of provisional countervailing duties under Commission
    Implementing Regulation (EU) 2024/1866 (provisional duties from 8 July 2024) shall be
    definitively released to importers. This is a consequence of the threat-of-injury finding
    (Article 8(8) of the Basic Regulation, Reg (EU) 2016/1037) and the consequent application
    of Article 16(2) — which forbids retroactive collection where actual material injury is
    not established. Importers shall apply to their Member State customs authority for release.
- article: Article 3 / Article 16(4) Basic Regulation
  law_celex: 32024R2754
  criticality: important
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: No retroactive countervailing duties apply to imports made between the
    start of registration (6 March 2024 under Reg (EU) 2024/785) and the entry into force
    of provisional duties. The conditions of Article 16(4) of the Basic Regulation (critical
    circumstances, massive imports, risk of undermining definitive measures) were not met.
    Imports during the registration period are duty-free for these CVD purposes.
- article: Annex (entity list)
  law_celex: 32024R2754
  criticality: critical
  addressee: economic_operator
  applicable_entity: Chinese exporting producer
  deadline: null
  interpretive: null
  requirement_text: To qualify for the 20.7% 'other cooperating companies' rate (TARIC additional
    code C190) rather than the 35.3% default, the exporting producer must be specifically
    named in the Annex to this Regulation. Producers not listed in the Annex AND not in the
    BYD / Geely / SAIC / Tesla (Shanghai) individual-rate groups are subject to the 35.3%
    all-other rate.
- article: Article 23 Basic Regulation (anti-circumvention)
  law_celex: 32024R2754
  criticality: important
  addressee: economic_operator
  applicable_entity: Chinese exporting producer / EU related importer
  deadline: null
  interpretive: null
  requirement_text: Circumvention practices — including assembly operations in third countries
    from Chinese kits/components where the value-added is below the threshold; minor product
    modifications to fall outside the CN code; channelling exports through low-rate producers
    without genuine production; absorption of duty by exporters/related importers — may trigger
    an anti-circumvention investigation under Article 23 of the Basic Regulation. Extension
    of duties to circumventing imports is the typical remedy.
- article: Article 18 Basic Regulation (expiry review)
  law_celex: 32024R2754
  criticality: recommended
  addressee: economic_operator
  applicable_entity: EU industry / European Commission
  deadline: null
  interpretive: null
  requirement_text: Definitive countervailing duties expire 5 years after entry into force
    (default 31 October 2029) unless an expiry review is initiated before expiry on a duly
    substantiated request by or on behalf of the EU industry. The Commission shall publish
    a notice of impending expiry in the Official Journal at an appropriate time in the last
    year of the duty period.
- article: Article 19 Basic Regulation (interim review)
  law_celex: 32024R2754
  criticality: recommended
  addressee: economic_operator
  applicable_entity: interested party (importer / exporter / EU producer / GOC)
  deadline: null
  interpretive: null
  requirement_text: An interim review of the duties may be requested by any interested party
    showing a change of circumstances of a lasting nature (e.g. termination of a subsidy programme,
    new evidence on subsidy rates). Interim reviews may result in repeal, modification or
    maintenance of the duties.
- article: Article 21 Basic Regulation (refunds)
  law_celex: 32024R2754
  criticality: recommended
  addressee: economic_operator
  applicable_entity: importer of Chinese BEVs
  deadline: null
  interpretive: null
  requirement_text: An importer may apply for refund of duties paid where it can demonstrate
    that the subsidy rate applicable to the actual producer of its imports, on the basis of
    which duties were collected, has been eliminated or reduced. Applications shall be submitted
    within six months of the date on which the amount of duty was duly determined.
- article: Article 13 Basic Regulation (price undertakings)
  law_celex: 32024R2754
  criticality: recommended
  addressee: economic_operator
  applicable_entity: Chinese exporting producer
  deadline: null
  interpretive: null
  requirement_text: 'Although all five undertaking offers received during this investigation
    (CCCME collective, BYD, Geely, SAIC, other cooperating) were rejected, exporting producers
    remain entitled to submit new undertaking offers at later procedural stages (e.g. interim
    review, expiry review). Any such offer must address the rejection grounds: product complexity
    / monitoring risk / cooperation / coverage / WTO-compatibility.'
