id: 12
name: FinTech Startup Compliance
policy_area: Economic and Financial Affairs
description: 'Essential compliance package for FinTech startups: payment services, e-money,
  crypto-assets, and data protection'
applicability: FinTech startups, payment service providers, crypto exchanges, digital wallets,
  neobanks
is_startup_focused: true
is_published: true
laws:
- celex: 32005L0001
