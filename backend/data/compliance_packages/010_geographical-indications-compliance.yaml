id: 10
name: Geographical Indications Compliance
policy_area: Agriculture
description: EU legal framework for Geographical Indications covering wine, spirits, agricultural
  products, and craft/industrial goods. Includes registration, protection, producer group
  governance, and labelling requirements.
applicability: Producer groups, wine producers, spirit drink producers, agricultural product
  makers (cheese, meat, oils), craft & industrial product manufacturers
is_startup_focused: false
is_published: true
laws:
- celex: 32014R0665
  title: Commission Delegated Regulation (EU) No 665/2014 of 11 March 2014 supplementing Regulation
    (EU) No 1151/2012 of the European Parliament and of the Council with regard to conditions
    of use of the optional quality term mountain product
- celex: 32018R0273
  title: Commission Delegated Regulation (EU) 2018/273 of 11 December 2017 supplementing Regulation
    (EU) No 1308/2013 of the European Parliament and of the Council as regards the scheme
    of authorisations for vine plantings, the vineyard register, accompanying documents and
    certification, the inward and outward register, compulsory declarations, notifications
    and publication of notified information, and supplementing Regulation (EU) No 1306/2013
    of the European Parliament and of the Council as regards the relevant checks and penalties,
    amending Commission Regulations (EC) No 555/2008, (EC) No 606/2009 and (EC) No 607/2009
    and repealing Commission Regulation (EC) No 436/2009 and Commission Delegated Regulation
    (EU) 2015/560
- celex: 32019R0787
  title: Regulation (EU) 2019/787 of the European Parliament and of the Council of 17 April
    2019 on the definition, description, presentation and labelling of spirit drinks, the
    use of the names of spirit drinks in the presentation and labelling of other foodstuffs,
    the protection of geographical indications for spirit drinks, the use of ethyl alcohol
    and distillates of agricultural origin in alcoholic beverages, and repealing Regulation
    (EC) No 110/2008
- celex: 32020D0583
  title: Council Decision (EU) 2020/583 of 25 March 2020 on the position to be taken on behalf
    of the European Union within the Trade Committee of the Free Trade Agreement between the
    European Union and the Republic of Singapore on the interpretation, pursuant to Article
    16.1(4)(d), of Articles 10.17 and 10.22 of that Agreement as regards changes to the protection
    of geographical indications for wines, spirits, agricultural products and foodstuffs registered
    in Singapore
- celex: 32021R1465
  title: Commission Delegated Regulation (EU) 2021/1465 of 6 July 2021 amending Regulation
    (EU) 2019/787 of the European Parliament and of the Council as regards the definition
    of allusions to legal names of spirit drinks or geographical indications for spirit drinks
    and their use in the description, presentation and labelling of spirit drinks other than
    the spirit drinks to which allusion is made
- celex: 32021R2117
  title: Regulation (EU) 2021/2117 of the European Parliament and of the Council of 2 December
    2021 amending Regulations (EU) No 1308/2013 establishing a common organisation of the
    markets in agricultural products, (EU) No 1151/2012 on quality schemes for agricultural
    products and foodstuffs, (EU) No 251/2014 on the definition, description, presentation,
    labelling and the protection of geographical indications of aromatised wine products and
    (EU) No 228/2013 laying down specific measures for agriculture in the outermost regions
    of the Union
- celex: 32025R0026
  title: Corrigendum to Commission Implementing Regulation (EU) 2025/26 of 30 October 2024
    laying down rules for the application of Regulation (EU) 2024/1143 of the European Parliament
    and of the Council as regards registrations, amendments, cancellations, enforcement of
    the protection, labelling and communication in respect of geographical indications and
    traditional specialities guaranteed, and amending Implementing Regulation (EU) 2019/34
    as regards geographical indications in the wine sector, and repealing Implementing Regulations
    (EU) No 668/2014 and (EU) 2021/1236 (OJ L, 2025/26, 15.1.2025)
