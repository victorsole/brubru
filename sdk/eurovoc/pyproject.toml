[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eurovoc"
version = "0.1.0"
description = "Standalone, open-source EuroVoc classifier: tag any text into the EU's official subject space (multilingual, incl. Catalan). A modern successor to PyEuroVoc."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beresol BV", email = "hello@beresol.eu" }]
keywords = ["eurovoc", "classification", "eu", "thesaurus", "multilabel", "nlp", "pyeurovoc"]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
local = ["sentence-transformers>=2.2"]
brubru = ["brubru>=0.1"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://brubru.beresol.eu/api/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["eurovoc*"]

[tool.setuptools.package-data]
eurovoc = ["data/*.json"]

[tool.pytest.ini_options]
markers = ["model: needs the sentence-transformers model (downloads/loads it)"]
