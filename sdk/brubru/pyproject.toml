[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brubru"
version = "0.1.0"
description = "Official Python client for the Brubru EU Data API: the whole EU institutional data estate behind one key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beresol BV", email = "hello@beresol.eu" }]
keywords = ["eu", "legislation", "eurovoc", "api", "regtech", "european-union"]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://brubru.beresol.eu/api"
Documentation = "https://brubru.beresol.eu/api/docs"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brubru*"]

[tool.pytest.ini_options]
markers = ["live: hits production read-only; needs BRUBRU_API_KEY"]
